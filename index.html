<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>Feldzug – Mittelalter-Strategie</title>
<style>
:root{--ink:#3a2c1c;--parch:#f0e3c0;--edge:#7a6647;--red:#b5432e;--blue:#3e5a8b;--ok:#3d6b2a;--bad:#a8321f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2118;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.panel{position:fixed;background:rgba(240,227,192,.94);border:1px solid var(--edge);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#hud{top:calc(env(safe-area-inset-top) + 6px);left:6px;right:6px;padding:6px 9px 7px}
#hud .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
#hud .r1 b.t{font-size:15px}
#hud .stock{font-size:11.5px;line-height:1.35;margin:2px 0 4px;opacity:.92}
#hud .stock b{font-weight:bold}
#hud .r2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bar{position:relative;height:21px;border:1px solid var(--edge);border-radius:5px;background:rgba(122,102,71,.18);overflow:hidden;font-size:11.5px;line-height:19px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#b9a36a;opacity:.75}
.bar span{position:relative;padding-left:5px;white-space:nowrap}
.bar.low i{background:#c0482f}
#log{left:6px;top:calc(env(safe-area-inset-top) + 132px);max-width:calc(100% - 66px);padding:4px 8px;font-size:11.5px;line-height:1.3;max-height:26vh;overflow:hidden}
#log div{margin:1px 0}
#log .battle{color:var(--bad);font-weight:bold}
#log .good{color:var(--ok)}
#log .dim{opacity:.7}
#info{left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 70px);padding:6px 10px;font-size:12.5px;min-height:32px;max-height:104px;overflow:auto}
#armybar{left:6px;right:58px;bottom:calc(env(safe-area-inset-bottom) + 178px);display:flex;gap:6px;overflow-x:auto;background:none;border:none;box-shadow:none;padding:2px 0}
.chip{flex:0 0 auto;padding:5px 10px;border-radius:16px;border:1px solid var(--edge);background:rgba(240,227,192,.95);font-size:12.5px;box-shadow:0 1px 4px rgba(0,0,0,.4);height:auto;color:var(--ink)}
.chip.sel{background:#e0a526;font-weight:bold}
#ctl{left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 6px);display:flex;gap:7px;background:none;border:none;box-shadow:none}
button{font:inherit;font-size:15px;color:var(--ink);background:linear-gradient(#f3e8c9,#dcc794);border:1px solid var(--edge);border-radius:10px;padding:0 10px;height:52px;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer}
button:active{transform:translateY(1px);background:#d4be88}
button:disabled{opacity:.45}
#bEnd{flex:2;background:linear-gradient(#c9573f,#9c3a27);color:#fff7e6;border-color:#6b2416;font-weight:bold}
#bCmd,#bShop{flex:1.1}
#bHelp{flex:0 0 52px;padding:0;font-weight:bold;background:linear-gradient(#f0cf6a,#d9a528)}
#bHelp.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(224,165,38,.5)}}
#zoom{right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:none;border:none;box-shadow:none}
#zoom button{width:44px;height:44px;padding:0;font-size:22px}
#overlay{position:fixed;inset:0;background:rgba(30,22,12,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
#overlay.hide{display:none}
#card{width:100%;max-width:470px;max-height:92vh;overflow:auto;background:var(--parch);border:2px solid var(--edge);border-radius:14px;padding:16px 18px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#card h1{margin:0 0 6px;font-size:21px}
#card h2{margin:12px 0 4px;font-size:15px}
#card p{margin:6px 0;font-size:14px;line-height:1.4}
#card ul{margin:6px 0 10px;padding-left:20px;font-size:13.5px;line-height:1.45}
#card small{opacity:.8;font-size:12px}
#card button.big{width:100%;margin-top:8px;height:48px}
#card button.main{background:linear-gradient(#c9573f,#9c3a27);color:#fff7e6;border-color:#6b2416;font-weight:bold}
#card .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(122,102,71,.35);font-size:13.5px}
#card .row button{height:38px;font-size:13.5px;flex:0 0 auto}
#card .row.col{display:block}
#card input[type=range]{width:100%}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud" class="panel">
  <div class="r1"><b class="t" id="turn"></b><span id="sup"></span></div>
  <div class="stock" id="stock"></div>
  <div class="r2"><span id="aname"></span><span id="aext"></span></div>
  <div class="bars">
    <div class="bar" id="bTroops"><i></i><span></span></div>

</div>

</div>

  <button id="bCmd">Befehle</button>
  <button id="bShop">Werkstatt</button>
  <button id="bHelp" aria-label="Hilfe">?</button>
  <button id="bEnd">Zug beenden ▶</button>
</div>

<div id="overlay"><div id="card"></div></div>

<script>
(function(){
'use strict';

/* ============================================================
   KONSTANTEN & DATEN
   ============================================================ */
const W=1000,H=1300,BGS=1.5;
const MOVE_F={road:1,plain:2,forest:3,hills:3,swamp:4,mountain:5};
const SUP_F ={road:1,plain:1.8,forest:3,hills:3,swamp:5,mountain:8};
const SUB_STEPS=10, COLLIDE_DIST=60, MAX_ARMIES=5, MIN_SPLIT=20;
const SIDE={
  A:{name:'Alderheim',color:'#B5432E',dark:'#7A2E1D',home:'burgA',enemy:'B'},
  B:{name:'Schwarzfeld',color:'#3E5A8B',dark:'#2A3D5E',home:'burgB',enemy:'A'}
};
const UK=['inf','pike','bow','cav','can','scout','pion'];
const ULAB={inf:'Schwertkämpfer',pike:'Piekeniere',bow:'Bogenschützen',cav:'Reiter',can:'Kanoniere',scout:'Späher',pion:'Pioniere'};
const RLAB={food:'Verpfl.',gold:'Gold',iron:'Eisen',wood:'Holz',arrows:'Pfeile',powder:'Pulver'};
const TYPE_LAB={castle:'Burg',village:'Dorf',mill:'Mühle',farm:'Hof',mine:'Eisenmine',lumber:'Holzfällerlager',market:'Marktflecken',tower:'Wachturm',ruin:'Ruine',cross:'Wegkreuz',bridge:'Brücke',pass:'Pass'};
const PROD={
  castle:{food:10,gold:6,iron:2,wood:2},
  village:{food:6,gold:3},mill:{food:5,gold:2},farm:{food:9,gold:1},
  mine:{iron:5,gold:1},lumber:{wood:5},market:{gold:8,food:2}
};
const isEco=n=>!!PROD[n.type]&&n.type!=='castle';

const NODES={
  burgA:   {name:'Burg Alderheim',       type:'castle',  x:170,y:1130,owner:'A'},
  burgB:   {name:'Burg Schwarzfeld',     type:'castle',  x:830,y:150, owner:'B'},
  wegkreuz:{name:'Wegkreuz',             type:'cross',   x:470,y:960},
  eichental:{name:'Eichental',           type:'village', x:190,y:830, owner:'A'},
  muehle:  {name:'Mühle am Fluss',       type:'mill',    x:260,y:512, owner:'A'},
  rehberg: {name:'Dorf Rehberg',         type:'village', x:500,y:760},
  ruine:   {name:'Alte Ruine',           type:'ruin',    x:760,y:900},
  moorbach:{name:'Moorbach',             type:'village', x:830,y:1070},
  wachturm:{name:'Wachturm Hohenfels',   type:'tower',   x:690,y:620},
  bruecke: {name:'Steinbrücke',          type:'bridge',  x:480,y:472},
  nordheim:{name:'Nordheim',             type:'village', x:620,y:300, owner:'B'},
  pass:    {name:'Bergpass',             type:'pass',    x:880,y:560},
  hofBirk: {name:'Hof Birkenau',         type:'farm',    x:330,y:900, owner:'A'},
  holzA:   {name:'Holzfäller Eichenwald',type:'lumber',  x:80, y:700, owner:'A'},
  mine:    {name:'Eisenmine Rotfels',    type:'mine',    x:690,y:780},
  hofWeid: {name:'Hof Weidenau',         type:'farm',    x:760,y:380, owner:'B'},
  holzB:   {name:'Holzfäller Nordwald',  type:'lumber',  x:400,y:200, owner:'B'},
  markt:   {name:'Marktflecken Weißbach',type:'market',  x:300,y:300},
  hofLind: {name:'Hof Lindenau',         type:'farm',    x:620,y:1040},
  heidelbach:{name:'Heidelbach',         type:'village', x:350,y:650},
  steinfurt:{name:'Steinfurt',           type:'village', x:910,y:950},
  eschenbach:{name:'Eschenbach',         type:'village', x:520,y:140, owner:'B'}
};
for(const id in NODES)NODES[id].id=id;

const EDGE_DEFS=[
  ['burgA','wegkreuz','road',0],['wegkreuz','rehberg','road',0],['rehberg','bruecke','road',0],
  ['bruecke','nordheim','road',0],['nordheim','burgB','road',0],
  ['burgA','eichental','plain',0],['eichental','rehberg','forest',0],['eichental','muehle','plain',0],
  ['muehle','bruecke','plain',0],['wegkreuz','ruine','plain',0],['wegkreuz','moorbach','plain',0],
  ['ruine','moorbach','swamp',0],['ruine','wachturm','hills',0],['wachturm','rehberg','plain',0],
  ['wachturm','nordheim','hills',0.59],['wachturm','pass','mountain',0],['pass','burgB','hills',0.27],
  ['eichental','hofBirk','plain',0],['hofBirk','wegkreuz','plain',0],['hofBirk','rehberg','plain',0],
  ['eichental','holzA','forest',0],['holzA','muehle','forest',0],
  ['heidelbach','eichental','plain',0],['heidelbach','rehberg','plain',0],['heidelbach','muehle','plain',0],
  ['rehberg','mine','hills',0],['mine','wachturm','hills',0],['mine','ruine','hills',0],
  ['hofLind','wegkreuz','plain',0],['hofLind','ruine','plain',0],['hofLind','moorbach','plain',0],
  ['steinfurt','ruine','plain',0],['steinfurt','moorbach','plain',0],
  ['hofWeid','nordheim','plain',0],['hofWeid','burgB','plain',0],
  ['holzB','nordheim','forest',0],['holzB','eschenbach','plain',0],['holzB','markt','plain',0],
  ['eschenbach','nordheim','plain',0],['eschenbach','burgB','plain',0],
  ['markt','bruecke','plain',0]
];
const RIVER=[[-30,560],[130,522],[260,512],[380,470],[480,472],[600,440],[740,420],[880,452],[1030,400]];

/* Werkstatt: was die Burg herstellen kann */
const ITEMS={
  inf:   {name:'Schwertkämpfer (20)',   units:{inf:20},  cost:{iron:10,gold:10},       turns:2},
  pike:  {name:'Piekeniere (20)',       units:{pike:20}, cost:{wood:10,iron:4,gold:6},  turns:2},
  bow:   {name:'Bogenschützen (20)',    units:{bow:20},  cost:{wood:8,gold:8},         turns:2},
  cav:   {name:'Reiter (10)',           units:{cav:10},  cost:{gold:30,iron:8,food:10}, turns:3},
  can:   {name:'Kanone + Mannschaft (4)',units:{can:4},  cost:{iron:24,wood:8,gold:30}, turns:4},
  scout: {name:'Späher (4)',            units:{scout:4}, cost:{gold:12},               turns:1},
  pion:  {name:'Pioniere (10)',         units:{pion:10}, cost:{wood:4,gold:8},         turns:2},
  arrows:{name:'Pfeile (+30)',          stock:{arrows:30},cost:{wood:6},               turns:1},
  powder:{name:'Schießpulver (+15)',    stock:{powder:15},cost:{gold:12,wood:4},       turns:2}
};
const ITEM_ORDER=['inf','pike','bow','cav','can','scout','pion','arrows','powder'];
/* Bauten der Pioniere */
const BUILD={
  schanze:{name:'Feldschanze',    cost:{wood:12,gold:6},          turns:2,pion:10,desc:'Palisade: +30 % Verteidigung, kleine Sicht'},
  turm:   {name:'Wachturm',       cost:{wood:16,gold:12},         turns:3,pion:10,desc:'+20 % Verteidigung, weite Sicht'},
  mauer:  {name:'Burgmauer ausbauen',cost:{wood:30,iron:10,gold:30},turns:4,pion:15,desc:'Burg-Verteidigung steigt (bis Stufe 3)'}
};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);

/* ---------- Graph ---------- */
const EDGES=[],EMAP={},ADJ={};
for(const id in NODES)ADJ[id]=[];
function applyEdge(e,type,ford){
  e.type=type;e.ford=!!ford;e.fordT=ford||0;
  e.move=e.len/100*MOVE_F[type]+(ford?1.5:0);
  e.sup=e.len/100*SUP_F[type]*(ford?2:1);
}
EDGE_DEFS.forEach(([a,b,type,ford])=>{
  const A=NODES[a],B=NODES[b];
  const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
  const rng=mulberry32(hashStr(a+b));
  const off=(rng()*2-1)*0.12*d*2;
  const cp={x:(A.x+B.x)/2+(-dy/d)*off,y:(A.y+B.y)/2+(dx/d)*off};
  const e={a,b,type0:type,ford0:ford,len:d*1.06,cp};
  applyEdge(e,type,ford);
  EDGES.push(e);EMAP[a+'|'+b]=e;EMAP[b+'|'+a]=e;
  ADJ[a].push({to:b,e});ADJ[b].push({to:a,e});
});
function resetEdges(){for(const e of EDGES)applyEdge(e,e.type0,e.ford0)}

function edgePoint(e,fromId,t){
  let P0=NODES[e.a],P2=NODES[e.b];
  if(fromId!==e.a){const tmp=P0;P0=P2;P2=tmp}
  const u=1-t,c=e.cp;
  return{x:u*u*P0.x+2*u*t*c.x+t*t*P2.x,y:u*u*P0.y+2*u*t*c.y+t*t*P2.y};
}
function dijkstra(src,key,blockedNodes,blockedEdges){
  const d={},prev={},done={};
  for(const id in NODES)d[id]=Infinity;
  d[src]=0;
  for(;;){
    let u=null,best=Infinity;
    for(const id in d){if(!done[id]&&d[id]<best){best=d[id];u=id}}
    if(u===null)break;
    done[u]=true;
    for(const {to,e} of ADJ[u]){
      if(blockedNodes&&blockedNodes.has(to))continue;
      if(blockedEdges&&blockedEdges.has(u+'|'+to))continue;
      const nd=d[u]+e[key];
      if(nd<d[to]){d[to]=nd;prev[to]=u}
    }
  }
  return{dist:d,prev};
}
function pathFromTo(src,dst,key){
  if(src===dst)return{path:[],cost:0};
  const r=dijkstra(src,key||'move');
  if(!isFinite(r.dist[dst]))return null;
  const path=[];let c=dst;
  while(c!==src){path.unshift(c);c=r.prev[c]}
  return{path,cost:r.dist[dst]};
}

/* ============================================================
   SPIELZUSTAND
   ============================================================ */
let G=null,selectedMsg='';
const troops=a=>{let s=0;for(const k of UK)s+=a.units[k]||0;return s};
const foodCap=a=>Math.round(30+troops(a)*0.11);
const arrowCap=a=>Math.round((a.units.bow||0)*0.27);
const powderCap=a=>Math.round((a.units.can||0)*0.75);
function speedOf(a){
  const u=a.units;let fast=true,any=false;
  for(const k of UK){if(u[k]>0){any=true;if(k!=='scout'&&k!=='cav')fast=false}}
  if(any&&fast)return 4.0;
  if(u.can>0)return 2.0;
  return 2.5;
}
function sightOf(a){
  const u=a.units;
  if(u.scout>0&&u.scout>=troops(a)*0.5)return 270;
  if(u.scout>0)return 200;
  return 150;
}
function startStock(){return{food:300,gold:120,iron:60,wood:60,arrows:80,powder:40}}
function blankUnits(){const u={};for(const k of UK)u[k]=0;return u}

function mkArmy(side,name,units,node){
  const u=blankUnits();for(const k in units)u[k]=units[k];
  const a={id:G.nextId++,side,name,units:u,food:0,arrows:0,powder:0,
    at:node,from:null,to:null,p:0,path:[],dest:null,action:null,
    retreating:false,alive:true,lastRate:0,lastCons:0,starving:false,oldPos:null,
    lastBattle:-9,halt:false,bold:false,rest:0,occ:0,startTroops:0};
  a.food=foodCap(a);a.arrows=arrowCap(a);a.powder=powderCap(a);a.startTroops=troops(a);
  return a;
}
function newGame(){
  resetEdges();
  G={turn:1,own:{},pl:{},loy:{},known:{},knownFort:{},fort:{},wall:{A:1,B:1},jobs:[],over:null,log:[],
     seen:{},visIds:{},intel:null,nextId:1,sel:null,cnt:{A:1,B:1},
     rnd:mulberry32((Date.now()&0xffff)+1),armies:[],
     stock:{A:startStock(),B:startStock()},queue:{A:[],B:[]},gar:{A:blankUnits(),B:blankUnits()}};
  for(const id in NODES){G.own[id]=NODES[id].owner||null;G.pl[id]=0;G.loy[id]=100}
  G.armies.push(mkArmy('A','Hauptheer',{inf:300,pike:180,bow:220,cav:90,can:40,scout:6,pion:20},'burgA'));
  G.armies.push(mkArmy('B','Hauptheer',{inf:260,pike:160,bow:180,cav:130,can:60,scout:6,pion:20},'burgB'));
  G.sel=G.armies[0].id;
  for(const id in NODES){
    const n=NODES[id];
    if(isEco(n)||n.type==='tower')G.known[id]={owner:G.own[id],plundered:false};
    G.knownFort[id]=null;
  }
  refreshKnown();
  logMsg('Dein Heer steht bereit. Tippe einen Ort an, um den Marsch zu befehlen.','dim');
}
function logMsg(text,cls){G.log.push({turn:G.turn,text,cls:cls||''});if(G.log.length>80)G.log.shift()}
const isPlundered=id=>G.pl[id]>G.turn;
const sideArmies=side=>G.armies.filter(a=>a.alive&&a.side===side);
const armyById=id=>G.armies.find(a=>a.id===id);
function selArmy(){
  let a=armyById(G.sel);
  if(!a||!a.alive||a.side!=='A'){a=sideArmies('A')[0]||null;G.sel=a?a.id:null}
  return a;
}
function armyPos(a){
  if(a.at!==null)return{x:NODES[a.at].x,y:NODES[a.at].y};
  return edgePoint(EMAP[a.from+'|'+a.to],a.from,a.p);
}
function nearestNode(x,y){
  let best=null,bd=Infinity;
  for(const id in NODES){const d=Math.hypot(NODES[id].x-x,NODES[id].y-y);if(d<bd){bd=d;best=id}}
  return best;
}

/* ---------- Sicht / Nebel ---------- */
function visSources(side){
  const out=[];
  for(const a of sideArmies(side)){const p=armyPos(a);out.push({x:p.x,y:p.y,r:sightOf(a)})}
  for(const id in NODES){
    if(G.own[id]!==side)continue;
    const n=NODES[id];
    out.push({x:n.x,y:n.y,r:n.type==='castle'?190:n.type==='tower'?250:110});
  }
  for(const id in G.fort){
    const f=G.fort[id];if(f.owner!==side)continue;
    out.push({x:NODES[id].x,y:NODES[id].y,r:f.type==='turm'?230:120});
  }
  return out;
}
function visibleAt(side,x,y){
  for(const s of visSources(side))if(Math.hypot(s.x-x,s.y-y)<s.r)return true;
  return false;
}
function refreshKnown(){
  for(const id in NODES){
    const n=NODES[id];
    if(!visibleAt('A',n.x,n.y))continue;
    if(isEco(n)||n.type==='tower')G.known[id]={owner:G.own[id],plundered:isPlundered(id)};
    G.knownFort[id]=G.fort[id]?{type:G.fort[id].type,owner:G.fort[id].owner}:null;
  }
  const now={};
  for(const b of sideArmies('B')){
    const p=armyPos(b);
    if(visibleAt('A',p.x,p.y)){
      G.seen[b.id]={x:p.x,y:p.y,turn:G.turn,troops:troops(b)};
      now[b.id]=true;
    }
  }
  G.visIds=now;
}

/* ---------- Versorgung ---------- */
function supplyInfo(a){
  if(!a||!a.alive)return{cost:Infinity,rate:0,route:[]};
  const en=sideArmies(SIDE[a.side].enemy);
  const bn=new Set(),be=new Set();
  for(const e of en){
    if(e.at!==null)bn.add(e.at);
    else{be.add(e.from+'|'+e.to);be.add(e.to+'|'+e.from)}
  }
  const home=SIDE[a.side].home;
  const r=dijkstra(home,'sup',bn,be);
  let cost=Infinity,anchor=null;
  if(a.at!==null){cost=r.dist[a.at];anchor=a.at}
  else{
    const e=EMAP[a.from+'|'+a.to];
    if(!be.has(a.from+'|'+a.to)){
      const cF=r.dist[a.from]+a.p*e.sup,cT=r.dist[a.to]+(1-a.p)*e.sup;
      if(cF<=cT){cost=cF;anchor=a.from}else{cost=cT;anchor=a.to}
    }
  }
  const route=[];
  if(isFinite(cost)&&anchor){let c=anchor;route.push(c);while(c!==home){c=r.prev[c];if(!c)break;route.push(c)}}
  const rate=isFinite(cost)?clamp(40-2*cost,0,40):0;
  return{cost,rate,route,anchor};
}

/* ---------- Bewegung ---------- */
function planArmy(a,target){
  if(a.at!==null){
    if(a.at===target){a.path=[];a.dest=null;return true}
    const r=pathFromTo(a.at,target);if(!r)return false;
    a.path=r.path;
  }else{
    const e=EMAP[a.from+'|'+a.to];
    const vt=pathFromTo(a.to,target),vf=pathFromTo(a.from,target);
    if(!vt||!vf)return false;
    const cT=(1-a.p)*e.move+vt.cost,cF=a.p*e.move+vf.cost;
    if(cT<=cF){a.path=[a.to].concat(vt.path)}
    else{const f=a.from;a.from=a.to;a.to=f;a.p=1-a.p;a.path=[a.to].concat(vf.path)}
  }
  a.dest=target;a.action=null;
  return true;
}
function routeSegs(a){
  const segs=[];
  if(a.at!==null){let prev=a.at;for(const n of a.path){segs.push([prev,n,0,1]);prev=n}}
  else{segs.push([a.from,a.to,a.p,1]);let prev=a.to;for(const n of a.path.slice(1)){segs.push([prev,n,0,1]);prev=n}}
  return segs;
}
function routeCost(a){let c=0;for(const [f,t,t0,t1] of routeSegs(a))c+=EMAP[f+'|'+t].move*(t1-t0);return c}
function stepArmy(a,mp){
  while(mp>1e-6&&!G.over){
    if(a.at!==null){
      if(!a.path.length)break;
      a.from=a.at;a.to=a.path[0];a.p=0;a.at=null;
    }
    const e=EMAP[a.from+'|'+a.to];
    const need=(1-a.p)*e.move;
    if(mp>=need-1e-9){
      mp-=need;a.at=a.to;a.p=0;a.from=a.to=null;a.path.shift();
      onArrive(a);
    }else{a.p+=mp/e.move;mp=0}
  }
}
function enemyAt(side,node){return sideArmies(SIDE[side].enemy).some(x=>x.at===node)}
function onArrive(a){
  const n=NODES[a.at];
  if(n.type==='tower'&&G.own[n.id]!==a.side&&!enemyAt(a.side,n.id)){
    G.own[n.id]=a.side;
    if(a.side==='A')logMsg('Du besetzt den '+n.name+' – weite Sicht.','good');
  }
  if(n.type==='castle'&&n.owner!==a.side&&!enemyAt(a.side,n.id)){
    G.over={winner:a.side,reason:a.side==='A'
      ?'Dein Heer hat '+n.name+' eingenommen!'
      :'Der Gegner hat '+n.name+' eingenommen.'};
  }
  if(a.dest===n.id)a.dest=null;
}

/* ---------- Aktionen: Plündern / Besetzen ---------- */
function canPlunder(a){
  if(!a||!a.alive||a.at===null)return false;
  const n=NODES[a.at];
  return isEco(n)&&G.own[n.id]!==a.side&&!isPlundered(n.id);
}
function canOccupy(a){
  if(!a||!a.alive||a.at===null)return false;
  const n=NODES[a.at];
  return isEco(n)&&G.own[n.id]!==a.side&&!enemyAt(a.side,n.id);
}
function doPlunder(a){
  const n=NODES[a.at];
  const gain=Math.min(45,Math.max(0,foodCap(a)-a.food));
  a.food+=gain;
  G.stock[a.side].gold+=15;
  G.pl[n.id]=G.turn+8;
  G.loy[n.id]=Math.max(0,G.loy[n.id]-40);
  if(a.side==='A')logMsg('Du plünderst '+n.name+': +'+Math.round(gain)+' Verpflegung, +15 Gold Beute. Das Dorf ist ausgeblutet.');
  else if(visibleAt('A',n.x,n.y))logMsg('Rauch über '+n.name+': der Gegner plündert dort.','bad');
}
function doOccupy(a){
  const n=NODES[a.at];
  const prev=G.own[n.id];
  G.own[n.id]=a.side;
  G.loy[n.id]=prev?55:75;
  a.occ=(a.occ||0)+1;
  if(a.side==='A')logMsg('Du besetzt '+n.name+(prev?' (dem Feind abgenommen)':'')+'. Es liefert jetzt für Alderheim.','good');
  else if(visibleAt('A',n.x,n.y))logMsg('Der Gegner besetzt '+n.name+'.','bad');
}

/* ---------- Teilen / Vereinen ---------- */
function splitArmy(a,amt){
  if(!a||!a.alive||a.at===null)return null;
  const take=blankUnits(),rest=blankUnits();let tn=0,rn=0;
  for(const k of UK){
    const n=clamp(Math.floor(amt[k]||0),0,a.units[k]);
    take[k]=n;rest[k]=a.units[k]-n;tn+=n;rn+=rest[k];
  }
  if(tn<MIN_SPLIT||rn<MIN_SPLIT)return null;
  if(sideArmies(a.side).length>=MAX_ARMIES)return null;
  const nb=mkArmy(a.side,'Abteilung '+(++G.cnt[a.side]),take,a.at);
  const fr=tn/(tn+rn);
  nb.food=a.food*fr;a.food-=nb.food;
  const fb=a.units.bow?take.bow/a.units.bow:0,fc=a.units.can?take.can/a.units.can:0;
  nb.arrows=a.arrows*fb;a.arrows-=nb.arrows;
  nb.powder=a.powder*fc;a.powder-=nb.powder;
  a.units=rest;a.startTroops=Math.max(1,Math.round(a.startTroops*(1-fr)));
  nb.startTroops=tn;
  G.armies.push(nb);
  return nb;
}
function mergeArmies(a,b){
  if(!a||!b||a===b||a.side!==b.side||a.at===null||a.at!==b.at)return false;
  for(const k of UK)a.units[k]+=b.units[k];
  a.food+=b.food;a.arrows+=b.arrows;a.powder+=b.powder;
  a.startTroops+=b.startTroops;
  a.food=Math.min(a.food,foodCap(a));a.arrows=Math.min(a.arrows,arrowCap(a));a.powder=Math.min(a.powder,powderCap(a));
  b.alive=false;
  G.armies=G.armies.filter(x=>x!==b);
  if(G.sel===b.id)G.sel=a.id;
  return true;
}

/* ---------- Wirtschaft / Werkstatt ---------- */
function income(side){
  const r={food:0,gold:0,iron:0,wood:0};
  for(const id in NODES){
    if(G.own[id]!==side)continue;
    const n=NODES[id],p=PROD[n.type];
    if(!p)continue;
    if(n.type!=='castle'&&isPlundered(id))continue;
    const m=n.type==='castle'?1:G.loy[id]/100;
    for(const k in p)r[k]+=p[k]*m;
  }
  return r;
}
function canPay(side,c){const s=G.stock[side];for(const k in c)if(s[k]<c[k])return false;return true}
function pay(side,c){const s=G.stock[side];for(const k in c)s[k]-=c[k]}
function costText(c){return Object.keys(c).map(k=>c[k]+' '+RLAB[k]).join(', ')}
function orderItem(side,key){
  const it=ITEMS[key];
  if(!it||G.queue[side].length>=3||!canPay(side,it.cost))return false;
  pay(side,it.cost);
  G.queue[side].push({key,left:it.turns});
  return true;
}
function cancelItem(side,idx){
  const q=G.queue[side][idx];if(!q)return;
  const c=ITEMS[q.key].cost,s=G.stock[side];
  for(const k in c)s[k]+=c[k];
  G.queue[side].splice(idx,1);
}
function processProduction(side){
  const q=G.queue[side];
  const working=q.slice(0,2);
  for(const w of working)w.left--;
  for(const w of working){
    if(w.left>0)continue;
    const it=ITEMS[w.key];
    if(it.units)for(const k in it.units)G.gar[side][k]+=it.units[k];
    if(it.stock)for(const k in it.stock)G.stock[side][k]+=it.stock[k];
    q.splice(q.indexOf(w),1);
    if(side==='A')logMsg('Fertig: '+it.name+(it.units?' – wartet in der Burg.':' – im Lager.'),'good');
  }
}
function garrisonCount(side){let s=0;for(const k of UK)s+=G.gar[side][k];return s}
function absorbGarrison(side){
  const gc=garrisonCount(side);if(!gc)return;
  const home=SIDE[side].home;
  const here=sideArmies(side).filter(a=>a.at===home);
  const st=G.stock[side];
  let tgt=here[0];
  if(!tgt){
    if(sideArmies(side).length>=MAX_ARMIES)return;
    tgt=mkArmy(side,'Abteilung '+(++G.cnt[side]),blankUnits(),home);
    tgt.startTroops=0;G.armies.push(tgt);
    if(side==='A')G.sel=G.sel||tgt.id;
    if(side==='A')logMsg('Neue '+tgt.name+' ('+gc+' Mann) formiert sich in der Burg.','good');
  }else if(side==='A')logMsg(gc+' Rekruten stoßen zu '+tgt.name+'.','good');
  for(const k of UK){tgt.units[k]+=G.gar[side][k];G.gar[side][k]=0}
  tgt.startTroops+=gc;
  tgt.food=Math.min(foodCap(tgt),tgt.food);
  const needF=foodCap(tgt)-tgt.food;const tf=Math.min(needF,st.food);tgt.food+=tf;st.food-=tf;
  const na=Math.max(0,arrowCap(tgt)-tgt.arrows),ta=Math.min(na,st.arrows);tgt.arrows+=ta;st.arrows-=ta;
  const np=Math.max(0,powderCap(tgt)-tgt.powder),tp=Math.min(np,st.powder);tgt.powder+=tp;st.powder-=tp;
}

/* ---------- Bauen ---------- */
function jobAt(node,kind,edge){return G.jobs.find(j=>j.node===node&&j.kind===kind&&(j.edge||null)===(edge||null))}
function buildOptions(a){
  const out=[];
  if(!a||!a.alive||a.at===null||(a.units.pion||0)<10)return out;
  const n=NODES[a.at];
  const myFort=G.fort[n.id];
  if(n.type!=='castle'){
    if(!myFort&&!jobAt(n.id,'schanze'))out.push({kind:'schanze',...BUILD.schanze});
    if((!myFort||(myFort.type==='schanze'&&myFort.owner===a.side))&&n.type!=='tower'&&!jobAt(n.id,'turm')&&(!myFort||myFort.owner===a.side))
      out.push({kind:'turm',...BUILD.turm});
  }else if(n.owner===a.side&&G.wall[a.side]<3&&!jobAt(n.id,'mauer')&&(a.units.pion||0)>=BUILD.mauer.pion){
    out.push({kind:'mauer',...BUILD.mauer});
  }
  for(const {to,e} of ADJ[a.at]){
    if(e.type==='road')continue;
    const key=a.at+'|'+to;
    if(G.jobs.some(j=>j.kind==='road'&&EMAP[j.edge]===e))continue;
    const L=e.len/100;
    out.push({kind:'road',edge:key,to,name:'Weg nach '+NODES[to].name+' ausbauen',
      cost:{wood:Math.ceil(L*4),gold:Math.ceil(L*3)},turns:Math.max(2,Math.ceil(L)+1),pion:10,
      desc:T_ROAD(e)});
  }
  return out;
}
function T_ROAD(e){return {plain:'Offenes Land',forest:'Wald',hills:'Hügel',swamp:'Sumpf',mountain:'Gebirge'}[e.type]+(e.ford?' (Furt)':'')+' → Straße'}
function startBuild(a,opt){
  if(!a||!opt||!canPay(a.side,opt.cost))return false;
  const need=opt.pion||10;
  if((a.units.pion||0)<need)return false;
  pay(a.side,opt.cost);
  G.jobs.push({side:a.side,kind:opt.kind,node:a.at,edge:opt.edge||null,left:opt.turns,need,name:opt.name});
  a.path=[];a.dest=null;a.action=null;
  return true;
}
function completeJob(j){
  if(j.kind==='schanze'||j.kind==='turm'){
    G.fort[j.node]={type:j.kind,owner:j.side};
    if(j.side==='A')logMsg(BUILD[j.kind].name+' bei '+NODES[j.node].name+' ist fertig.','good');
  }else if(j.kind==='mauer'){
    G.wall[j.side]=Math.min(3,G.wall[j.side]+1);
    if(j.side==='A')logMsg('Burgmauer auf Stufe '+G.wall[j.side]+' ausgebaut.','good');
  }else if(j.kind==='road'){
    const e=EMAP[j.edge];applyEdge(e,'road',0);
    if(j.side==='A')logMsg('Straße ausgebaut: Marsch und Nachschub werden schneller.','good');
  }
}
function constructionStep(){
  for(const j of G.jobs.slice()){
    const w=sideArmies(j.side).find(a=>a.at===j.node&&(a.units.pion||0)>=j.need&&a.lastBattle!==G.turn);
    if(!w)continue;
    j.left--;
    if(j.left<=0){completeJob(j);G.jobs.splice(G.jobs.indexOf(j),1)}
  }
}
function fortCheck(){
  for(const id in G.fort){
    const f=G.fort[id];
    const en=sideArmies(SIDE[f.owner].enemy).some(a=>a.at===id);
    const mine=sideArmies(f.owner).some(a=>a.at===id);
    if(en&&!mine){
      if(f.owner==='A')logMsg('Der Feind zerstört deine '+BUILD[f.type].name+' bei '+NODES[id].name+'.','bad');
      else if(visibleAt('A',NODES[id].x,NODES[id].y))logMsg('Du zerstörst die feindliche '+BUILD[f.type].name+' bei '+NODES[id].name+'.','good');
      delete G.fort[id];
    }
  }
}

/* ---------- Versorgungs-Abrechnung ---------- */
function upkeep(a){
  if(!a.alive)return;
  const st=G.stock[a.side];
  const cons=Math.ceil(troops(a)/60);
  const s=supplyInfo(a);
  a.lastRate=s.rate;a.lastCons=cons;
  const addF=Math.min(s.rate,st.food,Math.max(0,foodCap(a)-a.food));
  a.food+=addF;st.food-=addF;
  const addA=Math.min(s.rate*0.4,st.arrows,Math.max(0,arrowCap(a)-a.arrows));
  a.arrows+=addA;st.arrows-=addA;
  const addP=Math.min(s.rate*0.2,st.powder,Math.max(0,powderCap(a)-a.powder));
  a.powder+=addP;st.powder-=addP;
  a.food-=cons;
  a.starving=false;
  if(a.food<0){
    a.food=0;a.starving=true;
    for(const k of UK)a.units[k]=Math.floor(a.units[k]*0.93);
    if(a.side==='A')logMsg('Hunger bei '+a.name+'! Soldaten desertieren.','bad');
    checkDestroyed(a);
  }
  if(a.side==='A'&&a.alive&&s.rate===0&&!a.starving)logMsg(a.name+': Nachschublinie abgeschnitten – Vorräte nur noch aus dem Tross.','bad');
  if(a.side==='A'&&a.alive&&s.rate>0&&st.food<=0)logMsg('Das Lager in Alderheim ist leer – kein Nachschub möglich!','bad');
}
function checkDestroyed(a){
  if(a.alive&&troops(a)<60){
    a.alive=false;
    if(a.side==='A')logMsg(a.name+' ist aufgerieben.','battle');
    else if(G.visIds[a.id])logMsg('Eine feindliche Abteilung ist aufgerieben.','good');
  }
  if(!sideArmies(a.side).length&&!G.over){
    G.over={winner:SIDE[a.side].enemy,reason:a.side==='A'?'Dein letztes Heer ist aufgerieben.':'Das letzte gegnerische Heer ist aufgerieben.'};
  }
}

/* ---------- Kampf ---------- */
function terrBonus(a){
  let b=1;
  if(a.at!==null){
    const n=NODES[a.at];
    if(n.type==='castle'&&n.owner===a.side)b*=1.25+0.15*G.wall[a.side];
    else if(n.type==='tower')b*=1.25;
    else if(isEco(n))b*=1.1;
    const f=G.fort[n.id];
    if(f&&f.owner===a.side)b*=f.type==='turm'?1.2:1.3;
  }else{
    const e=EMAP[a.from+'|'+a.to];
    if(e.type==='forest'||e.type==='hills')b*=1.15;
    if(e.type==='swamp'||e.type==='mountain')b*=0.9;
  }
  return b;
}
const UPOW={inf:1.0,pike:0.9,cav:1.5,scout:0.2,pion:0.3};
function armyPower(a){
  const u=a.units;
  let s=0;for(const k in UPOW)s+=u[k]*UPOW[k];
  s+=u.bow*(a.arrows>0?1.2:0.3);
  s+=u.can*(a.powder>0?3.0:0.2);
  if(a.food<=0)s*=0.6;
  return s;
}
function applyLoss(a,f){for(const k of UK)a.units[k]=Math.floor(a.units[k]*(1-f))}
function resolveBattle(x){
  const site=armyPos(x);
  const near=side=>sideArmies(side).filter(z=>dist(armyPos(z),site)<COLLIDE_DIST*1.3);
  let PA=near('A'),PB=near('B');
  if(!PA.length||!PB.length)return;
  const ra=0.85+G.rnd()*0.3,rb=0.85+G.rnd()*0.3;
  let pa=0,pb=0;
  for(const z of PA)pa+=armyPower(z)*terrBonus(z);
  for(const z of PB)pb+=armyPower(z)*terrBonus(z);
  pa*=ra;pb*=rb;
  const aWins=pa>=pb;
  const winners=aWins?PA:PB,losers=aWins?PB:PA;
  const wp=Math.max(pa,pb),lp=Math.min(pa,pb);
  const before=PA.reduce((s,z)=>s+troops(z),0),beforeB=PB.reduce((s,z)=>s+troops(z),0);
  for(const z of PA.concat(PB)){
    if(z.units.bow>0)z.arrows=Math.max(0,z.arrows-14);
    if(z.units.can>0)z.powder=Math.max(0,z.powder-9);
  }
  const lossW=Math.min(0.35,0.08+0.3*lp/wp);
  for(const z of losers)applyLoss(z,0.45);
  for(const z of winners)applyLoss(z,lossW);
  const lossA=before-PA.reduce((s,z)=>s+troops(z),0),lossB=beforeB-PB.reduce((s,z)=>s+troops(z),0);
  const n=nearestNode(site.x,site.y);
  const where=dist(site,NODES[n])<70?NODES[n].name:'offenem Gelände';
  logMsg('Schlacht bei '+where+': '+(aWins?'Du siegst':'Du wirst geschlagen')+'. Eigene Verluste: '+lossA+', Gegner: ca. '+(Math.round(lossB/10)*10)+'.','battle');
  for(const z of PA.concat(PB)){z.lastBattle=G.turn;z.halt=true;z.action=null}
  for(const z of losers){
    z.path=[];z.dest=null;
    if(z.side==='A')planArmy(z,SIDE.A.home);else{z.retreating=true;planArmy(z,SIDE.B.home)}
    z.bold=false;
  }
  for(const z of winners)z.bold=false;
  if(losers[0].side==='A')logMsg('Rückzug zur Burg befohlen.','dim');
  for(const z of PA.concat(PB))checkDestroyed(z);
  if(!G.over){
    for(const z of losers){
      if(!z.alive)continue;
      for(let i=0;i<20;i++){
        const p=armyPos(z);
        let m=Infinity;for(const w of winners)if(w.alive)m=Math.min(m,dist(p,armyPos(w)));
        if(m>=95)break;
        stepArmy(z,0.1);
      }
    }
  }
}

/* ---------- Gegner-KI (gleiche Sichtregeln wie der Spieler) ---------- */
function aiProduce(){
  const q=G.queue.B,s=G.stock.B;
  if(q.length>=2)return;
  const order=[];
  if(s.arrows<40)order.push('arrows');
  if(s.powder<20)order.push('powder');
  const pool=['bow','inf','pike','cav','can','inf','bow'];
  order.push(pool[Math.floor(G.rnd()*pool.length)]);
  for(const k of order){if(canPay('B',ITEMS[k].cost)){orderItem('B',k);break}}
}
function nearestFreeEco(b,limit){
  const from=b.at!==null?b.at:b.to;
  const r=dijkstra(from,'move');
  let best=null,bd=Infinity;
  for(const id in NODES){
    const n=NODES[id];
    if(!isEco(n)||G.own[id]==='B')continue;
    if(enemyAt('B',id))continue;
    if(r.dist[id]<bd){bd=r.dist[id];best=id}
  }
  return bd<=limit?best:null;
}
function aiDecide(b){
  b.action=null;
  const home=SIDE.B.home;
  const bp=armyPos(b);
  const seen=[];
  for(const e of sideArmies('A')){
    const p=armyPos(e);
    if(visibleAt('B',p.x,p.y))seen.push({e,p,d:dist(bp,p)});
  }
  seen.sort((p,q)=>p.d-q.d);
  const near=seen[0];
  if(near)G.intel={node:nearestNode(near.p.x,near.p.y),turn:G.turn,troops:troops(near.e)};
  const sup=supplyInfo(b),fc=foodCap(b),base=b.startTroops||troops(b);
  if(!b.retreating&&(b.food<fc*0.3||(sup.rate<=2&&b.food<fc*0.55)||(troops(b)<0.45*base&&!b.bold)))b.retreating=true;
  if(b.retreating&&b.at===home&&b.food>=fc*0.8){
    b.rest=(b.rest||0)+1;
    if(troops(b)>=0.5*base||b.rest>=5){b.retreating=false;b.rest=0;b.bold=true}
  }
  if(b.retreating){
    if(b.at===home){b.path=[];b.dest=null}else planArmy(b,home);
    return;
  }
  if(b.at===home&&troops(b)<150&&b.name!=='Hauptheer'&&sideArmies('B').length>1){b.path=[];b.dest=null;return}
  if(b.at!==null){
    const n=NODES[b.at];
    if(isEco(n)&&G.own[n.id]!==b.side){
      if(G.own[n.id]!==null&&canPlunder(b)&&b.food<fc*0.85){b.action='plunder';b.path=[];b.dest=null;return}
      if(canOccupy(b)&&(b.occ||0)<4){b.action='occupy';b.path=[];b.dest=null;return}
    }
  }
  if(near&&troops(b)>=0.8*troops(near.e)){planArmy(b,nearestNode(near.p.x,near.p.y));return}
  if(G.intel&&G.turn-G.intel.turn<4&&troops(b)>=0.8*G.intel.troops){planArmy(b,G.intel.node);return}
  if((b.occ||0)<2){
    const t=nearestFreeEco(b,7);
    if(t){planArmy(b,t);return}
  }
  if(b.food<fc*0.7){
    const t=nearestFreeEco(b,9);
    if(t){planArmy(b,t);return}
  }
  planArmy(b,SIDE.A.home);
}
function aiActAll(){
  const bs=sideArmies('B');
  const home=SIDE.B.home;
  const athome=bs.filter(x=>x.at===home);
  for(let i=1;i<athome.length;i++)mergeArmies(athome[0],athome[i]);
  for(const b of sideArmies('B'))aiDecide(b);
}

/* ---------- Zugablauf ---------- */
function endTurn(){
  if(G.over)return;
  aiProduce();aiActAll();
  for(const a of G.armies)if(a.alive){a.oldPos=armyPos(a);a.halt=false}
  const stay=new Set();
  for(const a of G.armies){
    if(!a.alive||!a.action)continue;
    if(a.action==='plunder'&&canPlunder(a)){doPlunder(a);stay.add(a.id)}
    else if(a.action==='occupy'&&canOccupy(a)){doOccupy(a);stay.add(a.id)}
    a.action=null;
  }
  for(const j of G.jobs){
    const w=sideArmies(j.side).find(a=>a.at===j.node&&(a.units.pion||0)>=j.need);
    if(w)stay.add(w.id);
  }
  for(let s=0;s<SUB_STEPS&&!G.over;s++){
    for(const a of G.armies){
      if(a.alive&&!a.halt&&!stay.has(a.id))stepArmy(a,speedOf(a)/SUB_STEPS);
    }
    if(G.over)break;
    const As=sideArmies('A'),Bs=sideArmies('B');
    let fought=false;
    for(const a of As){
      for(const b of Bs){
        if(a.lastBattle===G.turn&&b.lastBattle===G.turn)continue;
        if(a.lastBattle===G.turn-1&&b.lastBattle===G.turn-1&&s<4)continue;
        if(dist(armyPos(a),armyPos(b))<COLLIDE_DIST){resolveBattle(a);fought=true;break}
      }
      if(fought)break;
    }
  }
  if(!G.over){
    for(const side of ['A','B']){
      const inc=income(side),st=G.stock[side];
      for(const k in inc)st[k]=Math.min(k==='food'?400:999,st[k]+inc[k]);
      processProduction(side);
    }
    for(const id in NODES){if(!isPlundered(id))G.loy[id]=Math.min(100,G.loy[id]+4)}
    for(const a of G.armies)upkeep(a);
    constructionStep();
    fortCheck();
    G.armies=G.armies.filter(x=>x.alive||false);
    absorbGarrison('A');absorbGarrison('B');
  }
  const wasVis=G.visIds||{};
  G.turn++;
  refreshKnown();
  for(const id in G.visIds)if(!wasVis[id]){
    const b=armyById(Number(id));
    if(b)logMsg('Feindliche Abteilung gesichtet (ca. '+Math.round(troops(b)/10)*10+' Mann).','bad');
  }
  selArmy();
  animStart=performance.now();
}

/* ---------- Karte zeichnen ---------- */
const nodeK=()=>clamp(0.95/view.s,0.7,2.4);
function strokeEdge(e){
  const A=NODES[e.a],B=NODES[e.b];
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo(e.cp.x,e.cp.y,B.x,B.y);ctx.stroke();
}
function drawEdges(){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const e of EDGES){
    ctx.setLineDash([]);
    if(e.type==='road'){
      ctx.strokeStyle='rgba(122,94,62,.38)';ctx.lineWidth=8;strokeEdge(e);
      ctx.strokeStyle='#8B6B47';ctx.lineWidth=2.2;ctx.setLineDash([1,7]);strokeEdge(e);
    }else{
      const st={plain:['#9A8058',1.8,[2,8]],forest:['#4F6E3F',2,[1,8]],hills:['#8F7B4E',2,[5,6]],swamp:['#55623D',2.2,[1,5]],mountain:['#6E5F45',2.2,[7,6]]}[e.type];
      ctx.strokeStyle='rgba(122,94,62,.16)';ctx.lineWidth=5;strokeEdge(e);
      ctx.strokeStyle=st[0];ctx.lineWidth=st[1];ctx.setLineDash(st[2]);strokeEdge(e);
    }
    ctx.setLineDash([]);
    if(e.ford){
      const p=edgePoint(e,e.a,e.fordT);
      ctx.strokeStyle='#4C7A9C';ctx.lineWidth=1.6;
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(p.x-12,p.y+i*5);ctx.quadraticCurveTo(p.x-6,p.y+i*5-3,p.x,p.y+i*5);ctx.quadraticCurveTo(p.x+6,p.y+i*5+3,p.x+12,p.y+i*5);ctx.stroke()}
    }
  }
  for(const j of G.jobs){
    if(j.kind!=='road'||j.side!=='A')continue;
    const e=EMAP[j.edge];
    ctx.strokeStyle='rgba(224,165,38,.9)';ctx.lineWidth=3;ctx.setLineDash([3,5]);strokeEdge(e);ctx.setLineDash([]);
  }
}
function drawSupplyLine(a){
  if(!a||!a.alive)return;
  const s=supplyInfo(a);
  if(!s.route||s.route.length<1||s.rate<=0)return;
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='rgba(61,107,42,.85)';ctx.lineWidth=3.2/view.s*0.9;ctx.setLineDash([9/view.s,7/view.s]);
  ctx.beginPath();
  const p0=armyPos(a);ctx.moveTo(p0.x,p0.y);
  let prev=s.route[0];ctx.lineTo(NODES[prev].x,NODES[prev].y);
  for(let i=1;i<s.route.length;i++){
    const e=EMAP[prev+'|'+s.route[i]];
    for(let j=1;j<=12;j++){const p=edgePoint(e,prev,j/12);ctx.lineTo(p.x,p.y)}
    prev=s.route[i];
  }
  ctx.stroke();ctx.restore();
}
function drawRoute(a,main){
  if(!a||!a.alive||!a.path.length)return;
  const segs=routeSegs(a);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  const trace=()=>{
    ctx.beginPath();const p0=armyPos(a);ctx.moveTo(p0.x,p0.y);
    for(const [f,t,t0,t1] of segs){const e=EMAP[f+'|'+t];for(let j=1;j<=14;j++){const p=edgePoint(e,f,t0+(t1-t0)*j/14);ctx.lineTo(p.x,p.y)}}
    ctx.stroke();
  };
  if(main){
    ctx.strokeStyle='rgba(60,40,10,.55)';ctx.lineWidth=6/view.s;trace();
    ctx.strokeStyle='#E0A526';ctx.lineWidth=3.4/view.s;ctx.setLineDash([10/view.s,6/view.s]);trace();
  }else{
    ctx.strokeStyle='rgba(122,46,29,.75)';ctx.lineWidth=2.2/view.s;ctx.setLineDash([6/view.s,6/view.s]);trace();
  }
  ctx.restore();
}
function routeMarks(a){
  const marks=[];let acc=0,next=speedOf(a),k=1;
  for(const [f,t,t0,t1] of routeSegs(a)){
    const e=EMAP[f+'|'+t],c=e.move*(t1-t0);
    while(acc+c>=next-1e-9&&c>0){
      const fr=(next-acc)/c,p=edgePoint(e,f,t0+(t1-t0)*fr);
      marks.push({x:p.x,y:p.y,k});k++;next+=speedOf(a);
    }
    acc+=c;
  }
  return marks;
}
const w2s=(x,y)=>({x:x*view.s+view.x,y:y*view.s+view.y});
function haloText(t,x,y,size,col,align,italic){
  ctx.font=(italic?'italic ':'')+size+'px Georgia, serif';ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';
  ctx.lineWidth=3.2;ctx.strokeStyle='rgba(243,231,201,.92)';ctx.lineJoin='round';ctx.strokeText(t,x,y);
  ctx.fillStyle=col;ctx.fillText(t,x,y);
}
function drawShield(x,y,side,count,selected,ghost,sz){
  const col=SIDE[side].color,dk=SIDE[side].dark;
  const w=sz*0.9,h=sz*1.1;
  ctx.save();ctx.translate(x,y-h*0.55);
  if(selected){ctx.fillStyle='rgba(224,165,38,.4)';ctx.beginPath();ctx.arc(0,h*0.1,sz*1.05,0,6.283);ctx.fill()}
  ctx.beginPath();ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/2);ctx.lineTo(w/2,h*0.1);ctx.quadraticCurveTo(w/2,h*0.42,0,h/2);ctx.quadraticCurveTo(-w/2,h*0.42,-w/2,h*0.1);ctx.closePath();
  if(ghost){ctx.globalAlpha=.55;ctx.setLineDash([4,3])}
  ctx.fillStyle=ghost?'rgba(243,231,201,.7)':col;ctx.fill();
  ctx.strokeStyle=dk;ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=ghost?dk:'rgba(255,246,225,.9)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-h*0.3);ctx.lineTo(0,h*0.3);ctx.moveTo(-w*0.25,-h*0.08);ctx.lineTo(w*0.25,-h*0.08);ctx.stroke();
  if(ghost){ctx.fillStyle=dk;ctx.font='bold '+(sz*0.7)+'px Georgia';ctx.textAlign='center';ctx.fillText('?',0,h*0.12)}
  ctx.restore();ctx.globalAlpha=1;
  if(count!=null)haloText(String(count),x,y+13,11,dk,'center',false);
}
function renderPos(a){
  const p=armyPos(a);
  if(!a.oldPos)return p;
  const t=clamp((performance.now()-animStart)/ANIM_MS,0,1);
  if(t>=1)return p;
  const k=1-Math.pow(1-t,3);
  return{x:a.oldPos.x+(p.x-a.oldPos.x)*k,y:a.oldPos.y+(p.y-a.oldPos.y)*k};
}

function render(){
  if(!G||!bg)return;
  const pw=cv.width,ph=cv.height;
  const sa=selArmy();
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#2b2118';ctx.fillRect(0,0,pw,ph);
  ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);
  ctx.drawImage(bg,0,0,W,H);
  drawEdges();
  drawSupplyLine(sa);
  for(const a of sideArmies('A'))if(a!==sa)drawRoute(a,false);
  drawRoute(sa,true);
  const k=nodeK();
  const order=Object.keys(NODES).sort((p,q)=>NODES[p].y-NODES[q].y);
  for(const id of order){
    const n=NODES[id];
    if(n.type==='castle')drawWalls(n,k);
    drawNodeSymbol(n,k);
    if(G.knownFort[id])drawForts(n,k,G.knownFort[id]);
  }
  for(const j of G.jobs){
    if(j.side!=='A'||j.kind==='road')continue;
    const n=NODES[j.node];
    ctx.save();ctx.translate(n.x,n.y);ctx.scale(k,k);ctx.strokeStyle='#E0A526';ctx.lineWidth=2;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.arc(0,2,34,0,6.283);ctx.stroke();ctx.restore();
  }
  if(sa&&sa.dest&&sa.path.length){
    const d=NODES[sa.dest];
    ctx.strokeStyle='#E0A526';ctx.lineWidth=3/view.s;ctx.beginPath();ctx.arc(d.x,d.y,30*k,0,6.283);ctx.stroke();
  }

  fctx.setTransform(1,0,0,1,0,0);fctx.globalCompositeOperation='source-over';
  fctx.clearRect(0,0,fg.width,fg.height);
  fctx.fillStyle='rgba(40,29,16,.46)';fctx.fillRect(0,0,fg.width,fg.height);
  fctx.globalCompositeOperation='destination-out';
  for(const s of visSources('A')){
    const sx=(s.x*view.s+view.x)*dpr,sy=(s.y*view.s+view.y)*dpr,rr=s.r*view.s*dpr;
    const gr=fctx.createRadialGradient(sx,sy,rr*0.55,sx,sy,rr);
    gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle=gr;fctx.beginPath();fctx.arc(sx,sy,rr,0,6.283);fctx.fill();
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(fg,0,0);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const id of order){
    const n=NODES[id];const p=w2s(n.x,n.y);
    if(p.x<-80||p.x>cw+80||p.y<-60||p.y>ch+60)continue;
    const big=n.type==='castle';
    if(!big&&view.s<0.38&&n.type!=='village'&&n.type!=='farm')continue;
    const kn=G.known[id];
    const owner=n.type==='castle'?n.owner:(kn?kn.owner:null);
    const col=owner?SIDE[owner].dark:'#4A3D2E';
    const off=(big?36:28)*k*view.s;
    haloText(n.name,p.x,p.y+off+4,big?13:11.5,col,'center',true);
    if(kn&&kn.plundered&&isEco(n))haloText('geplündert',p.x,p.y+off+17,10,'#8B2A1A','center',true);
  }
  if(sa)for(const m of routeMarks(sa)){
    const p=w2s(m.x,m.y);
    ctx.fillStyle='#E0A526';ctx.strokeStyle='#5A3A08';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.283);ctx.fill();ctx.stroke();
    ctx.fillStyle='#3A2408';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(m.k),p.x,p.y+.5);ctx.textBaseline='alphabetic';
  }
  for(const j of G.jobs){
    if(j.side!=='A')continue;
    const n=NODES[j.node],p=w2s(n.x,n.y);
    haloText('Bau: noch '+j.left,p.x,p.y-30*k*view.s-4,10.5,'#7A4A08','center',true);
  }
  armyHits=[];
  const groups={};
  const vis=[];
  for(const b of sideArmies('B')){
    const pb=armyPos(b);
    if(visibleAt('A',pb.x,pb.y))vis.push(b);
    else if(G.seen[b.id]){
      const sn=G.seen[b.id],ago=G.turn-sn.turn;
      if(ago>0&&ago<12){
        const s=w2s(sn.x,sn.y);
        drawShield(s.x,s.y,'B',null,false,true,22);
        haloText('zuletzt gesehen (vor '+ago+')',s.x,s.y+14,10,'#4A3D2E','center',true);
      }
    }
  }
  const list=vis.concat(sideArmies('A'));
  for(const a of list){
    const q=renderPos(a),s=w2s(q.x,q.y);
    const key=Math.round(s.x/26)+'_'+Math.round(s.y/26);
    const idx=groups[key]=(groups[key]||0)+1;
    const ox=(idx-1)*20-((idx-1)>0?0:0);
    const x=s.x+ox,y=s.y;
    const mine=a.side==='A';
    drawShield(x,y,a.side,mine?troops(a):Math.round(troops(a)/10)*10,mine&&a===sa,false,mine?26:24);
    if(!mine)haloText('Heer '+SIDE.B.name,x,y+25,10.5,SIDE.B.dark,'center',true);
    if(mine)armyHits.push({id:a.id,x,y:y-14});
  }
  ctx.setTransform(1,0,0,1,0,0);
}

function setBar(id,val,cap,text,low){
  const el=$(id);
  el.firstElementChild.style.width=clamp(cap>0?val/cap*100:0,0,100)+'%';
  el.lastElementChild.textContent=text;
  el.classList.toggle('low',!!low);
}
function updateHud(){
  const a=selArmy();
  const st=G.stock.A,inc=income('A');
  $('turn').textContent='Zug '+G.turn+' · '+SIDE.A.name;
  const f=v=>Math.round(v);
  $('stock').innerHTML='Lager: <b>Verpfl. '+f(st.food)+'</b> (+'+f(inc.food)+') · <b>Gold '+f(st.gold)+'</b> (+'+f(inc.gold)+') · Eisen '+f(st.iron)+' (+'+f(inc.iron)+') · Holz '+f(st.wood)+' (+'+f(inc.wood)+') · Pfeile '+f(st.arrows)+' · Pulver '+f(st.powder);
  if(!a){$('aname').textContent='Kein Heer';return}
  const s=supplyInfo(a);
  $('sup').innerHTML=s.rate>0?'<b class="ok">Nachschub +'+f(s.rate)+'</b>':'<b class="bad">Nachschub gekappt</b>';
  $('aname').innerHTML='<b>'+a.name+'</b> · '+troops(a)+' Mann';
  $('aext').textContent='−'+Math.ceil(troops(a)/60)+' Verpfl./Zug';
  setBar('bTroops',troops(a),Math.max(a.startTroops,troops(a)),'Mann '+troops(a),troops(a)<a.startTroops*0.5);
  setBar('bFood',a.food,foodCap(a),'Brot '+f(a.food),a.food<foodCap(a)*0.25);
  setBar('bArrows',a.arrows,Math.max(1,arrowCap(a)),'Pfeile '+f(a.arrows),a.arrows<=0&&a.units.bow>0);
  setBar('bPowder',a.powder,Math.max(1,powderCap(a)),'Pulver '+f(a.powder),a.powder<=0&&a.units.can>0);
  $('bEnd').disabled=!!G.over;
  const L=$('log');
  L.innerHTML=G.log.slice(-3).map(l=>'<div class="'+l.cls+'">'+l.text+'</div>').join('');
  const ab=$('armybar');
  ab.innerHTML=sideArmies('A').map(x=>'<button class="chip'+(x===a?' sel':'')+'" data-id="'+x.id+'">'+x.name+' · '+troops(x)+'</button>').join('');
  ab.querySelectorAll('button').forEach(b=>b.onclick=()=>{G.sel=Number(b.dataset.id);const x=selArmy();selectedMsg='';centerOn(x);updateHud();dirty=true});
  ab.style.display=sideArmies('A').length>1?'flex':'none';
  if(!selectedMsg){
    const where=a.at!==null?NODES[a.at].name:'unterwegs';
    const extra=[];
    if(canPlunder(a))extra.push('Plündern möglich');
    else if(canOccupy(a))extra.push('Besetzen möglich');
    if(G.jobs.some(j=>j.side==='A'&&j.node===a.at))extra.push('Bau läuft');
    const gc=garrisonCount('A');

function describeNode(id){
  const n=NODES[id],a=selArmy();
  const kn=G.known[id];
  let s='<b>'+n.name+'</b> ('+TYPE_LAB[n.type]+')';
  if(n.type==='castle')s+=' – '+SIDE[n.owner].name;
  else if(kn&&(isEco(n)||n.type==='tower')){
    s+=' – '+(kn.owner?SIDE[kn.owner].name:'niemandes Land');
    if(kn.plundered)s+=', geplündert';
  }
  if(isEco(n)){
    const p=PROD[n.type];
    s+='<br><small>Liefert pro Zug: '+Object.keys(p).map(k=>p[k]+' '+RLAB[k]).join(', ')+'</small>';
  }
  const kf=G.knownFort[id];
  if(kf)s+='<br><small>'+BUILD[kf.type].name+' ('+SIDE[kf.owner].name+')</small>';

    s+='<br>Marsch: ca. '+turns+' Zug'+(turns===1?'':'e');
  }
  return s;
}


/* ---------- Ratgeber ---------- */
function advice(){
  const out=[],a=selArmy(),st=G.stock.A,inc=income('A');
  if(!a)return out;
  const add=(prio,text,go)=>out.push({prio,text,go:go||null});
  const from=a.at!==null?a.at:a.to;
  const r=dijkstra(from,'move');
  const sup=supplyInfo(a),fc=foodCap(a);
  const vis=sideArmies('B').filter(b=>G.visIds[b.id]);
  const nearE=vis.map(b=>({b,d:dist(armyPos(a),armyPos(b))})).sort((p,q)=>p.d-q.d)[0];
  if(nearE&&nearE.d<260){
    const me=troops(a),en=troops(nearE.b);
    if(me>=en*1.2)add(95,'Feind in der Nähe (ca. '+Math.round(en/10)*10+' Mann), du bist stärker. Angreifen oder in Burg/Turm abwarten, bis er herankommt.');
    else add(98,'Feind in der Nähe (ca. '+Math.round(en/10)*10+' Mann) und stärker oder gleich stark. Zieh dich zu Burg, Turm oder Schanze zurück oder vereine deine Abteilungen.',{node:a.at===SIDE.A.home?null:SIDE.A.home});
  }
  if(a.starving||a.food<fc*0.25)add(97,'Verpflegung fast leer! Zurück Richtung Burg, solange der Nachschub fließt, oder einen Ort plündern.',{node:SIDE.A.home});
  else if(sup.rate<=0)add(96,'Nachschublinie gekappt. Verpflegung reicht noch ca. '+Math.floor(a.food/Math.max(1,a.lastCons||Math.ceil(troops(a)/60)))+' Züge – Weg zum Nachschub freikämpfen oder umkehren.');
  if(a.units.bow>0&&a.arrows<5)add(80,'Pfeile aufgebraucht: Bogenschützen kämpfen kaum noch. In der Werkstatt Pfeile bestellen und nahe der Burg auffüllen lassen.');
  if(a.units.can>0&&a.powder<3)add(80,'Pulver fast leer: Kanonen sind nutzlos. Schießpulver in der Werkstatt bestellen.');
  if(canPlunder(a)&&a.food<fc*0.6)add(85,'Hier lässt sich plündern: füllt Verpflegung auf und bringt Gold (Ort fällt 8 Züge aus). Befehle → Plündern.');
  if(canOccupy(a))add(88,'Dieser Ort ist frei. Besetzen bringt jeden Zug Rohstoffe. Befehle → Besetzen.');
  const q=G.queue.A;
  if(q.length<2){
    let t='Werkstatt leer';
    if(st.arrows<40)t+=': Pfeile bestellen (Vorrat '+Math.round(st.arrows)+')';
    else if(st.powder<20)t+=': Pulver bestellen (Vorrat '+Math.round(st.powder)+')';
    else if(canPay('A',ITEMS.inf.cost))t+=': Schwertkämpfer, Bogenschützen oder Kanonen herstellen, solange Gold/Eisen reichen';
    else t+=' – Rohstoffe sammeln (Gold '+Math.round(st.gold)+', Eisen '+Math.round(st.iron)+')';
    add(60,t+'.');
  }
  if(garrisonCount('A')>0&&!sideArmies('A').some(x=>x.at===SIDE.A.home))add(55,'In der Burg warten Rekruten. Sie bilden eine neue Abteilung und lassen sich später mit dem Heer vereinen.');
  let best=null,bd=Infinity;
  for(const id in NODES){
    const n=NODES[id];
    if(!isEco(n)||G.own[id]==='A'||id===a.at)continue;
    const known=G.known[id];
    if(known&&known.owner==='B'&&G.turn<4)continue;
    if(r.dist[id]<bd){bd=r.dist[id];best=id}
  }
  if(best&&!a.path.length&&bd<10&&G.turn<30)add(70,'Nächstes freies Ziel: '+NODES[best].name+' ('+TYPE_LAB[NODES[best].type]+', ca. '+Math.ceil(bd/speedOf(a))+' Züge). Besetzen steigert dein Einkommen.',{node:best});
  if(sideArmies('A').length===1&&troops(a)>=500&&a.at!==null&&G.turn>=2)add(50,'Teile eine kleine Abteilung (ca. 100–150 Mann) ab, die Höfe und Dörfer besetzt, während das Hauptheer zusammenbleibt.');
  if((a.units.pion||0)>=10&&a.at!==null&&NODES[a.at].type!=='castle'&&!G.fort[a.at]&&buildOptions(a).length>0&&G.turn>2)add(45,'Mit deinen Pionieren: eine Feldschanze oder einen Wachturm an einem wichtigen Ort bauen (Befehle → Bauen).');
  if(G.wall.A<2&&(a.units.pion||0)>=15&&a.at===SIDE.A.home)add(40,'Burgmauer ausbauen macht deine Burg deutlich sicherer.');
  if(a.at!==null&&NODES[a.at].type==='castle'&&G.turn<=2&&!a.path.length)add(75,'Tippe einen Ort auf der Karte an: gelbe Zahlen zeigen, wo dein Heer nach 1., 2., … Zügen steht. Danach Zug beenden.');
  if(!a.path.length&&!out.some(o=>o.prio>=70)&&G.turn>=6)add(30,'Willst du den Sieg? Marschiere mit dem vereinten Heer zur Burg Schwarzfeld, wenn Verpflegung und Munition voll sind – oder vorher den Gegner bei einem Turm stellen.',{node:'burgB'});
  if(!out.length)add(10,'Lage ruhig. Zug beenden, oder Heer neu positionieren.');
  out.sort((p,q)=>q.prio-p.prio);
  return out;
}

/* ---------- Eingabe ---------- */
function clampView(){
  const mx=60;
  if(W*view.s<=cw)view.x=(cw-W*view.s)/2;else view.x=clamp(view.x,cw-W*view.s-mx,mx);
  if(H*view.s<=ch)view.y=(ch-H*view.s)/2;else view.y=clamp(view.y,ch-H*view.s-mx,mx);
}
function zoomAt(cx,cy,f){
  const ns=clamp(view.s*f,fitS*0.95,3.2);
  view.x=cx-(cx-view.x)*ns/view.s;view.y=cy-(cy-view.y)*ns/view.s;view.s=ns;
  clampView();dirty=true;
}
function handleTap(px,py){
  if(G.over)return;
  for(const h of armyHits){
    if(Math.hypot(h.x-px,h.y-py)<24){
      if(G.sel!==h.id){G.sel=h.id;selectedMsg='';updateHud();dirty=true}
      return;
    }
  }
  const wx=(px-view.x)/view.s,wy=(py-view.y)/view.s;
  const k=nodeK();
  let best=null,bd=Infinity;
  for(const id in NODES){
    const d=Math.hypot(NODES[id].x-wx,NODES[id].y-wy);
    if(d<bd){bd=d;best=id}
  }
  if(!best||bd>34*k){selectedMsg='';dirty=true;updateHud();return}
  const a=selArmy();
  if(!a)return;
  if(a.at===best){a.path=[];a.dest=null;selectedMsg=describeNode(best)}
  else{
    const ok=planArmy(a,best);
    selectedMsg=ok?describeNode(best):'Dieser Ort ist nicht erreichbar.';
  }
  dirty=true;updateHud();
}
const ptrs=new Map();let tapStart=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)tapStart={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  else{tapStart=null;const [p,q]=[...ptrs.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)}}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const nx=e.clientX,ny=e.clientY;
  if(ptrs.size===1){
    if(tapStart&&Math.hypot(nx-tapStart.x,ny-tapStart.y)>8)tapStart.moved=true;
    if(!tapStart||tapStart.moved){view.x+=nx-prev.x;view.y+=ny-prev.y;clampView();dirty=true}
    ptrs.set(e.pointerId,{x:nx,y:ny});
  }else if(ptrs.size===2){
    ptrs.set(e.pointerId,{x:nx,y:ny});
    const [p,q]=[...ptrs.values()];
    const d=Math.hypot(p.x-q.x,p.y-q.y);
    if(pinch&&pinch.d>0)zoomAt((p.x+q.x)/2,(p.y+q.y)/2,d/pinch.d);
    pinch={d};
  }
});
function endPtr(e){
  const had=ptrs.has(e.pointerId);
  ptrs.delete(e.pointerId);
  if(had&&tapStart&&!tapStart.moved&&performance.now()-tapStart.t<600&&e.type==='pointerup')handleTap(e.clientX,e.clientY);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0)tapStart=null;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
