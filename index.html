function advice(){
  const out=[],a=selArmy(),K=G.K[PL];
  const add=(prio,text,go)=>out.push({prio,text,go:go||null,t:/Brot|Volk|Steuer|Gold|Ernte|Äcker|Hunger|Eisen|Holz|Schwerpunkt|Wirtschaft|Sold/.test(text)&&!/Feind|Heer/.test(text)?'eco':'mil'});
  const plan=lastPlan||econPlan(PL);
  if(a){
    const sup=a.supc||supplyInfo(a),fc=foodCap(a);
    const vis=G.armies.filter(b=>b.alive&&b.side!==PL&&G.visIds[b.id]);
    const nearE=vis.map(b=>({b,d:dist(armyPos(a),armyPos(b))})).sort((p,q)=>p.d-q.d)[0];
    if(nearE&&nearE.d<260){
      const me=troops(a),en=troops(nearE.b);
      if(me>=en*1.2)add(95,'Feindliches Heer ('+KINGS[nearE.b.side].name+', ca. '+Math.round(en/10)*10+' Mann) in der Nähe – du bist stärker.');
      else add(98,'Feindliches Heer ('+KINGS[nearE.b.side].name+', ca. '+Math.round(en/10)*10+' Mann) in der Nähe – besser zurück in die Burg.',{node:KINGS[PL].capital});
    }
    if(a.starving||a.food<fc*0.25)add(97,'Das Brot geht aus! Zurück zur Burg.',{node:KINGS[PL].capital});
    else if(sup.rate<=0)add(96,'Die Nachschublinie ist gekappt. Kehre um oder räume den Weg frei.');
  }
  const th=capitalThreat();
  if(th)add(100,'Feind ('+KINGS[th.b.side].name+', ca. '+Math.round(troops(th.b)/10)*10+' Mann) nur '+th.h+(th.h===1?' Dorf':' Dörfer')+' vor deiner Hauptburg! Heer zurückrufen.',{node:KINGS[PL].capital});
  if(plan.d.gold<-5)add(93,'Der Sold frisst mehr Gold als du einnimmst. Erhöhe die Steuern oder verkleinere das Heer.');
  else if(K.stock.gold>700)add(81,'Viel Gold im Lager. Gib es für Rekruten, Befestigungen oder Straßen aus.');
  if(K.stock.iron>300&&K.stock.arms<60)add(79,'Eisen stapelt sich. Wähle den Schwerpunkt Waffen, damit Schmiede es verarbeiten.');
  if(K.stock.wood>600)add(78,'Holz liegt ungenutzt. Baue Straßen oder Befestigungen.');
  if(plan.d.food<0)add(94,'Das Reich verbraucht mehr Brot als es erntet. Besetze Äcker, um mehr zu ernten.');
  if(K.stock.food<plan.eat*0.3)add(99,'Das Brot im Lager ist fast leer – Hungersnot droht!');
  if(K.loy<45)add(88,'Das Volk ist unzufrieden. Senke die Steuern.');
  const scouts=sideArmies(PL).reduce((s,x)=>s+x.units.scout,0);
  if(scouts===0&&K.orders.rec.scout===0&&exploredPct()<12)add(86,'Du weißt kaum etwas über das Land. Bestelle im Militärrat Späher.');
  const rc=UK.reduce((s,u)=>s+K.orders.rec[u],0);
  if(rc===0&&K.stock.gold>150)add(70,'Du hast Gold übrig. Bestelle im Militärrat Rekruten oder baue Befestigungen.');
  if(K.stock.arms<20&&K.stock.gold>100)add(65,'Waffen sind knapp. Wähle im Wirtschaftsrat den Schwerpunkt Waffen.');
  if(a&&a.at!==null&&!a.path.length&&G.time<20)add(85,'Tippe einen Ort an und wähle „Hierher marschieren“, um Land zu erkunden und Orte zu besetzen.');
  if(a&&a.at!==null&&!a.path.length){
    const r=dijkstra(a.at,'move');let best=null,bd=Infinity;
    for(const id in NODES){const n=NODES[id];if(!(isEco(n)||n.type==='tower')||G.own[id]===PL||!G.known[id])continue;if(r.dist[id]<bd){bd=r.dist[id];best=id}}
    if(best&&bd<9)add(72,'Besetze '+NODES[best].name+' (ca. '+Math.ceil(bd/speedOf(a)*TURN_S)+' s). Mehr Orte = mehr Ernte.',{node:best});
  }
  if(!out.length)add(10,'Ruhige Lage. Halte Wirtschaft und Verteidigung in Schuss.');
  out.sort((p,q)=>q.prio-p.prio);
  return out;
}
function openHelp(){
  const tips=advice().slice(0,3);
  let h='<h1>Was jetzt?</h1>';
  tips.forEach((t,i)=>{h+='<div class="row"><div>'+(i===0?'<b>'+t.text+'</b>':t.text)+'</div>'+(t.go&&t.go.node?'<button data-i="'+i+'">Hin</button>':'')+'</div>'});
  h+='<h2>Kurz erklärt</h2><ul><li>Du bist der König. Wirtschaftsrat: Schwerpunkt und Steuern. Militärrat: Heer, Rekruten, Befestigungen, Späher.</li><li>Zum Monatsende liefern deine Orte Ernte und Gold. Rekruten und Bauten sind nach einigen Tagen fertig.</li><li>Dein Heer isst ständig; die grüne Linie zeigt den Nachschub aus der Burg.</li><li>Alle anderen Königreiche sind Feinde. Ziel: die ganze Insel beherrschen. Erobere dafür alle fünf anderen Hauptburgen.</li></ul>';
  h+='<button class="big" id="bClose">Schließen</button>';
  showOverlay(h);
  $('card').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{
    const t=tips[Number(b.dataset.i)];
    if(t.go&&t.go.node&&G.known[t.go.node]){G.pick=t.go.node;centerNode(t.go.node)}
    closeSheet();
  });
  $('bClose').onclick=closeSheet;
}

/* ---------- Eingabe ---------- */
function clampView(){
  const mx=60;
  if(W*view.s<=cw)view.x=(cw-W*view.s)/2;else view.x=clamp(view.x,cw-W*view.s-mx,mx);
  if(H*view.s<=ch)view.y=(ch-H*view.s)/2;else view.y=clamp(view.y,ch-H*view.s-mx,mx);
}
function zoomAt(cx,cy,f){
  const ns=clamp(view.s*f,fitS*0.95,2.6);
  view.x=cx-(cx-view.x)*ns/view.s;view.y=cy-(cy-view.y)*ns/view.s;view.s=ns;
  clampView();
}
function handleTap(px,py){
  if(G.over)return;
  for(const h of armyHits){
    if(Math.hypot(h.x-px,h.y-py)<26){G.sel=h.id;const ar=G.armies.find(x=>x.id===h.id);G.pick=ar&&ar.at!==null&&G.known[ar.at]?ar.at:null;updateHud();return}
  }
  const wx=(px-view.x)/view.s,wy=(py-view.y)/view.s;
  const k=nodeK();
  let best=null,bd=Infinity;
  let bu=null,bud=Infinity;
  for(const id in NODES){
    const d=Math.hypot(NODES[id].x-wx,NODES[id].y-wy);
    if(G.known[id]){if(d<bd){bd=d;best=id}}
    else if(d<bud){bud=d;bu=id}
  }
  if(best&&bd<38*k)G.pick=best;
  else if(bu&&bud<260&&!isExplored(wx,wy))G.pick=bu;
  else G.pick=null;
  updateHud();
}
const ptrs=new Map();let tapStart=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)tapStart={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  else{tapStart=null;const [p,q]=[...ptrs.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)}}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const nx=e.clientX,ny=e.clientY;
  if(ptrs.size===1){
    if(tapStart&&Math.hypot(nx-tapStart.x,ny-tapStart.y)>8)tapStart.moved=true;
    if(!tapStart||tapStart.moved){view.x+=nx-prev.x;view.y+=ny-prev.y;clampView()}
    ptrs.set(e.pointerId,{x:nx,y:ny});
  }else if(ptrs.size===2){
    ptrs.set(e.pointerId,{x:nx,y:ny});
    const [p,q]=[...ptrs.values()];
    const d=Math.hypot(p.x-q.x,p.y-q.y);
    if(pinch&&pinch.d>0)zoomAt((p.x+q.x)/2,(p.y+q.y)/2,d/pinch.d);
    pinch={d};
  }
});
function endPtr(e){
  const had=ptrs.has(e.pointerId);
  ptrs.delete(e.pointerId);
  if(had&&tapStart&&!tapStart.moved&&performance.now()-tapStart.t<600&&e.type==='pointerup')handleTap(e.clientX,e.clientY);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0)tapStart=null;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});

$('zIn').onclick=()=>zoomAt(cw/2,ch/2,1.35);
$('zOut').onclick=()=>zoomAt(cw/2,ch/2,1/1.35);
$('zCenter').onclick=()=>centerOn(selArmy());
$('bEco').onclick=openEco;
$('bMil').onclick=openMil;
$('bHelp').onclick=openHelp;
$('bPlay').onclick=()=>{G.paused=!G.paused;updateHud()};
$('bSpd').onclick=()=>{G.speed=G.speed===1?2:G.speed===2?4:1;updateHud()};
$('armybar').addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('button[data-id]');if(!b)return;
  G.sel=Number(b.dataset.id);G.pick=null;centerOn(selArmy());updateHud();
});
$('info').addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('button[data-act]');if(!b||!G.pick)return;
  const act=b.dataset.act,a=selArmy(),id=G.pick;
  if(act==='x'){G.pick=null}
  else if(act==='sel'){G.sel=Number(b.dataset.id)}
  else if(act==='go'&&a){planArmy(a,id);G.pick=null}
  else if(act==='fort'){if(orderBuild(PL,b.dataset.v,id))logMsg(FORT[b.dataset.v].name+' bei '+NODES[id].name+' beauftragt – fertig in '+daysLeft(G.K[PL].orders.build[G.K[PL].orders.build.length-1])+' Tagen.','good')}
  else if(act==='road'){
    const to=b.dataset.v,e=EMAP[id+'|'+to],gap=roadGap(PL,id,to);
    if(gap){showOverlay('<h1>Straße nicht möglich</h1><p>Zuerst muss der Weg nach <b>'+NODES[gap.to].name+'</b> ausgebaut werden (von '+NODES[gap.from].name+'). Nur über eine Straße kommen Material und Arbeiter dorthin.</p><button class="big" id="bClose">Verstanden</button>');return}
    if(!canPay(PL,roadCost(e))){showOverlay('<h1>Zu wenig Material</h1><p>Die Straße nach <b>'+NODES[to].name+'</b> kostet '+costText(roadCost(e))+'.</p><button class="big" id="bClose">Verstanden</button>');return}
    if(orderRoad(PL,e,id))logMsg('Straße nach '+NODES[to].name+' beauftragt – fertig in '+daysLeft(G.K[PL].orders.build[G.K[PL].orders.build.length-1])+' Tagen.','good');
  }
  else if(act==='trade'){openTrade(id);return}
  else if(act==='info'){openNodeInfo(id);return}
  updateHud();
});

/* ---------- Start & Hauptschleife ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  cw=window.innerWidth;ch=window.innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  fitS=Math.min(cw/W,ch/H);
  if(!inited){inited=true;view.s=Math.max(fitS*1.1,cw/640);centerNode(KINGS[PL].capital)}
  else{view.s=Math.max(view.s,fitS*0.95);clampView()}
  fogLast.w=0;
}
function startGame(){
  newGame();
  view.s=Math.max(fitS*1.1,cw/640);centerNode(KINGS[PL].capital);
  fogLast.w=0;updateHud();
}

/* ---------- Speichern & Laden ---------- */
const SAVE_KEY='feldzug_save_v1';
function b64e(a){let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
function b64d(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function saveGame(force){
  if(!G||G.over||(introOpen&&!force))return false;
  try{
    const g={};for(const k in G)if(k!=='rnd'&&k!=='expl'&&k!=='fx'&&k!=='parts')g[k]=G[k];
    const edges=[];EDGES.forEach((e,i)=>{if(e.type!==e.type0||!!e.ford!==!!e.ford0)edges.push([i,e.type,e.fordT||0])});
    const d={v:1,wv:3,seed:G.seed,ver:'5.41',m:dateInfo(G.time).m,G:g,expl:b64e(G.expl),fog:explCv.toDataURL(),edges};
    localStorage.setItem(SAVE_KEY,JSON.stringify(d));
    return true;
  }catch(e){return false}
}
function saveInfo(){
  try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const d=JSON.parse(r);return d&&d.v===1&&d.wv>=3?{m:d.m,ver:d.ver}:null}catch(e){return null}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!d||d.v!==1||!(d.wv>=3))return false;
    genWorld(d.seed);
    const g=d.G;
    g.rnd=mulberry32(d.seed+3+Math.floor(g.time));
    g.expl=b64d(d.expl);g.fx=[];g.parts=[];
    g.mode=g.mode||'normal';g.persona=g.persona||{};g.grudge=g.grudge||{};g.start0=g.start0||{};
    MODE=g.mode;
    if(!d.wv)for(const k in g.wall)g.wall[k]=Math.max(0,Math.min(2,g.wall[k]-1));
    G=g;
    buildBackground(d.seed);
    for(const [i,t,f] of d.edges)applyEdge(EDGES[i],t,f);
    ectx.clearRect(0,0,GW,GW);
    const img=new Image();img.onload=()=>{ectx.drawImage(img,0,0);fogLast.w=0};img.src=d.fog;
    G.paused=false;G.pick=null;
    introOpen=false;hideOverlay();
    view.s=Math.max(fitS*1.1,cw/640);centerOn(selArmy());
    fogLast.w=0;updateHud();
    return true;
  }catch(e){return false}
}
let lastSave=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});
window.addEventListener('pagehide',()=>{saveGame()});
let lastT=0,hudT=0,overShown=false;
function loop(ts){
  const now=ts||performance.now();
  let real=lastT?(now-lastT)/1000:0;lastT=now;
  real=clamp(real,0,0.1);
  ANIM_T+=real;
  const open=!$('overlay').classList.contains('hide');
  if(G&&!G.paused&&!G.over&&open===false)simulate(real*G.speed);
  if(G&&G.over&&!overShown){overShown=true;clearSave();setTimeout(showGameOver,900)}
  if(G&&!G.over&&now-lastSave>20000){lastSave=now;saveGame()}
  if(G&&!G.over)overShown=false;
  if(G&&G.council&&!G.over){G.council=false;showScroll()}
  if(now-hudT>220){hudT=now;updateHud()}
  render();
  requestAnimationFrame(loop);
}

/* ---------- Zurück-Taste absichern ---------- */
let leaving=false;
try{history.pushState({g:1},'');}catch(e){}
window.addEventListener('popstate',()=>{
  if(leaving)return;
  try{history.pushState({g:1},'');}catch(e){}
  if(!G)return;
  if(!$('overlay').classList.contains('hide')&&!introOpen){hideOverlay();updateHud();return}
  const wasHidden=$('overlay').classList.contains('hide'),prev=$('card').innerHTML,prevIntro=introOpen;
  introOpen=true;
  showOverlay('<h1>Spiel beenden?</h1><p>Dein Spielstand wird gespeichert. Die Zeit steht solange still.</p><button class="big main" id="bStay">Weiterspielen</button><button class="big" id="bQuit">Wirklich beenden</button>');
  $('bStay').onclick=()=>{introOpen=prevIntro;if(wasHidden)hideOverlay();else{$('card').innerHTML=prev;}};
  $('bQuit').onclick=()=>{saveGame(!prevIntro);leaving=true;G.paused=true;try{window.close()}catch(e){}try{history.go(-2)}catch(e){}setTimeout(()=>{location.replace('about:blank')},200)};
});
window.addEventListener('beforeunload',e=>{if(!leaving&&G&&!G.over){e.preventDefault();e.returnValue=''}});
window.addEventListener('resize',resize);
buildClouds();

centerNode(KINGS[PL].capital);

window.__game={get G(){return G},roadGap,roadReach,get bg(){return bg},render,updateHud,handleTap,planArmy,resolveBattle,supplyInfo,aiDecide,newGame,troops,
  NODES,EDGES,EMAP,KINGS,KIDS,PL,routeCost,splitArmy,splitFrac,mergeArmies,sideArmies,selArmy,speedOf,advice,step,simulate,
  econPlan,orderRecruit,orderBuild,monthEnd,owned,aliveKings,addRoute,removeRoute,canPay,openEco,openMil,showMonthReport,exploredPct,
