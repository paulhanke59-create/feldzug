<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>Feldzug – Mittelalter-Strategie (Prototyp)</title>
<style>
:root{--ink:#3a2c1c;--parch:#f0e3c0;--edge:#7a6647;--red:#b5432e;--blue:#3e5a8b;--ok:#3d6b2a;--bad:#a8321f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2118;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.panel{position:fixed;background:rgba(240,227,192,.94);border:1px solid var(--edge);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#hud{top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;padding:7px 10px 8px}
#hud .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:5px}
#hud .r1 b.t{font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{position:relative;height:22px;border:1px solid var(--edge);border-radius:5px;background:rgba(122,102,71,.18);overflow:hidden;font-size:11.5px;line-height:20px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#b9a36a;opacity:.75}
.bar span{position:relative;padding-left:5px;white-space:nowrap}
.bar.low i{background:#c0482f}
#log{left:8px;top:calc(env(safe-area-inset-top) + 98px);max-width:calc(100% - 70px);padding:5px 9px;font-size:12px;line-height:1.35;max-height:34vh;overflow:hidden}
#log div{margin:1px 0}
#log .battle{color:var(--bad);font-weight:bold}
#log .good{color:var(--ok)}
#log .dim{opacity:.7}
#info{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 72px);padding:7px 11px;font-size:13px;min-height:34px}
#ctl{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;background:none;border:none;box-shadow:none}
button{font:inherit;font-size:15px;color:var(--ink);background:linear-gradient(#f3e8c9,#dcc794);border:1px solid var(--edge);border-radius:10px;padding:0 12px;height:52px;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer}
button:active{transform:translateY(1px);background:#d4be88}
button:disabled{opacity:.45}
#bEnd{flex:2;background:linear-gradient(#c9573f,#9c3a27);color:#fff7e6;border-color:#6b2416;font-weight:bold}
#bPlunder,#bHalt{flex:1}
#zoom{right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:none;border:none;box-shadow:none}
#zoom button{width:44px;height:44px;padding:0;font-size:22px}
#overlay{position:fixed;inset:0;background:rgba(30,22,12,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
#overlay.hide{display:none}
#card{max-width:460px;max-height:92vh;overflow:auto;background:var(--parch);border:2px solid var(--edge);border-radius:14px;padding:18px 20px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#card h1{margin:0 0 8px;font-size:23px}
#card p{margin:7px 0;font-size:14.5px;line-height:1.45}
#card ul{margin:6px 0 10px;padding-left:20px;font-size:14px;line-height:1.5}
#card button{width:100%;margin-top:8px;background:linear-gradient(#c9573f,#9c3a27);color:#fff7e6;border-color:#6b2416;font-weight:bold}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud" class="panel">
  <div class="r1"><b class="t" id="turn"></b><span id="sup"></span></div>
  <div class="bars">
    <div class="bar" id="bTroops"><i></i><span></span></div>
    <div class="bar" id="bFood"><i></i><span></span></div>
    <div class="bar" id="bArrows"><i></i><span></span></div>
    <div class="bar" id="bPowder"><i></i><span></span></div>
  </div>
</div>
<div id="log" class="panel"></div>
<div id="zoom" class="panel">
  <button id="zIn" aria-label="Hineinzoomen">+</button>
  <button id="zOut" aria-label="Herauszoomen">−</button>
  <button id="zCenter" aria-label="Auf Heer zentrieren">⌖</button>
</div>
<div id="info" class="panel"></div>
<div id="ctl" class="panel">
  <button id="bHalt">Halt</button>
  <button id="bPlunder">Plündern</button>
  <button id="bEnd">Zug beenden ▶</button>
</div>

<div id="overlay"><div id="card"></div></div>

<script>
(function(){
'use strict';

/* ============================================================
   KONSTANTEN & DATEN
   ============================================================ */
const W=1000,H=1300,BGS=1.5;
const MOVE_F={road:1,plain:2,forest:3,hills:3,swamp:4,mountain:5};
const SUP_F ={road:1,plain:1.8,forest:3,hills:3,swamp:5,mountain:8};
const T_LABEL={road:'Straße',plain:'Offenes Land',forest:'Wald',hills:'Hügelland',swamp:'Sumpf',mountain:'Gebirge'};
const MP_PER_TURN=2.5, FOOD_CAP=120, ARROW_CAP=60, POWDER_CAP=30;
const SUB_STEPS=10, COLLIDE_DIST=60;
const SIDE={
  A:{name:'Alderheim',color:'#B5432E',dark:'#7A2E1D',home:'burgA',enemy:'B'},
  B:{name:'Schwarzfeld',color:'#3E5A8B',dark:'#2A3D5E',home:'burgB',enemy:'A'}
};

const NODES={
  burgA:   {name:'Burg Alderheim',       type:'castle',  x:170,y:1130,owner:'A'},
  burgB:   {name:'Burg Schwarzfeld',     type:'castle',  x:830,y:150, owner:'B'},
  wegkreuz:{name:'Wegkreuz',             type:'cross',   x:470,y:960},
  eichental:{name:'Eichental',           type:'village', x:190,y:830, owner:'A'},
  muehle:  {name:'Mühle am Fluss',       type:'mill',    x:260,y:512, owner:'A'},
  rehberg: {name:'Dorf Rehberg',         type:'village', x:500,y:760},
  ruine:   {name:'Alte Ruine',           type:'ruin',    x:760,y:900},
  moorbach:{name:'Moorbach',             type:'village', x:830,y:1070},
  wachturm:{name:'Wachturm Hohenfels',   type:'tower',   x:690,y:620},
  bruecke: {name:'Steinbrücke',          type:'bridge',  x:480,y:472},
  nordheim:{name:'Nordheim',             type:'village', x:620,y:300, owner:'B'},
  pass:    {name:'Bergpass',             type:'pass',    x:880,y:560}
};
for(const id in NODES)NODES[id].id=id;

// [a, b, Gelände, Furt-Position (0..1) oder 0]
const EDGE_DEFS=[
  ['burgA','wegkreuz','road',0],
  ['wegkreuz','rehberg','road',0],
  ['rehberg','bruecke','road',0],
  ['bruecke','nordheim','road',0],
  ['nordheim','burgB','road',0],
  ['burgA','eichental','plain',0],
  ['eichental','rehberg','forest',0],
  ['eichental','muehle','plain',0],
  ['muehle','bruecke','plain',0],
  ['wegkreuz','ruine','plain',0],
  ['wegkreuz','moorbach','plain',0],
  ['ruine','moorbach','swamp',0],
  ['ruine','wachturm','hills',0],
  ['wachturm','rehberg','plain',0],
  ['wachturm','nordheim','hills',0.59],
  ['wachturm','pass','mountain',0],
  ['pass','burgB','hills',0.27]
];

const RIVER=[[-30,560],[130,522],[260,512],[380,470],[480,472],[600,440],[740,420],[880,452],[1030,400]];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Graph ---------- */
const EDGES=[],EMAP={},ADJ={};
for(const id in NODES)ADJ[id]=[];
EDGE_DEFS.forEach(([a,b,type,ford])=>{
  const A=NODES[a],B=NODES[b];
  const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
  const rng=mulberry32(hashStr(a+b));
  const off=(rng()*2-1)*0.12*d*2;
  const cp={x:(A.x+B.x)/2+(-dy/d)*off,y:(A.y+B.y)/2+(dx/d)*off};
  const len=d*1.06;
  const e={a,b,type,fordT:ford,ford:!!ford,len,cp,
    move:len/100*MOVE_F[type]+(ford?1.5:0),
    sup:len/100*SUP_F[type]*(ford?2:1)};
  EDGES.push(e);EMAP[a+'|'+b]=e;EMAP[b+'|'+a]=e;
  ADJ[a].push({to:b,e});ADJ[b].push({to:a,e});
});

function edgePoint(e,fromId,t){
  let P0=NODES[e.a],P2=NODES[e.b];
  if(fromId!==e.a){const tmp=P0;P0=P2;P2=tmp}
  const u=1-t,c=e.cp;
  return{x:u*u*P0.x+2*u*t*c.x+t*t*P2.x,y:u*u*P0.y+2*u*t*c.y+t*t*P2.y};
}

function dijkstra(src,key,blockedNodes,blockedEdges){
  const dist={},prev={},done={};
  for(const id in NODES)dist[id]=Infinity;
  dist[src]=0;
  for(;;){
    let u=null,best=Infinity;
    for(const id in dist){if(!done[id]&&dist[id]<best){best=dist[id];u=id}}
    if(u===null)break;
    done[u]=true;
    for(const {to,e} of ADJ[u]){
      if(blockedNodes&&blockedNodes.has(to))continue;
      if(blockedEdges&&blockedEdges.has(u+'|'+to))continue;
      const nd=dist[u]+e[key];
      if(nd<dist[to]){dist[to]=nd;prev[to]=u}
    }
  }
  return{dist,prev};
}
function pathFromTo(src,dst,key){
  if(src===dst)return{path:[],cost:0};
  const r=dijkstra(src,key||'move');
  if(!isFinite(r.dist[dst]))return null;
  const path=[];let c=dst;
  while(c!==src){path.unshift(c);c=r.prev[c]}
  return{path,cost:r.dist[dst]};
}

/* ============================================================
   SPIELZUSTAND
   ============================================================ */
let G=null;
let selectedMsg='';
const UNIT_NAMES={inf:'Schwertkämpfer',pike:'Piekeniere',bow:'Bogenschützen',cav:'Reiter',can:'Kanoniere'};

function mkArmy(side,units,node){
  return{side,units,food:FOOD_CAP,arrows:ARROW_CAP,powder:POWDER_CAP,
    at:node,from:null,to:null,p:0,path:[],dest:null,action:null,
    retreating:false,alive:true,lastRate:0,lastCons:0,starving:false,oldPos:null};
}
function troops(a){let s=0;for(const k in a.units)s+=a.units[k];return s}

function newGame(){
  G={turn:1,own:{},pl:{},loy:{},known:{},over:null,log:[],lastBattleTurn:-9,seenB:null,intel:null,
     rnd:mulberry32((Date.now()&0xffff)+1),
     armies:{
       A:mkArmy('A',{inf:300,pike:180,bow:220,cav:90,can:40},'burgA'),
       B:mkArmy('B',{inf:260,pike:160,bow:180,cav:130,can:60},'burgB')}};
  for(const id in NODES){G.own[id]=NODES[id].owner||null;G.pl[id]=0;G.loy[id]=100}
  G.start={A:troops(G.armies.A),B:troops(G.armies.B)};
  refreshKnown();
  logMsg('Dein Heer steht bereit. Tippe einen Ort an, um den Marsch zu befehlen.','dim');
}

function logMsg(text,cls){G.log.push({turn:G.turn,text,cls:cls||''});if(G.log.length>60)G.log.shift()}
const isVillage=n=>n.type==='village'||n.type==='mill';
const isPlundered=id=>G.pl[id]>G.turn;

function armyPos(a){
  if(a.at!==null)return{x:NODES[a.at].x,y:NODES[a.at].y};
  return edgePoint(EMAP[a.from+'|'+a.to],a.from,a.p);
}
function nearestNode(x,y){
  let best=null,bd=Infinity;
  for(const id in NODES){const d=Math.hypot(NODES[id].x-x,NODES[id].y-y);if(d<bd){bd=d;best=id}}
  return best;
}

/* ---------- Sicht / Nebel ---------- */
function visSources(side){
  const out=[],a=G.armies[side];
  if(a.alive){const p=armyPos(a);out.push({x:p.x,y:p.y,r:150})}
  for(const id in NODES){
    if(G.own[id]!==side)continue;
    const n=NODES[id];
    out.push({x:n.x,y:n.y,r:n.type==='castle'?190:n.type==='tower'?250:110});
  }
  return out;
}
function visibleAt(side,x,y){
  for(const s of visSources(side))if(Math.hypot(s.x-x,s.y-y)<s.r)return true;
  return false;
}
function refreshKnown(){
  for(const id in NODES){
    const n=NODES[id];
    if(!isVillage(n)&&n.type!=='tower')continue;
    if(!G.known[id]||visibleAt('A',n.x,n.y))G.known[id]={owner:G.own[id],plundered:isPlundered(id)};
  }
  const b=G.armies.B;
  if(b.alive){
    const p=armyPos(b);
    if(visibleAt('A',p.x,p.y))G.seenB={x:p.x,y:p.y,turn:G.turn,troops:troops(b)};
  }
}

/* ---------- Versorgung ---------- */
function supplyInfo(side){
  const a=G.armies[side];
  if(!a.alive)return{cost:Infinity,rate:0,route:[]};
  const en=G.armies[SIDE[side].enemy];
  const bn=new Set(),be=new Set();
  if(en.alive){
    if(en.at!==null)bn.add(en.at);
    else{be.add(en.from+'|'+en.to);be.add(en.to+'|'+en.from)}
  }
  const home=SIDE[side].home;
  const r=dijkstra(home,'sup',bn,be);
  let cost=Infinity,anchor=null;
  if(a.at!==null){cost=r.dist[a.at];anchor=a.at}
  else{
    const e=EMAP[a.from+'|'+a.to];
    if(!be.has(a.from+'|'+a.to)){
      const cF=r.dist[a.from]+a.p*e.sup,cT=r.dist[a.to]+(1-a.p)*e.sup;
      if(cF<=cT){cost=cF;anchor=a.from}else{cost=cT;anchor=a.to}
    }
  }
  let route=[];
  if(isFinite(cost)&&anchor){let c=anchor;route.push(c);while(c!==home){c=r.prev[c];if(!c)break;route.push(c)}}
  const rate=isFinite(cost)?clamp(40-2*cost,0,40):0;
  return{cost,rate,route,anchor};
}

/* ---------- Bewegung ---------- */
function planArmy(a,target){
  if(a.at!==null){
    if(a.at===target){a.path=[];a.dest=null;return true}
    const r=pathFromTo(a.at,target);if(!r)return false;
    a.path=r.path;
  }else{
    const e=EMAP[a.from+'|'+a.to];
    const vt=pathFromTo(a.to,target),vf=pathFromTo(a.from,target);
    if(!vt||!vf)return false;
    const cT=(1-a.p)*e.move+vt.cost,cF=a.p*e.move+vf.cost;
    if(cT<=cF){a.path=[a.to].concat(vt.path)}
    else{const f=a.from;a.from=a.to;a.to=f;a.p=1-a.p;a.path=[a.to].concat(vf.path)}
  }
  a.dest=target;
  return true;
}
function routeSegs(a){
  const segs=[];
  if(a.at!==null){let prev=a.at;for(const n of a.path){segs.push([prev,n,0,1]);prev=n}}
  else{segs.push([a.from,a.to,a.p,1]);let prev=a.to;for(const n of a.path.slice(1)){segs.push([prev,n,0,1]);prev=n}}
  return segs;
}
function routeCost(a){let c=0;for(const [f,t,t0,t1] of routeSegs(a))c+=EMAP[f+'|'+t].move*(t1-t0);return c}

function stepArmy(a,mp){
  while(mp>1e-6&&!G.over){
    if(a.at!==null){
      if(!a.path.length)break;
      a.from=a.at;a.to=a.path[0];a.p=0;a.at=null;
    }
    const e=EMAP[a.from+'|'+a.to];
    const need=(1-a.p)*e.move;
    if(mp>=need-1e-9){
      mp-=need;a.at=a.to;a.p=0;a.from=a.to=null;a.path.shift();
      onArrive(a);
    }else{a.p+=mp/e.move;mp=0}
  }
}
function onArrive(a){
  const n=NODES[a.at];
  if(n.type==='tower'&&G.own[n.id]!==a.side){
    G.own[n.id]=a.side;
    if(a.side==='A')logMsg('Du besetzt den '+n.name+' – weite Sicht.','good');
  }
  if(n.type==='castle'&&n.owner!==a.side){
    const en=G.armies[SIDE[a.side].enemy];
    if(!(en.alive&&en.at===n.id)){
      G.over={winner:a.side,reason:a.side==='A'
        ?'Dein Heer hat '+n.name+' eingenommen!'
        :'Der Gegner hat '+n.name+' eingenommen.'};
    }
  }
  if(a.dest===n.id){a.dest=null}
}

/* ---------- Plündern ---------- */
function canPlunder(a){
  if(!a.alive||a.at===null)return false;
  const n=NODES[a.at];
  return isVillage(n)&&G.own[n.id]!==a.side&&!isPlundered(n.id);
}
function doPlunder(a){
  const n=NODES[a.at];
  const gain=Math.min(45,FOOD_CAP-a.food);
  a.food+=gain;
  G.pl[n.id]=G.turn+8;
  G.loy[n.id]=Math.max(0,G.loy[n.id]-40);
  if(a.side==='A')logMsg('Du plünderst '+n.name+': +'+Math.round(gain)+' Verpflegung. Das Dorf ist ausgeblutet, die Bevölkerung grollt.');
  else if(visibleAt('A',n.x,n.y))logMsg('Rauch über '+n.name+': der Gegner plündert dort.','bad');
}

/* ---------- Versorgungs-Abrechnung ---------- */
function upkeep(side){
  const a=G.armies[side];
  if(!a.alive)return;
  const cons=Math.ceil(troops(a)/60);
  const s=supplyInfo(side);
  a.lastRate=s.rate;a.lastCons=cons;
  a.food=Math.min(FOOD_CAP,a.food+s.rate)-cons;
  a.arrows=Math.min(ARROW_CAP,a.arrows+s.rate*0.4);
  a.powder=Math.min(POWDER_CAP,a.powder+s.rate*0.2);
  a.starving=false;
  if(a.food<0){
    a.food=0;a.starving=true;
    for(const k in a.units)a.units[k]=Math.floor(a.units[k]*0.93);
    if(side==='A')logMsg('Hunger! Soldaten desertieren – das Heer schrumpft.','bad');
    checkDestroyed(a);
  }
  if(side==='A'&&s.rate===0&&!a.starving)logMsg('Nachschublinie abgeschnitten – du lebst vom Tross.','bad');
}
function checkDestroyed(a){
  if(a.alive&&troops(a)<60){
    a.alive=false;
    G.over={winner:SIDE[a.side].enemy,reason:a.side==='A'?'Dein Heer ist aufgerieben.':'Das gegnerische Heer ist aufgerieben.'};
  }
}

/* ---------- Kampf ---------- */
function terrBonus(a){
  let b=1;
  if(a.at!==null){
    const n=NODES[a.at];
    if(n.type==='castle'&&n.owner===a.side)b*=1.4;
    else if(n.type==='tower')b*=1.25;
    else if(isVillage(n))b*=1.1;
  }else{
    const e=EMAP[a.from+'|'+a.to];
    if(e.type==='forest'||e.type==='hills')b*=1.15;
    if(e.type==='swamp'||e.type==='mountain')b*=0.9;
  }
  return b;
}
function armyPower(a){
  const u=a.units;
  let s=u.inf*1.0+u.pike*0.9+u.cav*1.5;
  s+=u.bow*(a.arrows>0?1.2:0.3);
  s+=u.can*(a.powder>0?3.0:0.2);
  if(a.food<=0)s*=0.6;
  return s;
}
function applyLoss(a,f){for(const k in a.units)a.units[k]=Math.floor(a.units[k]*(1-f))}
function resolveBattle(){
  const A=G.armies.A,B=G.armies.B;
  const pa=armyPower(A)*terrBonus(A)*(0.85+G.rnd()*0.3);
  const pb=armyPower(B)*terrBonus(B)*(0.85+G.rnd()*0.3);
  const aWins=pa>=pb;
  const win=aWins?A:B,lose=aWins?B:A;
  const wp=Math.max(pa,pb),lp=Math.min(pa,pb);
  const before={A:troops(A),B:troops(B)};
  const ammoA={arrows:A.arrows,powder:A.powder};
  A.arrows=Math.max(0,A.arrows-(A.units.bow>0?14:0));
  A.powder=Math.max(0,A.powder-(A.units.can>0?9:0));
  B.arrows=Math.max(0,B.arrows-(B.units.bow>0?14:0));
  B.powder=Math.max(0,B.powder-(B.units.can>0?9:0));
  applyLoss(lose,0.45);
  applyLoss(win,Math.min(0.35,0.08+0.3*lp/wp));
  const lossA=before.A-troops(A),lossB=before.B-troops(B);
  const where=(A.at!==null?NODES[A.at].name:(B.at!==null?NODES[B.at].name:'offenem Gelände'));
  let txt='Schlacht bei '+where+': '+(aWins?'Du siegst':'Du wirst geschlagen')+'. Eigene Verluste: '+lossA+', Gegner: ca. '+(Math.round(lossB/10)*10)+'.';
  if(A.arrows<=0&&ammoA.arrows>0)txt+=' Deine Pfeile sind verbraucht.';
  if(A.powder<=0&&ammoA.powder>0)txt+=' Dein Pulver ist verbraucht.';
  logMsg(txt,'battle');
  G.lastBattleTurn=G.turn;A.bold=false;B.bold=false;
  if(!aWins){A.path=[];planArmy(A,SIDE.A.home);logMsg('Rückzug zur Burg befohlen.','dim')}
  else{B.retreating=true;planArmy(B,SIDE.B.home)}
  checkDestroyed(A);checkDestroyed(B);
  // Der Geschlagene löst sich vom Feind (sonst gäbe es jede Runde dieselbe Schlacht)
  if(lose.alive&&!G.over){
    for(let i=0;i<20;i++){
      const pa=armyPos(A),pb=armyPos(B);
      if(Math.hypot(pa.x-pb.x,pa.y-pb.y)>=95)break;
      stepArmy(lose,0.1);
    }
  }
}

/* ---------- Gegner-KI (gleiche Sichtregeln wie der Spieler) ---------- */
function nearestPlunderTarget(b){
  const from=b.at!==null?b.at:b.to;
  const r=dijkstra(from,'move');
  let best=null,bd=Infinity;
  for(const id in NODES){
    const n=NODES[id];
    if(!isVillage(n)||G.own[id]==='B'||isPlundered(id))continue;
    if(r.dist[id]<bd){bd=r.dist[id];best=id}
  }
  return bd<=9?best:null;
}
function aiDecide(){
  const a=G.armies.A,b=G.armies.B;
  if(!b.alive)return;
  b.action=null;
  const pa=a.alive?armyPos(a):null;
  const seen=a.alive&&visibleAt('B',pa.x,pa.y);
  if(seen)G.intel={node:nearestNode(pa.x,pa.y),turn:G.turn,troops:troops(a)};
  const sup=supplyInfo('B');
  if(!b.retreating&&(b.food<35||(sup.rate<=2&&b.food<65)||(troops(b)<0.45*G.start.B&&!b.bold)))b.retreating=true;
  if(b.retreating&&b.at==='burgB'&&b.food>=100){
    b.rest=(b.rest||0)+1;
    // erholt genug – oder nach einigen Zügen Rast trotzdem wieder los, damit die Partie nicht festfährt
    if(troops(b)>=0.5*G.start.B||b.rest>=5){b.retreating=false;b.rest=0;b.bold=true}
  }
  if(b.retreating){
    if(b.at==='burgB'){b.path=[];b.dest=null}else planArmy(b,'burgB');
    return;
  }
  if(canPlunder(b)&&b.food<FOOD_CAP*0.85){b.action='plunder';b.path=[];b.dest=null;return}
  if(seen&&troops(b)>=0.8*troops(a)){planArmy(b,nearestNode(pa.x,pa.y));return}
  if(G.intel&&G.turn-G.intel.turn<4&&troops(b)>=0.8*G.intel.troops){planArmy(b,G.intel.node);return}
  if(b.food<FOOD_CAP*0.7){
    const t=nearestPlunderTarget(b);
    if(t){planArmy(b,t);return}
  }
  planArmy(b,'burgA');
}

/* ---------- Zugablauf ---------- */
function endTurn(){
  if(G.over)return;
  const A=G.armies.A,B=G.armies.B;
  aiDecide();
  for(const k of ['A','B']){const a=G.armies[k];if(a.alive)a.oldPos=armyPos(a)}
  const stay={};
  for(const k of ['A','B']){
    const a=G.armies[k];
    if(a.alive&&a.action==='plunder'){
      if(canPlunder(a)){doPlunder(a);stay[k]=true}
      a.action=null;
    }
  }
  let fought=false;
  const step=MP_PER_TURN/SUB_STEPS;
  for(let s=0;s<SUB_STEPS&&!G.over&&!fought;s++){
    for(const k of ['A','B']){const a=G.armies[k];if(a.alive&&!stay[k])stepArmy(a,step)}
    if(G.over)break;
    if(A.alive&&B.alive&&!(G.turn-G.lastBattleTurn===1&&s<4)){
      const pa=armyPos(A),pb=armyPos(B);
      if(Math.hypot(pa.x-pb.x,pa.y-pb.y)<COLLIDE_DIST){resolveBattle();fought=true}
    }
  }
  if(!G.over){upkeep('A');upkeep('B')}
  const hadSeen=G.seenB&&G.seenB.turn===G.turn;
  G.turn++;
  refreshKnown();
  if(B.alive&&G.seenB&&G.seenB.turn===G.turn&&!hadSeen)logMsg('Gegnerisches Heer gesichtet (ca. '+Math.round(troops(B)/50)*50+' Mann).','bad');
  animStart=performance.now();
}

  for(const id in NODES)infra.push({x:NODES[id].x,y:NODES[id].y,r:48});

}
function nearInfra(x,y,extra){for(const q of infra)if(Math.hypot(q.x-x,q.y-y)<q.r+(extra||0))return true;return false}

function riverPath(c){
  c.beginPath();c.moveTo(RIVER[0][0],RIVER[0][1]);
  for(let i=1;i<RIVER.length-1;i++){

}
function drawForest(c,cx,cy,r,n,rng){

    if(nearInfra(x,y,2))continue;

  }else if(n.type==='cross'){
    c.fillStyle='rgba(50,35,20,.2)';c.beginPath();c.ellipse(0,9,9,3,0,0,6.283);c.fill();
    c.strokeStyle='#5A4A38';c.lineWidth=3;c.beginPath();c.moveTo(0,-14);c.lineTo(0,9);c.moveTo(-7,-8);c.lineTo(7,-8);c.stroke();
    c.fillStyle='#8B6B47';c.fillRect(-5,6,10,4);
  }else if(n.type==='bridge'){
    c.strokeStyle='#5A4A38';c.lineWidth=1.2;c.fillStyle='#A38C6A';
    c.beginPath();c.moveTo(-22,-8);c.lineTo(22,-8);c.lineTo(22,6);c.lineTo(-22,6);c.closePath();c.fill();c.stroke();
    c.fillStyle='#6E9BB8';
    for(const bx of [-12,0,12]){c.beginPath();c.moveTo(bx-5,6);c.arc(bx,6,5,Math.PI,0,true);c.closePath();c.fill();c.stroke()}
    c.strokeStyle='#5A4A38';c.beginPath();c.moveTo(-22,-8);c.lineTo(-22,-12);c.moveTo(22,-8);c.lineTo(22,-12);c.stroke();
  }else if(n.type==='pass'){
    c.fillStyle='#9C8C70';c.strokeStyle='#6E5F45';c.lineWidth=1.2;
    c.beginPath();c.moveTo(-24,10);c.lineTo(-12,-16);c.lineTo(-4,0);c.lineTo(0,10);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(4,10);c.lineTo(8,-4);c.lineTo(16,-18);c.lineTo(26,10);c.closePath();c.fill();c.stroke();
    c.fillStyle='#F2EDDC';c.beginPath();c.moveTo(-12,-16);c.lineTo(-17,-8);c.lineTo(-12,-10);c.lineTo(-8,-8);c.closePath();c.fill();
    c.beginPath();c.moveTo(16,-18);c.lineTo(11,-10);c.lineTo(16,-12);c.lineTo(20,-9);c.closePath();c.fill();
  }
  c.restore();
}

/* ---------- Karte zeichnen ---------- */
const nodeK=()=>clamp(0.95/view.s,0.7,2.4);

function strokeEdge(e){
  const A=NODES[e.a],B=NODES[e.b];
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo(e.cp.x,e.cp.y,B.x,B.y);ctx.stroke();
}
function drawEdges(){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const e of EDGES){
    ctx.setLineDash([]);
    if(e.type==='road'){
      ctx.strokeStyle='rgba(122,94,62,.38)';ctx.lineWidth=8;strokeEdge(e);
      ctx.strokeStyle='#8B6B47';ctx.lineWidth=2.2;ctx.setLineDash([1,7]);strokeEdge(e);
    }else{
      const st={plain:['#9A8058',1.8,[2,8]],forest:['#4F6E3F',2,[1,8]],hills:['#8F7B4E',2,[5,6]],swamp:['#55623D',2.2,[1,5]],mountain:['#6E5F45',2.2,[7,6]]}[e.type];
      ctx.strokeStyle='rgba(122,94,62,.16)';ctx.lineWidth=5;strokeEdge(e);
      ctx.strokeStyle=st[0];ctx.lineWidth=st[1];ctx.setLineDash(st[2]);strokeEdge(e);
    }
    ctx.setLineDash([]);
    if(e.ford){
      const p=edgePoint(e,e.a,e.fordT);
      ctx.strokeStyle='#4C7A9C';ctx.lineWidth=1.6;
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(p.x-12,p.y+i*5);ctx.quadraticCurveTo(p.x-6,p.y+i*5-3,p.x,p.y+i*5);ctx.quadraticCurveTo(p.x+6,p.y+i*5+3,p.x+12,p.y+i*5);ctx.stroke()}
    }
  }
}
function drawSupplyLine(){
  const a=G.armies.A;if(!a.alive)return;
  const s=supplyInfo('A');
  if(!s.route||s.route.length<1)return;
  ctx.save();ctx.lineCap='round';
  const col=s.rate>0?'rgba(61,107,42,.85)':'rgba(168,50,31,.0)';
  ctx.strokeStyle=col;ctx.lineWidth=3.2/view.s*0.9;ctx.setLineDash([9/view.s,7/view.s]);
  ctx.beginPath();
  const p0=armyPos(a);ctx.moveTo(p0.x,p0.y);
  let prev=s.route[0];ctx.lineTo(NODES[prev].x,NODES[prev].y);
  for(let i=1;i<s.route.length;i++){
    const e=EMAP[prev+'|'+s.route[i]];
    for(let j=1;j<=12;j++){const p=edgePoint(e,prev,j/12);ctx.lineTo(p.x,p.y)}
    prev=s.route[i];
  }
  ctx.stroke();ctx.restore();
}
function drawRoute(){
  const a=G.armies.A;
  if(!a.alive||!a.path.length)return;
  const segs=routeSegs(a);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(60,40,10,.55)';ctx.lineWidth=6/view.s;
  const trace=()=>{
    ctx.beginPath();const p0=armyPos(a);ctx.moveTo(p0.x,p0.y);
    for(const [f,t,t0,t1] of segs){const e=EMAP[f+'|'+t];for(let j=1;j<=14;j++){const p=edgePoint(e,f,t0+(t1-t0)*j/14);ctx.lineTo(p.x,p.y)}}
    ctx.stroke();
  };
  trace();
  ctx.strokeStyle='#E0A526';ctx.lineWidth=3.4/view.s;ctx.setLineDash([10/view.s,6/view.s]);trace();
  ctx.restore();
}
function routeMarks(a){
  const marks=[];let acc=0,next=MP_PER_TURN,k=1;
  for(const [f,t,t0,t1] of routeSegs(a)){
    const e=EMAP[f+'|'+t],c=e.move*(t1-t0);
    while(acc+c>=next-1e-9){
      const fr=(next-acc)/c,p=edgePoint(e,f,t0+(t1-t0)*fr);
      marks.push({x:p.x,y:p.y,k});k++;next+=MP_PER_TURN;
    }
    acc+=c;
  }
  return marks;
}

const w2s=(x,y)=>({x:x*view.s+view.x,y:y*view.s+view.y});
function haloText(t,x,y,size,col,align,italic){
  ctx.font=(italic?'italic ':'')+size+'px Georgia, serif';ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';
  ctx.lineWidth=3.2;ctx.strokeStyle='rgba(243,231,201,.92)';ctx.lineJoin='round';ctx.strokeText(t,x,y);
  ctx.fillStyle=col;ctx.fillText(t,x,y);
}
function drawShield(x,y,side,count,selected,ghost,sz){
  const col=SIDE[side].color,dk=SIDE[side].dark;
  const w=sz*0.9,h=sz*1.1;
  ctx.save();ctx.translate(x,y-h*0.55);
  if(selected){ctx.fillStyle='rgba(224,165,38,.35)';ctx.beginPath();ctx.arc(0,h*0.1,sz*1.05,0,6.283);ctx.fill()}
  ctx.beginPath();ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/2);ctx.lineTo(w/2,h*0.1);ctx.quadraticCurveTo(w/2,h*0.42,0,h/2);ctx.quadraticCurveTo(-w/2,h*0.42,-w/2,h*0.1);ctx.closePath();
  if(ghost){ctx.globalAlpha=.55;ctx.setLineDash([4,3])}
  ctx.fillStyle=ghost?'rgba(243,231,201,.7)':col;ctx.fill();
  ctx.strokeStyle=dk;ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=ghost?dk:'rgba(255,246,225,.9)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-h*0.3);ctx.lineTo(0,h*0.3);ctx.moveTo(-w*0.25,-h*0.08);ctx.lineTo(w*0.25,-h*0.08);ctx.stroke();
  if(ghost){ctx.fillStyle=dk;ctx.font='bold '+(sz*0.7)+'px Georgia';ctx.textAlign='center';ctx.fillText('?',0,h*0.12)}
  ctx.restore();ctx.globalAlpha=1;
  if(count!=null)haloText(String(count),x,y+13,11,dk,'center',false);
}
function renderPos(a){
  const p=armyPos(a);
  if(!a.oldPos)return p;
  const t=clamp((performance.now()-animStart)/ANIM_MS,0,1);
  if(t>=1)return p;
  const k=1-Math.pow(1-t,3);
  return{x:a.oldPos.x+(p.x-a.oldPos.x)*k,y:a.oldPos.y+(p.y-a.oldPos.y)*k};
}

function render(){
  if(!G||!bg)return;
  const pw=cv.width,ph=cv.height;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#2b2118';ctx.fillRect(0,0,pw,ph);
  ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);
  ctx.drawImage(bg,0,0,W,H);
  drawEdges();
  drawSupplyLine();
  drawRoute();
  const k=nodeK();
  const order=Object.keys(NODES).sort((p,q)=>NODES[p].y-NODES[q].y);
  for(const id of order)drawNodeSymbol(NODES[id],k);
  const A=G.armies.A;
  if(A.dest&&A.path.length){
    const d=NODES[A.dest];
    ctx.strokeStyle='#E0A526';ctx.lineWidth=3/view.s;ctx.beginPath();ctx.arc(d.x,d.y,30*k,0,6.283);ctx.stroke();
  }

  // Nebel
  fctx.setTransform(1,0,0,1,0,0);fctx.globalCompositeOperation='source-over';
  fctx.clearRect(0,0,fg.width,fg.height);
  fctx.fillStyle='rgba(40,29,16,.46)';fctx.fillRect(0,0,fg.width,fg.height);
  fctx.globalCompositeOperation='destination-out';
  for(const s of visSources('A')){
    const sx=(s.x*view.s+view.x)*dpr,sy=(s.y*view.s+view.y)*dpr,rr=s.r*view.s*dpr;
    const gr=fctx.createRadialGradient(sx,sy,rr*0.55,sx,sy,rr);
    gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle=gr;fctx.beginPath();fctx.arc(sx,sy,rr,0,6.283);fctx.fill();
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(fg,0,0);

  // Bildschirmraum: Beschriftungen, Marker
  ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const id of order){
    const n=NODES[id];const p=w2s(n.x,n.y);
    if(p.x<-80||p.x>cw+80||p.y<-60||p.y>ch+60)continue;
    const big=n.type==='castle';
    if(!big&&view.s<0.38&&n.type!=='village')continue;
    const kn=G.known[id];
    const owner=n.type==='castle'?n.owner:(kn?kn.owner:null);
    const col=owner?SIDE[owner].dark:'#4A3D2E';
    const off=(big?36:28)*k*view.s;
    haloText(n.name,p.x,p.y+off+4,big?13:11.5,col,'center',true);
    if(kn&&kn.plundered&&isVillage(n))haloText('geplündert',p.x,p.y+off+17,10,'#8B2A1A','center',true);
  }
  const marks=routeMarks(A);
  for(const m of marks){
    const p=w2s(m.x,m.y);
    ctx.fillStyle='#E0A526';ctx.strokeStyle='#5A3A08';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.283);ctx.fill();ctx.stroke();
    ctx.fillStyle='#3A2408';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(m.k),p.x,p.y+.5);ctx.textBaseline='alphabetic';
  }
  const B=G.armies.B;
  if(B.alive){
    const pb=armyPos(B);
    if(visibleAt('A',pb.x,pb.y)){
      const q=renderPos(B),s=w2s(q.x,q.y);
      drawShield(s.x,s.y,'B',Math.round(troops(B)/10)*10,false,false,24);
      haloText('Heer '+SIDE.B.name,s.x,s.y+25,10.5,SIDE.B.dark,'center',true);
    }else if(G.seenB){
      const s=w2s(G.seenB.x,G.seenB.y),ago=G.turn-G.seenB.turn;
      if(ago>0){
        drawShield(s.x,s.y,'B',null,false,true,22);
        haloText('zuletzt gesehen (vor '+ago+')',s.x,s.y+14,10,'#4A3D2E','center',true);
      }
    }
  }
  if(A.alive){
    const q=renderPos(A),s=w2s(q.x,q.y);
    drawShield(s.x,s.y,'A',troops(A),true,false,26);
  }
  ctx.setTransform(1,0,0,1,0,0);
}

/* ============================================================
   UI
   ============================================================ */
function setBar(id,val,cap,text,low){
  const el=$(id);
  el.firstElementChild.style.width=clamp(val/cap*100,0,100)+'%';
  el.lastElementChild.textContent=text;
  el.classList.toggle('low',!!low);
}
function updateHud(){
  const a=G.armies.A;
  $('turn').textContent='Zug '+G.turn+' · '+SIDE.A.name;
  const s=supplyInfo('A');
  $('sup').innerHTML=s.rate>0
    ?'<b class="ok">Nachschub +'+Math.round(s.rate)+'</b> / −'+Math.ceil(troops(a)/60)+' Verpfl.'
    :'<b class="bad">Nachschub abgeschnitten</b> −'+Math.ceil(troops(a)/60)+' Verpfl.';
  setBar('bTroops',troops(a),G.start.A,'Mann '+troops(a),troops(a)<G.start.A*0.5);
  setBar('bFood',a.food,FOOD_CAP,'Brot '+Math.round(a.food),a.food<30);
  setBar('bArrows',a.arrows,ARROW_CAP,'Pfeile '+Math.round(a.arrows),a.arrows<=0&&a.units.bow>0);
  setBar('bPowder',a.powder,POWDER_CAP,'Pulver '+Math.round(a.powder),a.powder<=0&&a.units.can>0);
  $('bPlunder').disabled=!canPlunder(a)||!!G.over;
  $('bHalt').disabled=!a.path.length||!!G.over;
  $('bEnd').disabled=!!G.over;
  const L=$('log');
  const lines=G.log.slice(-4);
  L.innerHTML=lines.map(l=>'<div class="'+l.cls+'">'+l.text+'</div>').join('');
  if(!selectedMsg){
    const p=canPlunder(a)?' – hier kannst du plündern.':'';
    const here=a.at!==null?NODES[a.at].name:'unterwegs';
    $('info').textContent='Standort: '+here+p;
  }else $('info').innerHTML=selectedMsg;
}
function showOverlay(html){const o=$('overlay');$('card').innerHTML=html;o.classList.remove('hide')}
function hideOverlay(){$('overlay').classList.add('hide')}
function showIntro(){
  showOverlay('<h1>Feldzug</h1>'+
  '<p>Du führst das Heer von <b style="color:#b5432e">Alderheim</b> gegen <b style="color:#3e5a8b">Schwarzfeld</b>. Erobere die feindliche Burg oder vernichte das gegnerische Heer.</p>'+
  '<p>Der Krieg wird vom Nachschub entschieden: Verpflegung und Munition gehen aus. Halte die Linie zu deiner Burg offen – oder plündere Dörfer, wenn es sein muss.</p>'+
  '<ul><li>Ort antippen → Marschbefehl (die Zahlen zeigen, wo dein Heer am Zugende steht)</li>'+
  '<li><b>Zug beenden</b>: Bewegung, Versorgung und Gegnerzug laufen ab</li>'+
  '<li>Ziehen = Karte verschieben, zwei Finger / Mausrad = Zoomen</li>'+
  '<li>Grüne Linie = deine Nachschubroute; Furten, Wald, Sumpf und Berge bremsen Marsch und Nachschub</li>'+
  '<li>Nebel: Den Feind siehst du nur in Sichtweite deiner Heere, Burgen, Dörfer und Türme</li></ul>'+
  '<button id="bStart">Zum Feldzug</button>');
  $('bStart').onclick=hideOverlay;
}
function showGameOver(){
  const won=G.over.winner==='A';
  showOverlay('<h1>'+(won?'Sieg!':'Niederlage')+'</h1><p>'+G.over.reason+'</p><p>Gespielte Züge: '+G.turn+'</p><button id="bAgain">Neues Spiel</button>');
  $('bAgain').onclick=()=>{hideOverlay();startGame()};
}

function describeNode(id){
  const n=NODES[id],a=G.armies.A;
  const kn=G.known[id];
  const typ={castle:'Burg',village:'Dorf',mill:'Mühle',tower:'Wachturm',ruin:'Ruine',cross:'Wegkreuz',bridge:'Brücke',pass:'Pass'}[n.type];
  let s='<b>'+n.name+'</b> ('+typ+')';
  if(n.type==='castle')s+=' – '+SIDE[n.owner].name;
  else if(kn&&(isVillage(n)||n.type==='tower')){
    s+=' – '+(kn.owner?SIDE[kn.owner].name:'niemandes Land');
    if(kn.plundered)s+=', geplündert';
  }
  if(a.path.length&&a.dest===id){
    const turns=Math.ceil(routeCost(a)/MP_PER_TURN-1e-9);
    s+='<br>Marsch: ca. '+turns+' Zug'+(turns===1?'':'e');
  }
  return s;
}

/* ---------- Eingabe ---------- */
function clampView(){
  const mx=60;
  if(W*view.s<=cw)view.x=(cw-W*view.s)/2;else view.x=clamp(view.x,cw-W*view.s-mx,mx);
  if(H*view.s<=ch)view.y=(ch-H*view.s)/2;else view.y=clamp(view.y,ch-H*view.s-mx,mx);
}
function zoomAt(cx,cy,f){
  const ns=clamp(view.s*f,fitS*0.95,3.2);
  view.x=cx-(cx-view.x)*ns/view.s;view.y=cy-(cy-view.y)*ns/view.s;view.s=ns;
  clampView();dirty=true;
}
function centerOnArmy(){
  const p=armyPos(G.armies.A);
  view.x=cw/2-p.x*view.s;view.y=ch/2-p.y*view.s;clampView();dirty=true;
}
function handleTap(px,py){
  if(G.over)return;
  const wx=(px-view.x)/view.s,wy=(py-view.y)/view.s;
  const k=nodeK();
  let best=null,bd=Infinity;
  for(const id in NODES){
    const d=Math.hypot(NODES[id].x-wx,NODES[id].y-wy);
    if(d<bd){bd=d;best=id}
  }
  if(!best||bd>34*k){selectedMsg='';dirty=true;updateHud();return}
  const a=G.armies.A;
  if(a.at===best){a.path=[];a.dest=null;selectedMsg=describeNode(best);}
  else{
    const ok=planArmy(a,best);
    selectedMsg=ok?describeNode(best):'Dieser Ort ist nicht erreichbar.';
  }
  dirty=true;updateHud();
}
const ptrs=new Map();let tapStart=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)tapStart={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  else{tapStart=null;const [p,q]=[...ptrs.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)}}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const nx=e.clientX,ny=e.clientY;
  if(ptrs.size===1){
    if(tapStart&&Math.hypot(nx-tapStart.x,ny-tapStart.y)>8)tapStart.moved=true;
    if(!tapStart||tapStart.moved){view.x+=nx-prev.x;view.y+=ny-prev.y;clampView();dirty=true}
    ptrs.set(e.pointerId,{x:nx,y:ny});
  }else if(ptrs.size===2){
    ptrs.set(e.pointerId,{x:nx,y:ny});
    const [p,q]=[...ptrs.values()];
    const d=Math.hypot(p.x-q.x,p.y-q.y);
    if(pinch&&pinch.d>0)zoomAt((p.x+q.x)/2,(p.y+q.y)/2,d/pinch.d);
    pinch={d};
  }
});
function endPtr(e){
  const had=ptrs.has(e.pointerId);
  ptrs.delete(e.pointerId);
  if(had&&tapStart&&!tapStart.moved&&performance.now()-tapStart.t<600&&e.type==='pointerup')handleTap(e.clientX,e.clientY);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0)tapStart=null;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});

$('zIn').onclick=()=>zoomAt(cw/2,ch/2,1.35);
$('zOut').onclick=()=>zoomAt(cw/2,ch/2,1/1.35);
$('zCenter').onclick=centerOnArmy;
$('bHalt').onclick=()=>{const a=G.armies.A;a.path=[];a.dest=null;if(a.at===null){/* Heer läuft die Kante zu Ende */}selectedMsg='';dirty=true;updateHud()};
$('bPlunder').onclick=()=>{
  const a=G.armies.A;
  if(canPlunder(a)){a.action='plunder';a.path=[];a.dest=null;selectedMsg='Plünderung befohlen – wirkt mit dem Zugende.';endTurn();selectedMsg='';afterTurn()}
};
$('bEnd').onclick=()=>{selectedMsg='';endTurn();afterTurn()};
function afterTurn(){
  updateHud();dirty=true;
  if(G.over)setTimeout(showGameOver,ANIM_MS);
}

/* ---------- Start & Hauptschleife ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  cw=window.innerWidth;ch=window.innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  fg.width=cv.width;fg.height=cv.height;
  fitS=Math.min(cw/W,ch/H);
  if(!inited){inited=true;view.s=Math.max(fitS*1.35,0.62);centerOnArmy()}
  else{view.s=Math.max(view.s,fitS*0.95);clampView()}
  dirty=true;
}
function startGame(){
  newGame();selectedMsg='';
  view.s=Math.max(fitS*1.35,0.62);centerOnArmy();
  updateHud();dirty=true;
}
function loop(){
  const animating=performance.now()-animStart<ANIM_MS+50;
  if(dirty||animating){render();dirty=false}
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
buildBackground();
newGame();
resize();
updateHud();
showIntro();
requestAnimationFrame(loop);

window.__game={get G(){return G},render,updateHud,handleTap,endTurn,planArmy,resolveBattle,supplyInfo,aiDecide,canPlunder,newGame,troops,NODES,EDGES,EMAP,routeCost,MP_PER_TURN,
  set seed(s){G.rnd=mulberry32(s)}};
})();
</script>
</body>
