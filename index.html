<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>Feldzug – Königreiche</title>
<style>
:root{--ink:#3a2c1c;--parch:#f0e3c0;--edge:#7a6647;--gold:#e8b93c;--ok:#3d6b2a;--bad:#a8321f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2118;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.panel{position:fixed;background:rgba(240,227,192,.95);border:1px solid var(--edge);border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
/* dunkle Holz-HUD */
#hud{top:calc(env(safe-area-inset-top) + 6px);left:6px;right:6px;padding:6px 8px 7px;background:linear-gradient(#563d27,#37271a);border:1px solid #b08b4a;color:#f6e8c6;box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,225,160,.25)}
#hud .res{display:flex;gap:5px;align-items:stretch}
.cal{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px;color:#f6e8c6}
.cal b{color:#ffe08a}
.mbar{height:5px;border-radius:3px;background:rgba(0,0,0,.35);margin-bottom:5px;overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c8901e,#f5d04c)}
.cal.flash b{animation:glow .6s}
@keyframes glow{50%{text-shadow:0 0 10px #ffd34d,0 0 4px #fff2b0;color:#fff}}
.rc{flex:1;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border:1px solid rgba(214,176,98,.4);border-radius:9px;padding:2px 5px;min-width:0}
.rc svg{flex:0 0 26px;width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.rc div{line-height:1.05;min-width:0}
.rc b{display:block;font-size:15px;color:#fff3cf}
.rc small{display:block;font-size:9.5px;opacity:.8;white-space:nowrap}
.rc.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.18);box-shadow:0 0 12px 2px rgba(255,215,90,.8)}100%{transform:scale(1)}}
.spd{display:flex;flex-direction:column;gap:3px}
.spd button{height:22px;min-width:40px;font-size:12px;padding:0 6px;border-radius:7px}
#hud .r2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin:5px 0 4px}
#hud .ok{color:#a9e08a}#hud .bad{color:#ff9a84}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.bar{position:relative;height:20px;border:1px solid rgba(214,176,98,.5);border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden;font-size:11.5px;line-height:18px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#cfa04a,#9a7330);opacity:.9}
.bar:nth-child(1) i{background:linear-gradient(#c4583f,#8c3524)}
.bar:nth-child(3) i{background:linear-gradient(#9fb2c4,#66798c)}
.bar span{position:relative;padding-left:5px;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.7)}
.bar.low i{background:#d3402a}
#log{position:static;margin-top:5px;padding:3px 8px;font-size:12px;line-height:1.3;min-height:17px;background:rgba(0,0,0,.28);border:1px solid rgba(214,176,98,.4);border-radius:9px;color:#f6e8c6;overflow:hidden}
#log div{margin:1px 0}
#log .battle{color:var(--bad);font-weight:bold}
#log .good{color:var(--ok)}
#log .dim{opacity:.7}
#bottom{position:fixed;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;gap:5px;pointer-events:none}
#bottom>*{pointer-events:auto}

#scroll{position:fixed;left:50%;top:38%;z-index:30;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);min-width:200px;text-align:center}
#scroll.show{animation:scr 2.3s ease both}
@keyframes scr{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(.97)}}
#scroll .rod{height:14px;border-radius:7px;background:linear-gradient(#7a5230,#4a2f18 60%,#6b4626);box-shadow:0 2px 4px rgba(0,0,0,.5);position:relative;margin:0 -8px}
#scroll .rod:before,#scroll .rod:after{content:"";position:absolute;top:-1px;width:10px;height:16px;border-radius:5px;background:#3a2412}
#scroll .rod:before{left:-6px}#scroll .rod:after{right:-6px}
#scroll .par{background:radial-gradient(ellipse at 50% 40%,#f3e3b6,#e0c88a 70%,#cfb272);border-left:1px solid #a9884a;border-right:1px solid #a9884a;padding:10px 22px 11px;color:#4a2c12;font-family:Georgia,"Times New Roman",serif;box-shadow:0 5px 14px rgba(0,0,0,.45);margin:0 4px}
#scroll .par small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a5a2a}
#scroll .par b{display:block;font-size:24px;font-style:italic;line-height:1.15}

.rrow{padding:7px 0 8px;border-bottom:1px solid rgba(90,60,30,.25)}
.rrow .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rrow .rval{white-space:nowrap;font-size:15px}
.rrow .rsub{margin-top:2px}
input.rs{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:4px 0 0;touch-action:pan-y}
input.rs::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(#5a3e22,#7a5632);border:1px solid #3a2412;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
input.rs::-moz-range-track{height:10px;border-radius:5px;background:#6a4a2a;border:1px solid #3a2412}
input.rs::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5d98a,#c8932f 70%,#8a6018);border:2px solid #4a2f10;box-shadow:0 2px 4px rgba(0,0,0,.5)}
input.rs::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#c8932f;border:2px solid #4a2f10}
input.rs:disabled{opacity:.4}
.rrow.off{filter:grayscale(1);opacity:.55}
.rrow.off input.rs{pointer-events:none}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 2px}
.modes button{padding:9px 6px;border-radius:10px;border:2px solid #8a6a38;background:linear-gradient(#f4e6bd,#e2cd96);color:#3a2412;font:600 15px Georgia,serif}
.modes button.sel{background:linear-gradient(#c8932f,#a8751f);color:#fff7dc;border-color:#4a2f10;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.mdesc{min-height:34px;margin:4px 0 8px}
.icrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:3px 0}
.ic{display:inline-flex;align-items:center;gap:3px;padding:1px 7px 1px 5px;border-radius:12px;background:rgba(90,60,30,.12);border:1px solid rgba(90,60,30,.25);font-size:14px;white-space:nowrap}
.ic b{font-weight:700;font-size:14px}
.ic.lack{background:rgba(180,40,30,.14);border-color:rgba(180,40,30,.55);color:#9a2a1c}
.selrow{background:linear-gradient(90deg,rgba(255,206,80,.45),rgba(255,206,80,.12));border-left:5px solid #c8901e;border-radius:8px;padding-left:8px;margin-left:-4px}
.gew{font-weight:700;color:#7a4e08;white-space:nowrap;padding:6px 10px;border-radius:10px;background:rgba(255,206,80,.55);border:1px solid #c8901e}
.chip.sel{outline:2px solid #fff3c4;box-shadow:0 0 0 3px #c8901e,0 2px 8px rgba(0,0,0,.5)}
.armyhere{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.armyhere .ah{font-size:12px;color:#6a4a1a}
#warnb{position:fixed;left:50%;top:38%;transform:translateX(-50%);max-width:88%;padding:10px 16px;border-radius:12px;background:rgba(150,30,20,.92);color:#fff2d8;border:2px solid #f0c24c;font-weight:700;text-align:center;z-index:60;pointer-events:none;opacity:0;box-shadow:0 4px 14px rgba(0,0,0,.6)}
#warnb.show{animation:warnf 4.5s ease-out}
@keyframes warnf{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
#advisor{position:fixed;left:6px;right:64px;top:170px;z-index:8;display:flex;align-items:flex-start;gap:6px;pointer-events:none}
#bHelp{pointer-events:auto;flex:0 0 52px;width:52px;height:52px;padding:0;border-radius:50%;border:none;background:none;box-shadow:0 3px 8px rgba(0,0,0,.6)}
#bHelp svg{width:52px;height:52px;display:block}
#bHelp.pulse{animation:pl 1.2s infinite}
#bubble{pointer-events:auto;position:relative;margin-top:4px;max-width:calc(100% - 60px);padding:7px 11px;border-radius:12px;background:#f6e9c6;color:#3a2808;border:1.5px solid #7a5a22;font-size:12.5px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.45);opacity:.96}
#bubble:before{content:"";position:absolute;left:-8px;top:12px;border:7px solid transparent;border-right-color:#7a5a22;border-left:0}
#bubble:after{content:"";position:absolute;left:-6px;top:13px;border:6px solid transparent;border-right-color:#f6e9c6;border-left:0}
#bubble.hide{display:none}
#bubble.urgent{background:#ffd9c9;border-color:#a62a1a}
#miniBox.alert{animation:alertb .6s infinite alternate;border-radius:8px}
@keyframes alertb{from{box-shadow:0 0 0 2px #ff3b2a,0 0 6px 2px rgba(255,60,40,.5)}to{box-shadow:0 0 0 4px #ff3b2a,0 0 16px 6px rgba(255,60,40,.95)}}
#armybar{display:flex;gap:6px;overflow-x:auto;padding:2px 52px 2px 0}
.chip{flex:0 0 auto;padding:5px 11px;border-radius:16px;border:1px solid #2e1f10;background:linear-gradient(#7d5a36,#5b3f24);color:#f6e7c1;font-size:12.5px;box-shadow:0 2px 5px rgba(0,0,0,.45);height:auto}
.chip.sel{background:linear-gradient(#f0c24c,#c8901e);color:#2c1d08;font-weight:bold}
#info{position:static;padding:7px 10px;font-size:12.5px;line-height:1.35;max-height:34vh;overflow:auto}
#info .ih{font-size:14px;margin-bottom:2px}
#info .tag{opacity:.7;font-size:11.5px}
#info .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#info button{height:36px;font-size:13px;padding:0 11px}
#info .go{background:linear-gradient(#e0705a,#b34530);color:#fff7e6;border-color:#6b2416;font-weight:bold}
#info .seg{display:inline-flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden}
#info .seg button{border:none;border-radius:0;box-shadow:none;height:34px;background:#e6d5a8;font-size:12.5px}
#info .seg button.on{background:linear-gradient(#f0c24c,#c8901e);font-weight:bold}
#ctl{left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 6px);display:flex;gap:7px;background:none;border:none;box-shadow:none}
button{font:inherit;font-size:15px;color:var(--ink);background:linear-gradient(#f3e8c9,#dcc794);border:1px solid var(--edge);border-radius:10px;padding:0 10px;height:50px;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45}
.wood{background:linear-gradient(#80593a,#573a22);color:#f8e8c2;border:1px solid #2e1f10;text-shadow:0 1px 1px rgba(0,0,0,.6);box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,225,160,.3)}
.wood:active{background:#4a311c}
#bCmd{flex:2}#bOffer{flex:2;position:relative}
#bHelp.pulse,#bOffer.pulse{animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(240,200,80,.55)}}
#zoom{right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:none;border:none;box-shadow:none}
#zoom button{width:44px;height:44px;padding:0;font-size:22px}
#overlay{position:fixed;inset:0;background:rgba(30,22,12,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
#overlay.hide{display:none}
#card{width:100%;max-width:470px;max-height:92vh;overflow:auto;background:var(--parch);border:2px solid var(--edge);border-radius:14px;padding:16px 18px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#card h1{margin:0 0 6px;font-size:21px}
#card h2{margin:12px 0 4px;font-size:15px}
#card p{margin:6px 0;font-size:14px;line-height:1.4}
#card ul{margin:6px 0 10px;padding-left:20px;font-size:13.5px;line-height:1.45}
#card small{opacity:.8;font-size:12px}
#card button.big{width:100%;margin-top:8px;height:48px}
#card button.main{background:linear-gradient(#c9573f,#9c3a27);color:#fff7e6;border-color:#6b2416;font-weight:bold}
#card .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(122,102,71,.35);font-size:13.5px}
#card .row button{height:38px;font-size:13.5px;flex:0 0 auto}
#bEco,#bMil{flex:2}
.srow{margin:6px 0}.sl{display:flex;justify-content:space-between;font-size:13px}
.srow input{width:100%;height:22px;margin:0;accent-color:#a0701c}
.ft{width:100%;border-collapse:collapse;font-size:13px}.ft td{padding:2px 4px;border-bottom:1px solid rgba(122,102,71,.25)}.ft td:nth-child(n+2){text-align:right}.ft .fh td{font-size:11px;color:#6a4a1a}.wofuer{margin:6px 0}
.neg{color:var(--bad)}.pos{color:var(--ok)}.warn{color:#8a5a00}
#card .seg{display:inline-flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden}
#card .seg button{border:none;border-radius:0;box-shadow:none;height:36px;background:#e6d5a8;font-size:14px;min-width:40px}
#card .seg button.on{background:linear-gradient(#f0c24c,#c8901e);font-weight:bold}
.btns2{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.btns2 button{height:38px;font-size:13px}
#card input[type=range]{touch-action:pan-y}
#card button.big{margin-top:8px}
#card button.x{float:right;position:sticky;top:0;width:40px;height:40px;padding:0;margin:-8px -8px 0 8px;font-size:20px;z-index:2}
#info button.px{float:right;width:34px;height:34px;padding:0;margin:-4px -6px 0 6px;font-size:17px}
.top{display:flex;gap:6px;align-items:stretch}
.tile{background:rgba(0,0,0,.26);border:1px solid rgba(214,176,98,.45);border-radius:10px;padding:3px}
#miniBox{flex:0 0 112px;padding:3px 3px 2px;text-align:center}
#mini{position:static!important;inset:auto!important;width:104px;height:104px;border-radius:7px;border:1px solid #1a120a;display:block;margin:0 auto;touch-action:manipulation}
#miniLbl{font-size:10.5px;color:#f6e8c6;margin-top:2px;white-space:nowrap}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cal2{display:flex;justify-content:space-between;align-items:center;padding:3px 6px}
.cal2 .cal{display:flex;flex-direction:column;margin:0;font-size:13px;line-height:1.15}
.cal2 .cal span:last-child{font-size:11px;opacity:.8}
.spd{flex-direction:row!important}
.mbar{margin:0}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;flex:1}
#rFood,#hud .r2,#hud .bars,#miniLbl{display:none!important}
.grid4 .rc{padding:2px 4px}
.pb{height:8px;background:rgba(60,40,20,.18);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid rgba(90,70,45,.35)}.pb i{display:block;height:100%;background:linear-gradient(#e0b04a,#a87a2c)}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud" class="panel">
  <div class="top">
    <div class="tile" id="miniBox"><canvas id="mini" width="224" height="224"></canvas><div id="miniLbl"></div></div>
    <div class="side">
      <div class="tile cal2"><div class="cal"><span id="dDate"></span><span id="dLeft"></span></div><div class="spd"><button class="wood" id="bPlay" aria-label="Pause">⏸</button><button class="wood" id="bSpd" aria-label="Tempo">1×</button></div></div>
      <div class="mbar"><i id="dBar"></i></div>
      <div class="grid4"><div class="rc" id="rGold"><svg viewBox="0 0 32 32"><rect x="3" y="14" width="26" height="14" rx="2" fill="#8a5a2b" stroke="#4a2c12"/><path d="M3 14Q3 5 16 5Q29 5 29 14Z" fill="#a8703a" stroke="#4a2c12"/><rect x="3" y="14" width="26" height="3" fill="#e0b13a"/><rect x="14" y="13" width="4" height="8" rx="1" fill="#e0b13a" stroke="#6a4a0a"/><circle cx="10" cy="9" r="2.2" fill="#f5d04c"/><circle cx="21" cy="8" r="2" fill="#f5d04c"/></svg><div><b id="vGold">0</b><small id="iGold"></small></div></div><div class="rc" id="rFood"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="19" rx="12" ry="8" fill="#d79b4a" stroke="#7a4a16"/><path d="M9 16l3 4M15 14l3 5M21 15l3 4" stroke="#8a5a20" stroke-width="1.6" fill="none"/><path d="M8 11Q16 4 24 11" stroke="#e8c36a" stroke-width="2" fill="none"/></svg><div><b id="vFood">0</b><small id="iFood"></small></div></div><div class="rc" id="rIron"><svg viewBox="0 0 32 32"><path d="M2 28L12 8l6 10 4-6 8 16z" fill="#8f877a" stroke="#4a4338"/><path d="M12 8l-3 6 3 2 3-2z" fill="#f2efe6"/><path d="M20 22l3-4 4 5z" fill="#5d7c96"/><circle cx="21" cy="14" r="1.6" fill="#9ec1db"/></svg><div><b id="vIron">0</b><small id="iIron"></small></div></div><div class="rc" id="rWood"><svg viewBox="0 0 32 32"><rect x="3" y="18" width="26" height="8" rx="4" fill="#a9794a" stroke="#5a3e22"/><rect x="5" y="9" width="22" height="8" rx="4" fill="#b88650" stroke="#5a3e22"/><ellipse cx="27" cy="22" rx="2" ry="3.5" fill="#d2a872" stroke="#5a3e22"/><ellipse cx="25" cy="13" rx="2" ry="3.5" fill="#d2a872" stroke="#5a3e22"/></svg><div><b id="vWood">0</b><small id="iWood"></small></div></div></div>
    </div>
  </div>
  <div class="r2"><span id="aname"></span><span id="sup"></span></div>
  <div class="bars">
    <div class="bar" id="bTroops"><i></i><span></span></div>
    <div class="bar" id="bFood"><i></i><span></span></div>
    <div class="bar" id="bArrows"><i></i><span></span></div>
  </div>
  <div id="log"></div>
</div>
<div id="advisor"><button id="bHelp" aria-label="Berater"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#6a4a2a" stroke="#d9b45a" stroke-width="2.5"/><path d="M14 38Q14 58 32 60Q50 58 50 38Q42 47 32 47Q22 47 14 38Z" fill="#cfcabc" stroke="#6b665a"/><ellipse cx="32" cy="32" rx="14" ry="16" fill="#e8c39a" stroke="#6b4a2a"/><path d="M18 38Q20 54 32 55Q44 54 46 38Q40 46 32 46Q24 46 18 38Z" fill="#d8d3c6" stroke="#6b665a"/><path d="M17 24Q18 8 32 8Q46 8 47 24Q40 17 32 17Q24 17 17 24Z" fill="#8f2a1c" stroke="#4a140c"/><rect x="16" y="21" width="32" height="5" rx="2" fill="#e0b13a" stroke="#7a5a0a"/><circle cx="32" cy="11" r="2.6" fill="#e0b13a"/><path d="M23 29q3-3 6 0M35 29q3-3 6 0" stroke="#5a4a3a" stroke-width="2" fill="none"/><circle cx="26" cy="32" r="1.8" fill="#2a1a0e"/><circle cx="38" cy="32" r="1.8" fill="#2a1a0e"/><path d="M32 33l-2 6h4" stroke="#b08060" fill="none"/><path d="M27 42q5 3 10 0" stroke="#7a3a2a" stroke-width="1.8" fill="none"/></svg></button><div id="bubble"></div></div>
<div id="zoom" class="panel">
  <button class="wood" id="zIn" aria-label="Hineinzoomen">+</button>
  <button class="wood" id="zOut" aria-label="Herauszoomen">−</button>
  <button class="wood" id="zCenter" aria-label="Auf Heer zentrieren">⌖</button>
</div>
<div id="bottom">
  <div id="armybar"></div>
  <div id="info" class="panel"></div>
</div>
<div id="ctl" class="panel">
  <button class="wood" id="bEco">Wirtschaft</button>
  <button class="wood" id="bMil">Militär</button>
</div>

<div id="scroll"><div class="rod"></div><div class="par"><small>Es ist nun</small><b id="scrT"></b></div><div class="rod"></div></div>
<div id="overlay"><div id="card"></div></div>

<script>
(function(){
'use strict';

/* ============================================================
   KONSTANTEN & KÖNIGREICHE
   ============================================================ */
const SC=1.6,W=4160,H=4160,BGS=0.65,LF=1+(SC-1)*0.5;
const MOVE_F={road:1,plain:2,forest:3,hills:3,swamp:4,mountain:5};

let NS=1;
function hash2(ix,iy,s){let h=Math.imul(ix,374761393)^Math.imul(iy,668265263)^Math.imul(s,1442695041);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash2(ix,iy,s),b=hash2(ix+1,iy,s),c=hash2(ix,iy+1,s),d=hash2(ix+1,iy+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y,s)=>vnoise(x,y,s)*0.6+vnoise(x*2.1,y*2.1,s+7)*0.3+vnoise(x*4.3,y*4.3,s+13)*0.1;
const TH={mount:.7,hill:.6,swamp:.7,forest:.55};
const hAt=(x,y)=>fbm(x/(430*SC),y/(430*SC),NS), mAt=(x,y)=>fbm(x/(380*SC),y/(380*SC),NS+99);
function terrainAt(x,y){
  const h=hAt(x,y),m=mAt(x,y);
  if(h>=TH.mount)return'mountain';
  if(h>=TH.hill)return'hills';
  if(m>=TH.swamp&&h<TH.hill-0.1)return'swamp';
  if(m>=TH.forest)return'forest';
  return'plain';
}
function calibrate(rnd){
  const hs=[],ms=[];
  for(let i=0;i<1800;i++){const x=rnd()*W,y=rnd()*H;hs.push(hAt(x,y));ms.push(mAt(x,y))}
  hs.sort((a,b)=>a-b);ms.sort((a,b)=>a-b);
  const q=(a,p)=>a[Math.floor(p*(a.length-1))];
  TH.mount=q(hs,0.92);TH.hill=q(hs,0.79);TH.swamp=q(ms,0.93);TH.forest=q(ms,0.62);
}

const NODES={},EDGES=[],EMAP={},ADJ={};

function applyEdge(e,type,ford){
  e.type=type;e.ford=!!ford;e.fordT=ford||0;
  e.move=e.len/LF/100*MOVE_F[type]+(ford?1.5:0);
  e.sup=e.len/LF/100*SUP_F[type]*(ford?2:1);
}
function resetEdges(){for(const e of EDGES)applyEdge(e,e.type0,e.ford0)}
function edgePoint(e,fromId,t){
  let P0=NODES[e.a],P2=NODES[e.b];
  if(fromId!==e.a){const tmp=P0;P0=P2;P2=tmp}
  const u=1-t,c=e.cp;
  return{x:u*u*P0.x+2*u*t*c.x+t*t*P2.x,y:u*u*P0.y+2*u*t*c.y+t*t*P2.y};
}
function dijkstra(src,key,blockedNodes,blockedEdges){
  const d={},prev={},done={};
  for(const id in NODES)d[id]=Infinity;
  d[src]=0;
  for(;;){
    let u=null,best=Infinity;
    for(const id in d){if(!done[id]&&d[id]<best){best=d[id];u=id}}
    if(u===null)break;
    done[u]=true;
    for(const {to,e} of ADJ[u]){
      if(blockedNodes&&blockedNodes.has(to))continue;
      if(blockedEdges&&blockedEdges.has(u+'|'+to))continue;
      const nd=d[u]+e[key];
      if(nd<d[to]){d[to]=nd;prev[to]=u}
    }
  }
  return{dist:d,prev};
}
function pathFromTo(src,dst,key){
  if(src===dst)return{path:[],cost:0};
  const r=dijkstra(src,key||'move');
  if(!isFinite(r.dist[dst]))return null;
  const path=[];let c=dst;
  while(c!==src){path.unshift(c);c=r.prev[c]}
  return{path,cost:r.dist[dst]};
}

function segInter(p1,p2,p3,p4){
  const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d)<1e-9)return null;
  const t=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;
  const u=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
  return(t>=0&&t<=1&&u>=0&&u<=1)?t:null;
}
let ISL=[0,1,2];
const coastR=a=>SC*(1130+110*Math.sin(3*a+ISL[0])+75*Math.sin(5*a+ISL[1])+45*Math.sin(8*a+ISL[2]));
const inIsland=(x,y,m)=>Math.hypot(x-W/2,y-H/2)<coastR(Math.atan2(y-H/2,x-W/2))-(m||0);
function islandPts(n){const o=[];for(let i=0;i<n;i++){const a=i/n*6.283185,r=coastR(a);o.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r})}return o}
function genWorld(seed){
  const rnd=mulberry32(seed);
  NS=(seed%997)+3;
  for(const k in NODES)delete NODES[k];
  for(const k in EMAP)delete EMAP[k];
  for(const k in ADJ)delete ADJ[k];
  EDGES.length=0;
  calibrate(mulberry32(seed+1));
  const used=new Set();
  const SAARQ=SAAR.slice().sort(()=>rnd()-.5);
  const nameFor=()=>{while(SAARQ.length){const n=SAARQ.pop();if(!used.has(n)){used.add(n);return n}}for(let i=0;i<40;i++){const n=PRE[Math.floor(rnd()*PRE.length)]+SUF[Math.floor(rnd()*SUF.length)];if(!used.has(n)){used.add(n);return n}}return 'Ort'+used.size};
  ISL=[(seed%61)/61*6.28,(seed%47)/47*6.28,(seed%29)/29*6.28];
  const caps=[];
  {const base=rnd()*6.283;
    for(let i=0;i<KIDS.length;i++){
      const a=base+i*6.283/KIDS.length+(rnd()-.5)*0.35,r=coastR(a)*(0.66+rnd()*0.06);
      caps.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r});
    }
  }
  let nid=0;const pts=[];
  const mk=(type,x,y,owner,name)=>{const id='n'+(nid++);const n={id,type,x:Math.round(x),y:Math.round(y),owner:owner||null,name:name||nameFor()};NODES[id]=n;pts.push(n);return n};
  KIDS.forEach((k,i)=>{const n=mk('castle',caps[i].x,caps[i].y,k,KINGS[k].cap);n.capOf=k;KINGS[k].capital=n.id});
  const TERR=['village','village','village','farm','farm','lumber','lumber','mine','mine','coal'];
  const place=(type,cx,cy,rmin,rmax,owner,mind)=>{
    for(let t=0;t<80;t++){
      const a=rnd()*6.283,r=rmin+rnd()*(rmax-rmin),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      if(!inIsland(x,y,70*SC))continue;
      if(pts.some(p=>Math.hypot(p.x-x,p.y-y)<mind))continue;
      return mk(type,x,y,owner);
    }
    return null;
  };
  KIDS.forEach((k,i)=>{for(const t of TERR)place(t,caps[i].x,caps[i].y,120*SC,340*SC,k,112*SC)});
  const NEUT=['village','village','village','village','village','village','farm','farm','farm','farm','lumber','lumber','lumber','mine','mine','mine','mine','coal','coal','coal','tower','tower','tower','tower','ruin','ruin','ruin','cross','cross','pass'];
  const NEUTALL=[];for(let i=0;i<2.4;i++)NEUTALL.push(...NEUT);
  for(const t of NEUTALL.slice(0,Math.round(NEUT.length*2.4))){
    let best=null,bd=-1;
    for(let a=0;a<500;a++){
      const x=120+rnd()*(W-240),y=120+rnd()*(H-240);
      if(!inIsland(x,y,90*SC))continue;
      let md=1e9;for(const p of pts){const d=Math.hypot(p.x-x,p.y-y);if(d<md)md=d}
      if(md<150*SC)continue;
      if(md>bd){bd=md;best={x,y}}
    }
    if(best)mk(t,best.x,best.y,null);
  }
  /* Flüsse */
  RIVERS=[];
  const rv=(horiz,base)=>{
    const p=[];const n=14;
    for(let i=0;i<=n;i++){
      const u=i/n,off=(vnoise(i*0.7,base,NS)-0.5)*500*SC;
      p.push(horiz?{x:-40+u*(W+80),y:base+off}:{x:base+off,y:-40+u*(H+80)});
    }
    RIVERS.push(p);
  };
  rv(true,H*(0.38+rnd()*0.24));rv(false,W*(0.3+rnd()*0.4));
  /* Kanten: Gabriel-Graph */
  const N=pts.length,E=new Set(),list=[];
  const addE=(i,j)=>{const key=i<j?i+'|'+j:j+'|'+i;if(E.has(key))return;E.add(key);list.push([Math.min(i,j),Math.max(i,j)])};
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const d=dist(pts[i],pts[j]);if(d>470*SC)continue;
    const mx=(pts[i].x+pts[j].x)/2,my=(pts[i].y+pts[j].y)/2,r=d/2*0.98;
    let ok=true;
    for(let k=0;k<N;k++){if(k===i||k===j)continue;if(Math.hypot(pts[k].x-mx,pts[k].y-my)<r){ok=false;break}}
    if(ok)addE(i,j);
  }
  const deg=new Array(N).fill(0);list.forEach(([i,j])=>{deg[i]++;deg[j]++});
  for(let i=0;i<N;i++)if(deg[i]<2){
    const o=pts.map((p,j)=>({j,d:j===i?1e9:dist(pts[i],p)})).sort((a,b)=>a.d-b.d);
    for(let t=0;t<2-deg[i];t++){addE(i,o[t].j);deg[o[t].j]++}
  }
  const par=pts.map((_,i)=>i);const find=a=>par[a]===a?a:(par[a]=find(par[a]));
  list.forEach(([i,j])=>{par[find(i)]=find(j)});
  for(;;){
    const roots=new Set(pts.map((_,i)=>find(i)));if(roots.size<=1)break;
    let best=null;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){if(find(i)===find(j))continue;const d=dist(pts[i],pts[j]);if(!best||d<best.d)best={i,j,d}}
    addE(best.i,best.j);par[find(best.i)]=find(best.j);
  }
  for(const id in NODES)ADJ[id]=[];
  for(const [i,j] of list){
    const A=pts[i],B=pts[j],d=dist(A,B);
    const mid={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
    let type=terrainAt(mid.x,mid.y);
    const same=A.owner&&A.owner===B.owner;
    if(same&&(type==='mountain'||type==='swamp'))type='hills';
    if(same&&d<360*SC&&(A.type==='castle'||B.type==='castle'||rnd()<0.5))type='road';
    else if(!same&&d<260*SC&&rnd()<0.12)type='road';
    let ford=0;
    if(type!=='road'){
      for(const rvp of RIVERS){
        for(let s=0;s<rvp.length-1;s++){const t=segInter(A,B,rvp[s],rvp[s+1]);if(t!==null){ford=clamp(t,0.15,0.85);break}}
        if(ford)break;
      }
    }
    const off=(rnd()*2-1)*0.12*d*2;
    const dx=B.x-A.x,dy=B.y-A.y;
    const e={a:A.id,b:B.id,type0:type,ford0:ford,len:d*1.06,cp:{x:mid.x+(-dy/d)*off,y:mid.y+(dx/d)*off}};
    applyEdge(e,type,ford);
    EDGES.push(e);EMAP[A.id+'|'+B.id]=e;EMAP[B.id+'|'+A.id]=e;
    ADJ[A.id].push({to:B.id,e});ADJ[B.id].push({to:A.id,e});
  }
  RIVER_PTS=RIVERS.map(smoothPts);
}
function smoothPts(p){
  const out=[];let prev=p[0];
  for(let i=1;i<p.length-1;i++){
    const mx=(p[i].x+p[i+1].x)/2,my=(p[i].y+p[i+1].y)/2;
    for(let t=0;t<1;t+=0.125){const o=1-t;out.push({x:o*o*prev.x+2*o*t*p[i].x+t*t*mx,y:o*o*prev.y+2*o*t*p[i].y+t*t*my})}
    prev={x:mx,y:my};
  }
  out.push(p[p.length-1]);
  return out;
}

const INFRA={};const IC=60;
function infraAdd(x,y,r){const k=Math.floor(x/IC)+','+Math.floor(y/IC);(INFRA[k]||(INFRA[k]=[])).push({x,y,r})}
function buildInfra(){
  for(const k in INFRA)delete INFRA[k];
  for(const id in NODES)infraAdd(NODES[id].x,NODES[id].y,50);
  for(const e of EDGES)for(let i=0;i<=Math.ceil(e.len/18);i++){const p=edgePoint(e,e.a,i/Math.ceil(e.len/18));infraAdd(p.x,p.y,22)}
  for(const rp of RIVER_PTS)for(const p of rp)infraAdd(p.x,p.y,16);
}
function nearInfra(x,y,extra){
  const cx=Math.floor(x/IC),cy=Math.floor(y/IC);
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    const l=INFRA[(cx+a)+','+(cy+b)];if(!l)continue;
    for(const q of l)if(Math.hypot(q.x-x,q.y-y)<q.r+(extra||0))return true;
  }
  return false;
}

      if(q<0.62){c.strokeStyle='rgba(78,110,52,.55)';c.lineWidth=1;c.beginPath();c.moveTo(x-2,y);c.lineTo(x-3,y-4);c.moveTo(x,y);c.lineTo(x,y-5);c.moveTo(x+2,y);c.lineTo(x+3,y-4);c.stroke()}
      else if(q<0.8){c.fillStyle=['#c9574b','#e6c34a','#f1ead8','#8d7bc4'][Math.floor(r()*4)];c.beginPath();c.arc(x,y,1.5,0,6.283);c.fill()}
      else if(q<0.9&&t==='plain'){c.fillStyle='rgba(60,92,44,.8)';c.beginPath();c.ellipse(x,y,4.5,3,0,0,6.283);c.fill();c.fillStyle='rgba(95,130,64,.8)';c.beginPath();c.ellipse(x-1,y-1.2,3,2,0,0,6.283);c.fill()}

  c.clip('evenodd');
  const sg=c.createRadialGradient(W/2,W/2,900*SC,W/2,W/2,1900*SC);
  sg.addColorStop(0,'#86aebd');sg.addColorStop(1,'#5f8697');
  c.fillStyle=sg;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1.6;
  for(let n=0;n<1400*SC*SC;n++){
    const x=r()*W,y=r()*H;if(inIsland(x,y,-20))continue;
    const l=10+r()*16;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l/2,y-4,x+l,y);c.stroke();
  }
  for(let k=0;k<3;k++){
    c.beginPath();isl.forEach((p,i)=>{const a=Math.atan2(p.y-W/2,p.x-W/2),q=1+(14+k*16)/coastR(a);const x=W/2+(p.x-W/2)*q,y=W/2+(p.y-W/2)*q;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();
    c.strokeStyle='rgba(255,255,255,'+(0.42-k*0.12)+')';c.lineWidth=3-k*0.6;c.stroke();
  }
  const shallow=c.createRadialGradient(0,0,0,0,0,1);
  for(let k=0;k<5;k++){
    c.beginPath();isl.forEach((p,i)=>{const a=Math.atan2(p.y-W/2,p.x-W/2),q=1+(10+k*9)/coastR(a);const x=W/2+(p.x-W/2)*q,y=W/2+(p.y-W/2)*q;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();

    c.fillStyle='rgba(50,70,85,.25)';c.beginPath();c.ellipse(0,6,22,4,0,0,6.283);c.fill();

    c.beginPath();c.moveTo(-20,-2);c.lineTo(20,-2);c.lineTo(14,7);c.lineTo(-14,7);c.closePath();c.fill();c.stroke();
    c.strokeStyle='#2c1c0e';c.lineWidth=1.6;c.beginPath();c.moveTo(0,-2);c.lineTo(0,-28);c.stroke();
    c.fillStyle='#f4ead0';c.beginPath();c.moveTo(1,-27);c.lineTo(17,-8);c.lineTo(1,-8);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(-1,-24);c.lineTo(-13,-8);c.lineTo(-1,-8);c.closePath();c.fill();c.stroke();

   KIDS.filter(k=>k!==PL).forEach((k,i)=>{G.persona[k]=ps[i%ps.length];G.grudge[k]={}});
   for(const k of KIDS)G.start0[k]=owned(k).length}
  buildBackground(seed);
  for(const id in NODES)G.known[id]=null;
  G.vgar={};G.visited={};G.vgot={};G.pf={};G.lvl={};G.mood={};G.dev={};G.devLog=[];
  for(const id in NODES){G.pf[id]=0.82+G.rnd()*0.36;if(NODES[id].type==='castle')continue;G.lvl[id]=G.own[id]?2:1;G.mood[id]=G.own[id]?70:50;G.dev[id]=0}
  for(const id in NODES){
    if(NODES[id].type!=='village')continue;

  logMsg('Dein Königreich ist bekannt. Der Rest der Welt ist unerforscht.','dim');
}
function logMsg(text,cls){G.log.push({t:G.time,text,cls:cls||''});if(G.log.length>80)G.log.shift()}
function selArmy(){
  let a=armyById(G.sel);

  return a;
}
function armyPos(a){
  if(a.at!==null)return{x:NODES[a.at].x,y:NODES[a.at].y};
  return edgePoint(EMAP[a.from+'|'+a.to],a.from,a.p);
}
function nearestNode(x,y){
  let best=null,bd=Infinity;
  for(const id in NODES){const d=Math.hypot(NODES[id].x-x,NODES[id].y-y);if(d<bd){bd=d;best=id}}
  return best;
}

/* ---------- Erkundung & Sicht ---------- */
function reveal(x,y,r){
  const x0=Math.max(0,Math.floor((x-r)/EXP)),x1=Math.min(GW-1,Math.floor((x+r)/EXP));
  const y0=Math.max(0,Math.floor((y-r)/EXP)),y1=Math.min(GW-1,Math.floor((y+r)/EXP));
  for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++){
    if(Math.hypot((gx+.5)*EXP-x,(gy+.5)*EXP-y)<r)G.expl[gy*GW+gx]=1;
  }
  const gr=ectx.createRadialGradient(x/EXP,y/EXP,r/EXP*0.55,x/EXP,y/EXP,r/EXP*1.02);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');
  ectx.fillStyle=gr;ectx.beginPath();ectx.arc(x/EXP,y/EXP,r/EXP*1.02,0,6.283);ectx.fill();
}
const isExplored=(x,y)=>{const gx=Math.floor(x/EXP),gy=Math.floor(y/EXP);return gx>=0&&gy>=0&&gx<GW&&gy<GW&&G.expl[gy*GW+gx]===1};
function visSources(side){
  const out=[];
  for(const a of sideArmies(side)){const p=armyPos(a);out.push({x:p.x,y:p.y,r:sightOf(a)})}
  for(const id in NODES){
    if(G.own[id]!==side)continue;
    const n=NODES[id];
    out.push({x:n.x,y:n.y,r:n.type==='castle'?200:n.type==='tower'?250:120});
  }
  for(const id in G.fort){
    const f=G.fort[id];if(f.owner!==side)continue;
    out.push({x:NODES[id].x,y:NODES[id].y,r:f.type==='turm'?250:130});
  }
  return out;
}
function visibleAt(side,x,y){
  for(const s of visSources(side))if(Math.hypot(s.x-x,s.y-y)<s.r)return true;
  return false;
}
function refreshKnown(){
  const src=visSources(PL);
  for(const s of src){
    const k=`${Math.round(s.x/12)},${Math.round(s.y/12)},${s.r}`;
    if(!G.lastReveal[k]){G.lastReveal[k]=1;reveal(s.x,s.y,s.r)}
  }
  if(Object.keys(G.lastReveal).length>4000)G.lastReveal={};
  for(const id in NODES){
    const n=NODES[id];
    let v=false;for(const s of src)if(Math.hypot(s.x-n.x,s.y-n.y)<s.r){v=true;break}
    if(!v&&G.known[id])continue;
    if(!v&&!(G.own[id]===PL||isExplored(n.x,n.y)))continue;
    const first=!G.known[id];
    G.known[id]={owner:G.own[id]};
    if(first&&G.vgar&&G.vgar[id]>0&&!G.own[id]){
      const m=G.vgar[id];G.vgar[id]=0;G.K[PL].gar.inf+=m;G.vgot[id]=m;
      logMsg(n.name+' entdeckt: '+m+' Mann Dorfwache schließen sich dir an.','good');
    }
    G.knownFort[id]=G.fort[id]?{type:G.fort[id].type,owner:G.fort[id].owner}:null;
  }
  for(const a of G.armies)if(a.alive&&a.side===PL&&a.at!==null&&a.units.scout>0)G.visited[a.at]=true;
  const now={};
  for(const b of G.armies){
    if(!b.alive||b.side===PL)continue;
    const p=armyPos(b);
    for(const s of src)if(Math.hypot(s.x-p.x,s.y-p.y)<s.r){G.seen[b.id]={x:p.x,y:p.y,t:G.time,troops:troops(b),side:b.side};now[b.id]=true;break}
  }
  return now;
}
function refreshNew(){
  const was=G.visIds||{};
  G.visIds=refreshKnown();
  for(const id in G.visIds)if(!was[id]){
    const b=armyById(Number(id));
    if(b)logMsg('Fremdes Heer gesichtet: '+KINGS[b.side].name+' (ca. '+Math.round(troops(b)/10)*10+' Mann).','bad');
  }
}
const knownOwner=id=>{const kn=G.known[id];return kn?kn.owner:null};

/* ---------- Versorgung ---------- */
function supplyInfo(a){
  if(!a||!a.alive)return{cost:Infinity,rate:0,route:[]};
  const bn=new Set(),be=new Set();
  for(const e of foesOf(a.side)){
    if(e.at!==null)bn.add(e.at);
    else{be.add(e.from+'|'+e.to);be.add(e.to+'|'+e.from)}
  }
  const home=KINGS[a.side].capital;
  if(G.own[home]!==a.side)return{cost:Infinity,rate:0,route:[]};
  const r=dijkstra(home,'sup',bn,be);
  let cost=Infinity,anchor=null;
  if(a.at!==null){cost=r.dist[a.at];anchor=a.at}
  else{
    const e=EMAP[a.from+'|'+a.to];
    if(!be.has(a.from+'|'+a.to)){
      const cF=r.dist[a.from]+a.p*e.sup,cT=r.dist[a.to]+(1-a.p)*e.sup;
      if(cF<=cT){cost=cF;anchor=a.from}else{cost=cT;anchor=a.to}
    }
  }
  const route=[];
  if(isFinite(cost)&&anchor){let c=anchor;route.push(c);while(c!==home){c=r.prev[c];if(!c)break;route.push(c)}}
  const rate=isFinite(cost)?clamp(40-2*cost,0,40):0;
  return{cost,rate,route,anchor};
}

/* ---------- Bewegung ---------- */
function planArmy(a,target){
  if(a.at!==null){
    if(a.at===target){a.path=[];a.dest=null;return true}
    const r=pathFromTo(a.at,target);if(!r)return false;
    a.path=r.path;
  }else{
    const e=EMAP[a.from+'|'+a.to];
    const vt=pathFromTo(a.to,target),vf=pathFromTo(a.from,target);
    if(!vt||!vf)return false;
    const cT=(1-a.p)*e.move+vt.cost,cF=a.p*e.move+vf.cost;
    if(cT<=cF){a.path=[a.to].concat(vt.path)}
    else{const f=a.from;a.from=a.to;a.to=f;a.p=1-a.p;a.path=[a.to].concat(vf.path)}
  }
  a.dest=target;
  return true;
}
function routeSegs(a){
  const segs=[];
  if(a.at!==null){let prev=a.at;for(const n of a.path){segs.push([prev,n,0,1]);prev=n}}
  else{segs.push([a.from,a.to,a.p,1]);let prev=a.to;for(const n of a.path.slice(1)){segs.push([prev,n,0,1]);prev=n}}
  return segs;
}
function routeCost(a){let c=0;for(const [f,t,t0,t1] of routeSegs(a))c+=EMAP[f+'|'+t].move*(t1-t0);return c}
const etaSecs=a=>routeCost(a)/speedOf(a)*TURN_S;
function stepArmy(a,mp){
  while(mp>1e-9&&!G.over){
    if(a.at!==null){
      if(!a.path.length)break;
      a.from=a.at;a.to=a.path[0];a.p=0;a.at=null;
    }
    const e=EMAP[a.from+'|'+a.to];
    const need=(1-a.p)*e.move;
    if(mp>=need-1e-9){
      mp-=need;a.at=a.to;a.p=0;a.from=a.to=null;a.path.shift();
      onArrive(a);
    }else{a.p+=mp/e.move;mp=0}
  }
}
const enemyAt=(side,node)=>G.armies.some(x=>x.alive&&x.side!==side&&x.at===node);
function onArrive(a){
  const n=NODES[a.at],side=a.side;
  if(enemyAt(side,n.id)){if(a.dest===n.id)a.dest=null;return}
  if(n.type==='castle'){
    const ow=G.own[n.id];
    if(ow!==side&&G.K[ow]&&G.K[ow].alive){
      if(!(a.units.can>0)){if(side===PL&&a.dest===n.id)logMsg('Ohne Katapult kann '+n.name+' nicht gestürmt werden.','bad')}
      else if(side===PL||a.goal===n.id)conquer(side,ow);
    }
  }else if(G.own[n.id]!==side&&(isEco(n)||n.type==='tower')){
    occupy(a,n);
  }
  if(a.dest===n.id)a.dest=null;
}
function occupy(a,n){
  const prev=G.own[n.id],side=a.side;
  G.own[n.id]=side;
  if(prev&&prev!==side&&G.grudge[prev])G.grudge[prev][side]=(G.grudge[prev][side]||0)+1;
  if(prev===PL||side===PL||visibleAt(PL,n.x,n.y)){G.known[n.id]={owner:side};G.knownFort[n.id]=null}
  if(G.lvl[n.id]){G.lvl[n.id]=Math.max(1,G.lvl[n.id]-1);G.mood[n.id]=25;G.dev[n.id]=0}
  if(G.fort[n.id]&&G.fort[n.id].owner!==side)delete G.fort[n.id];
  a.occ=(a.occ||0)+1;
  if(G.vgar[n.id]>0){G.vgot[n.id]=G.vgar[n.id];G.K[side].gar.inf+=G.vgar[n.id];if(side===PL)logMsg(G.vgar[n.id]+' Mann Dorfwache aus '+n.name+' schließen sich dir an.','good');G.vgar[n.id]=0}
  if(side===PL){logMsg(n.name+' gehört jetzt zu deinem Reich'+(prev?' (von '+KINGS[prev].name+' erobert)':'')+'.','good');refreshKnown()}
  else if(prev===PL)logMsg(n.name+' wurde von '+KINGS[side].name+' erobert!','bad');
  else if(visibleAt(PL,n.x,n.y))logMsg(KINGS[side].name+' besetzt '+n.name+'.','dim');
}
function conquer(att,vic){
  const V=G.K[vic],A=G.K[att];
  V.alive=false;
  for(const r of RES_KEYS)A.stock[r]+=V.stock[r]*0.5;
  for(const id in NODES)if(G.own[id]===vic){G.own[id]=att;if(att===PL||vic===PL||G.known[id])G.known[id]={owner:att};if(G.lvl[id]){G.lvl[id]=Math.max(1,G.lvl[id]-1);G.mood[id]=25;G.dev[id]=0}if(G.fort[id])delete G.fort[id]}
  for(const b of G.armies)if(b.side===vic)b.alive=false;
  G.armies=G.armies.filter(x=>x.alive);
  logMsg((att===PL?'Du hast ':KINGS[att].name+' hat ')+KINGS[vic].name+' erobert!',att===PL?'good':'bad');
  if(vic===PL)G.over={winner:att,reason:'Deine Hauptburg ist gefallen. '+KINGS[att].name+' beherrscht nun dein Land.'};
  else if(aliveKings().length===1)G.over={winner:PL,reason:'Alle anderen Königreiche sind gefallen – du herrschst über das ganze Land!'};
  refreshKnown();

/* ---------- Teilen / Vereinen ---------- */
function splitArmy(a,amt){
  if(!a||!a.alive||a.at===null)return null;
  const take=blankUnits(),rest=blankUnits();let tn=0,rn=0;
  for(const k of UK){
    const n=clamp(Math.floor(amt[k]||0),0,a.units[k]);
    take[k]=n;rest[k]=a.units[k]-n;tn+=n;rn+=rest[k];
  }
  if(tn<MIN_SPLIT||rn<MIN_SPLIT)return null;
  if(sideArmies(a.side).length>=MAX_ARMIES)return null;
  const nb=mkArmy(a.side,'Abteilung '+(++G.cnt[a.side]),take,a.at);
  const fr=tn/(tn+rn);
  nb.food=a.food*fr;a.food-=nb.food;
  nb.arrows=a.arrows*fr;a.arrows-=nb.arrows;
  a.units=rest;a.startTroops=Math.max(1,Math.round(a.startTroops*(1-fr)));
  nb.startTroops=tn;
  G.armies.push(nb);
  return nb;
}
function splitFrac(a,f){const amt={};for(const k of UK)amt[k]=Math.floor(a.units[k]*f);return splitArmy(a,amt)}
function splitScouts(a){
  if(!a||a.at===null||a.units.scout<1||sideArmies(a.side).length>=MAX_ARMIES)return null;
  const amt=blankUnits();amt.scout=a.units.scout;
  const take=blankUnits();take.scout=a.units.scout;
  const nb=mkArmy(a.side,'Späher '+(++G.cnt[a.side]),take,a.at);
  a.units.scout=0;nb.startTroops=troops(nb);nb.food=Math.min(a.food,foodCap(nb));a.food-=nb.food;
  G.armies.push(nb);return nb;
}
function mergeArmies(a,b){
  if(!a||!b||a===b||a.side!==b.side||a.at===null||a.at!==b.at)return false;
  for(const k of UK)a.units[k]+=b.units[k];
  a.food+=b.food;a.arrows+=b.arrows;a.startTroops+=b.startTroops;
  a.food=Math.min(a.food,foodCap(a));a.arrows=Math.min(a.arrows,arrowCap(a));
  b.alive=false;
  G.armies=G.armies.filter(x=>x!==b);
  if(G.sel===b.id)G.sel=a.id;
  return true;
}

/* ---------- Wirtschaft ---------- */
function econCaps(k){
  const c={farm:0,wood:0,ore:0,coal:0,craft:0};
  for(const id of owned(k)){const cn=CAPN[NODES[id].type];if(cn)for(const x in cn)c[x]+=cn[x]*lvlF(id)}
  return c;
}
const prodMult=k=>0.6+0.4*G.K[k].loy/100;
const SOLD=0.2;
function econPlan(k,wOverride,prodOverride){
  const K=G.K[k],w=wOverride||K.w,caps=econCaps(k),Wk=workforce(k),pm=prodMult(k);
  const sum=PROFS.reduce((s,p)=>s+w[p],0)||1;
  const alloc={},eff={};
  for(const p of PROFS)alloc[p]=Wk*w[p]/sum;
  for(const p of ['farm','wood','ore','coal'])eff[p]=Math.min(alloc[p],caps[p]);
  const craft=alloc.smelt+alloc.smith+alloc.fletch,cf=craft>caps.craft&&craft>0?caps.craft/craft:1;
  for(const p of ['smelt','smith','fletch'])eff[p]=alloc[p]*cf;
  const st={};for(const r of RES_KEYS)st[r]=K.stock[r];
  const d={};for(const r of RES_KEYS)d[r]=0;
  const gross={};
  const add=(r,v)=>{d[r]+=v;st[r]+=v};
  gross.food=eff.farm*PRATE.farm*pm;gross.wood=eff.wood*PRATE.wood*pm;gross.ore=eff.ore*PRATE.ore*pm;gross.coal=eff.coal*PRATE.coal*pm;
  add('food',gross.food);add('wood',gross.wood);add('ore',gross.ore);add('coal',gross.coal);
  let u=Math.min(eff.smelt*1.5*pm,st.ore,st.coal*2);
  add('ore',-u);add('coal',-u*0.5);add('iron',u);gross.iron=u;
  const prod=prodOverride||K.prod;
  if(prod==='cannons'){
    u=Math.min(eff.smith*0.15*pm,st.iron/4,st.wood/10);
    add('iron',-u*4);add('wood',-u*10);add('cannons',u);gross.cannons=u;gross.arms=0;
  }else{
    u=Math.min(eff.smith*1.2*pm,st.iron,st.coal/0.4);
    add('iron',-u);add('coal',-u*0.4);add('arms',u);gross.arms=u;gross.cannons=0;
  }
  u=Math.min(eff.fletch*1.2*pm,st.wood/3.5);
  add('wood',-u*3.5);add('bows',u);add('ammo',u*3);gross.bows=u;
  const pop=popOf(k);
  const eat=pop*0.45;add('food',-eat);
  gross.gold=pop*0.1*TAXM[K.tax]*(K.loy/100);add('gold',gross.gold);
  /* Ausgaben: Sold fürs Heer, Unterhalt für Befestigungen */
  let men=0;for(const a of sideArmies(k))men+=troops(a);for(const u of UK)men+=K.gar[u]||0;
  let keep=G.wall[k]*12;for(const id in G.fort){const f=G.fort[id];if(f.owner===k&&G.own[id]===k)keep+=f.type==='turm'?10:4}
  const pay=men*SOLD;
  gross.pay=pay;gross.keep=keep;gross.men=men;add('gold',-(pay+keep));
  return{alloc,eff,caps,Wk,d,gross,eat,pop,pm,unused:Math.max(0,Wk-(eff.farm+eff.wood+eff.ore+eff.coal+eff.smelt+eff.smith+eff.fletch))};
}
function applyEconomy(k){
  const K=G.K[k],plan=econPlan(k);
  const short=K.stock.gold+plan.d.gold<0;
  for(const r of RES_KEYS)K.stock[r]=Math.max(0,K.stock[r]+plan.d[r]);
  K.unpaid=short;
  if(short){K.loy=Math.max(5,K.loy-4);for(const a of sideArmies(k))for(const u of UK)a.units[u]=Math.floor(a.units[u]*0.95)}
  K.stock.food=Math.min(K.stock.food,2500);
  const raw=K.stock.food===0&&K.stock.food+plan.d.food<0;
  /* Hunger */
  let hungry=false;
  if(plan.d.food<0&&K.stock.food<=0.01){hungry=true}
  K.hunger=hungry?K.hunger+1:0;
  /* Zufriedenheit */
  let tg=TAX_TARGET[K.tax];if(hungry)tg-=25;
  K.loy+=clamp(tg-K.loy,-9,9);K.loy=clamp(K.loy,5,100);
  if(hungry)for(const a of sideArmies(k)){for(const u of UK)a.units[u]=Math.floor(a.units[u]*0.97)}
  return plan;
}
function moodInfo(id){
  const k=G.own[id],K=G.K[k],r=[];
  let t=30+K.loy*0.5;r.push(['Volk '+(K.loy>=60?'zufrieden':'unzufrieden'),Math.round(t-50)]);
  const add=(txt,v)=>{t+=v;r.push([txt,v])};
  if(G.fort[id]&&G.fort[id].owner===k)add('Befestigung schützt',8);
  if(G.routes.some(x=>x.a===id||x.b===id)&&k===PL)add('Handelsroute',8);
  let own=0;for(const {to,e} of ADJ[id])if(G.own[to]===k&&e.type==='road')own++;
  if(own>=2)add('gute Straßenanbindung',6);else if(own===0)add('abgelegen',-10);
  if(K.hunger>0)add('Hunger im Reich',-20);
  if(G.armies.some(a=>a.alive&&a.side!==k&&a.at===id))add('Feind im Ort',-25);
  else if(ADJ[id].some(({to})=>G.armies.some(a=>a.alive&&a.side!==k&&a.at===to)))add('Feind in der Nähe',-8);
  return{target:clamp(t,0,100),reasons:r};
}
function bumpLevel(id,k){
  let ch=0;
  while(G.dev[id]>=4&&G.lvl[id]<5){G.lvl[id]++;G.dev[id]-=4;ch=1}
  while(G.dev[id]<=-4&&G.lvl[id]>1){G.lvl[id]--;G.dev[id]+=4;ch=-1}
  if(G.lvl[id]>=5)G.dev[id]=Math.min(G.dev[id],0);
  if(G.lvl[id]<=1)G.dev[id]=Math.max(G.dev[id],0);
  if(ch&&k===PL)G.devLog.push(NODES[id].name+(ch>0?' blüht auf (Stufe '+G.lvl[id]+')':' verarmt (Stufe '+G.lvl[id]+')'));
}
function developNodes(k){
  for(const id of owned(k)){
    if(NODES[id].type==='castle')continue;
    const m=moodInfo(id);
    G.mood[id]+=clamp(m.target-G.mood[id],-10,10);
    if(G.mood[id]>=60)G.dev[id]+=1;else if(G.mood[id]<40)G.dev[id]-=1;
    bumpLevel(id,k);
  }
}
const REC_DAYS={inf:8,bow:9,cav:14,can:18,scout:5};
const BUILD_DAYS={schanze:10,turm:20,mauer:30,ausbau:15};
const roadDays=e=>Math.max(8,Math.ceil(e.len/12));
const daysLeft=o=>Math.max(1,Math.ceil((o.end-G.time)/DAY_S));
const progOf=o=>clamp((G.time-o.start)/(o.end-o.start),0,1);
function applyBuild(k,b){
  if(b.kind==='strasse'){
    const e=EMAP[b.edge];
    if(e&&passOk(k,e.a)&&passOk(k,e.b)){applyEdge(e,'road',e.ford?e.fordT:0);if(k===PL)logMsg('Straße '+NODES[e.a].name+' – '+NODES[e.b].name+' ist fertig.','good')}
    return;
  }
  if(G.own[b.node]!==k)return;
  if(b.kind==='ausbau'){G.dev[b.node]+=4;G.mood[b.node]=Math.min(100,G.mood[b.node]+10);bumpLevel(b.node,k)}
  else if(b.kind==='mauer')G.wall[k]=Math.min(2,G.wall[k]+1);
  else{G.fort[b.node]={type:b.kind,owner:k};if(k===PL)G.knownFort[b.node]={type:b.kind,owner:k}}
  if(k===PL)logMsg((b.kind==='mauer'?'Burgmauer Stufe '+G.wall[k]:FORT[b.kind].name+' bei '+NODES[b.node].name)+' ist fertig.','good');
}
function completeOrders(k){
  const K=G.K[k];

    const keep=[];
    for(const o of K.orders.rq){
      if(o.end<=G.time){K.gar[o.t]+=RECR[o.t].n;K.orders.rec[o.t]=Math.max(0,K.orders.rec[o.t]-1);if(k===PL)logMsg(RECR[o.t].n+' '+(UNAME_L[o.t]||o.t)+' sind ausgebildet und stehen in der Burg bereit.','good')}
      else keep.push(o);

}
const UNAME_L={inf:'Fußvolk',bow:'Bogenschützen',cav:'Reiter',can:'Katapulte',scout:'Späher'};
function orderRecruit(k,t){

  if(!canPay(k,RECR[t].cost))return false;
  pay(k,RECR[t].cost);K.orders.rec[t]++;

}
function cancelRecruit(k,t){

  for(let i=K.orders.rq.length-1;i>=0;i--)if(K.orders.rq[i].t===t){K.orders.rq.splice(i,1);break}
}
function buildAllowed(k,kind,node){
  const n=NODES[node];if(G.own[node]!==k)return false;
  if(kind==='ausbau')return n.type!=='castle'&&(G.lvl[node]||1)<5&&!G.K[k].orders.build.some(b=>b.node===node&&b.kind==='ausbau');
  if(kind==='mauer')return n.type==='castle'&&G.wall[k]<2&&!G.K[k].orders.build.some(b=>b.kind==='mauer');
  if(n.type==='castle')return false;
  if(kind==='turm'?!(G.fort[node]&&G.fort[node].type==='schanze'):G.fort[node])return false;
  if(G.K[k].orders.build.some(b=>b.node===node&&b.kind!=='mauer'&&b.kind!=='ausbau'))return false;
  return true;
}
function orderBuild(k,kind,node){
  const cost=kind==='mauer'?wallCost(k):FORT[kind].cost,days=kind==='mauer'?WALL_DAYS[Math.min(1,G.wall[k])]:BUILD_DAYS[kind];
  if(!buildAllowed(k,kind,node)||!canPay(k,cost))return false;
  pay(k,cost);G.K[k].orders.build.push({kind,node,cost,lvl:kind==='mauer'?G.wall[k]+1:0,start:G.time,end:G.time+days*DAY_S});return true;
}
const roadCost=e=>({wood:Math.ceil(e.len/5),gold:Math.ceil(e.len/4)});
const buildLabel=b=>{if(b.kind==='strasse'){const e=EMAP[b.edge];return 'Straße '+NODES[e.a].name+' – '+NODES[e.b].name}return b.kind==='mauer'?'Burgmauer Stufe '+b.lvl:FORT[b.kind].name+' bei '+NODES[b.node].name};
function roadPending(k,e){return G.K[k].orders.build.some(b=>b.kind==='strasse'&&EMAP[b.edge]===e)}
/* Straße A–B ist erlaubt, wenn A oder B schon über Straßen mit der Hauptburg verbunden ist */
function roadReach(k){
  const home=KINGS[k].capital,seen=new Set([home]),q=[home];
  while(q.length){const u=q.shift();for(const {to,e} of ADJ[u]){if(e.type==='road'&&!seen.has(to)&&passOk(k,to)){seen.add(to);q.push(to)}}}
  return seen;
}
function gapTo(k,T){
  const home=KINGS[k].capital,dist={},prev={},done=new Set();
  for(const id in NODES)dist[id]=Infinity;
  dist[home]=0;
  for(;;){
    let u=null,ud=Infinity;
    for(const id in dist)if(!done.has(id)&&dist[id]<ud){ud=dist[id];u=id}
    if(u===null||u===T)break;
    done.add(u);
    for(const {to,e} of ADJ[u]){
      if(!passOk(k,to))continue;
      const c=ud+(e.type==='road'?0.001:1);
      if(c<dist[to]){dist[to]=c;prev[to]=u}
    }
  }
  if(!isFinite(dist[T]))return null;
  const path=[T];let c=T;while(c!==home&&prev[c]){c=prev[c];path.unshift(c)}
  for(let i=0;i<path.length-1;i++){if(EMAP[path[i]+'|'+path[i+1]].type!=='road')return{from:path[i],to:path[i+1],n:Math.floor(dist[T])}}
  return null;
}
function roadGap(k,A,B){
  const reach=roadReach(k);
  if(reach.has(A)||reach.has(B))return null;
  const ga=gapTo(k,A),gb=gapTo(k,B);
  const g=(ga&&gb)?(ga.n<=gb.n?ga:gb):(ga||gb);
  return g||{from:A,to:B};
}
function orderRoad(k,e,fromNode){
  if(e.type==='road'||roadPending(k,e)||!passOk(k,e.a)||!passOk(k,e.b))return false;
  const c=roadCost(e);if(!canPay(k,c))return false;
  pay(k,c);G.K[k].orders.build.push({kind:'strasse',edge:e.a<e.b?e.a+'|'+e.b:e.b+'|'+e.a,node:fromNode,cost:c,start:G.time,end:G.time+roadDays(e)*DAY_S});return true;
}
function cancelBuild(k,idx){
  const b=G.K[k].orders.build[idx];if(!b)return;
  refund(k,b.cost||FORT[b.kind].cost);G.K[k].orders.build.splice(idx,1);
}
function absorbGarrison(k){
  const K=G.K[k];let gc=0;for(const u of UK)gc+=K.gar[u];
  if(!gc)return;
  const home=KINGS[k].capital;
  if(G.own[home]!==k)return;
  const here=sideArmies(k).filter(a=>a.at===home);
  const st=K.stock;
  let tgt=here.find(a=>a.units.scout===0)||here[0];
  const onlyScouts=UK.every(u=>u==='scout'||K.gar[u]===0);
  if(onlyScouts&&K.gar.scout>0&&sideArmies(k).length<MAX_ARMIES){
    tgt=mkArmy(k,'Späher '+(++G.cnt[k]),blankUnits(),home);tgt.startTroops=0;tgt.food=0;tgt.arrows=0;G.armies.push(tgt);
    if(k===PL)logMsg('Späher stehen bereit in der Burg.','good');
  }else if(!tgt){
    if(sideArmies(k).length>=MAX_ARMIES)return;
    tgt=mkArmy(k,'Abteilung '+(++G.cnt[k]),blankUnits(),home);tgt.startTroops=0;tgt.food=0;tgt.arrows=0;G.armies.push(tgt);
    if(k===PL)logMsg('Neue '+tgt.name+' ('+gc+' Mann) formiert sich in der Burg.','good');
  }else if(k===PL)logMsg(gc+' Rekruten stoßen zu '+tgt.name+'.','good');
  for(const u of UK){tgt.units[u]+=K.gar[u];K.gar[u]=0}
  tgt.startTroops+=gc;
  const tf=Math.min(Math.max(0,foodCap(tgt)-tgt.food),st.food);tgt.food+=tf;st.food-=tf;
  const ta=Math.min(Math.max(0,arrowCap(tgt)-tgt.arrows),st.ammo);tgt.arrows+=ta;st.ammo-=ta;
}

/* ---------- Handel (Spieler) ---------- */
const GOODS={farm:{food:60},mine:{iron:30},village:{food:30},castle:{food:20},coal:{coal:40},lumber:{wood:40}};
const profitOf=c=>Math.round(10+7*c);
function routeProfit(rt){return profitOf(rt.cost)}
function addRoute(a,b){
  if(G.routes.length>=MAX_ROUTES||G.own[a]!==PL||G.own[b]!==PL||a===b)return false;
  if(G.routes.some(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a)))return false;
  if(!canPay(PL,{gold:60}))return false;
  const pr=pathFromTo(a,b);if(!pr)return false;
  pay(PL,{gold:60});
  G.routes.push({id:G.nextId++,a,b,nodes:[a].concat(pr.path),k:0,p:0,cost:pr.cost,cycle:pr.cost/0.32,origin:a});
  logMsg('Handelsroute '+NODES[a].name+' – '+NODES[b].name+' eröffnet.','good');
  return true;
}
function removeRoute(id,msg){const i=G.routes.findIndex(r=>r.id===id);if(i<0)return;G.routes.splice(i,1);if(msg)logMsg(msg,'bad')}
function cartPos(rt){return edgePoint(EMAP[rt.nodes[rt.k]+'|'+rt.nodes[rt.k+1]],rt.nodes[rt.k],rt.p)}
const routeActive=rt=>G.own[rt.a]===PL&&G.own[rt.b]===PL;
function stepCarts(dt){
  for(const rt of G.routes.slice()){
    if(!routeActive(rt))continue;
    let mp=0.32*dt;
    while(mp>1e-9){
      const e=EMAP[rt.nodes[rt.k]+'|'+rt.nodes[rt.k+1]];
      const need=(1-rt.p)*e.move;
      if(mp>=need){
        mp-=need;rt.k++;rt.p=0;
        if(rt.k>=rt.nodes.length-1){
          const dest=rt.nodes[rt.nodes.length-1],orig=rt.nodes[0];
          const pf=routeProfit(rt);
          G.K[PL].stock.gold+=pf;G.pend.gold+=pf;spawnParts('gold',pf,dest,0);
          const gd=GOODS[NODES[orig].type]||{};
          for(const r in gd){G.K[PL].stock[r]+=gd[r];if(PENDMAP[r])G.pend[r]+=gd[r];spawnParts(r,gd[r],dest,0.3)}
          rt.nodes.reverse();rt.k=0;rt.p=0;
        }
      }else{rt.p+=mp/e.move;mp=0}
    }
  }
}
function routeChecks(){
  for(const rt of G.routes.slice()){
    if(!routeActive(rt))continue;
    const p=cartPos(rt);
    for(const b of foesOf(PL))if(dist(armyPos(b),p)<45){removeRoute(rt.id,'Dein Händler wurde überfallen!');break}
  }
}
function updateParts(dt){
  for(const p of G.parts.slice()){
    if(p.delay>0){p.delay-=dt;continue}
    p.t+=dt;
    if(p.t>=p.dur){
      if(PENDMAP[p.k])G.pend[p.k]=Math.max(0,G.pend[p.k]-p.amt);
      bump[p.k]=performance.now();G.parts.splice(G.parts.indexOf(p),1);
    }
  }
}
function updateFx(dt){for(const f of G.fx.slice()){f.t+=dt;if(f.t>=f.dur)G.fx.splice(G.fx.indexOf(f),1)}}

/* ---------- Versorgung pro Sekunde ---------- */
function upkeep(a){
  if(!a.alive)return;
  const st=G.K[a.side].stock,per=1/TURN_S;
  const s=supplyInfo(a);a.supc=s;a.lastRate=s.rate;
  const addF=Math.min(s.rate*per,st.food,Math.max(0,foodCap(a)-a.food));
  a.food+=addF;st.food-=addF;
  const addA=Math.min(s.rate*0.4*per,st.ammo,Math.max(0,arrowCap(a)-a.arrows));
  a.arrows+=addA;st.ammo-=addA;
  a.food-=troops(a)/60*per;
  if(a.food<=0){
    a.food=0;a.starving=true;a.starveT++;
    if(a.starveT>=TURN_S){
      a.starveT=0;
      for(const k of UK)a.units[k]=Math.floor(a.units[k]*0.93);
      if(a.side===PL)logMsg('Hunger bei '+a.name+'! Soldaten desertieren.','bad');
      checkDestroyed(a);
    }
  }else{a.starving=false;a.starveT=0}
  if(a.side===PL&&a.alive){
    if(s.rate===0&&!a.cut){a.cut=true;logMsg(a.name+': Nachschublinie abgeschnitten!','bad')}
    else if(s.rate>0)a.cut=false;
  }
}
function checkDestroyed(a){
  if(a.alive&&troops(a)<MIN_ALIVE){
    a.alive=false;
    if(a.side===PL)logMsg(a.name+' ist aufgerieben.','battle');
    else if(G.visIds[a.id])logMsg('Ein fremdes Heer ('+KINGS[a.side].name+') ist aufgerieben.','good');
  }
}
function fortCheck(){
  for(const id in G.fort){
    const f=G.fort[id];
    const en=foesOf(f.owner).some(a=>a.at===id);
    const mine=sideArmies(f.owner).some(a=>a.at===id);
    if(en&&!mine&&G.own[id]===f.owner){
      if(f.owner===PL)logMsg('Der Feind zerstört deine '+FORT[f.type].name+' bei '+NODES[id].name+'.','bad');
      delete G.fort[id];
    }
  }
}

/* ---------- Kampf ---------- */
function terrBonus(a){
  let b=1;
  if(a.at!==null){
    const n=NODES[a.at];
    if(n.type==='castle'&&G.own[n.id]===a.side)b*=1.25+0.65*G.wall[a.side];
    else if(n.type==='tower')b*=1.25;
    else if(isEco(n))b*=1.1;
    const f=G.fort[n.id];
    if(f&&f.owner===a.side)b*=f.type==='turm'?1.35:1.3;
  }else{
    const e=EMAP[a.from+'|'+a.to];
    if(e.type==='forest'||e.type==='hills')b*=1.15;
    if(e.type==='swamp'||e.type==='mountain')b*=0.9;
  }
  return b;
}
const UPOW={inf:1.0,cav:1.5,scout:0.2};
function siegeShare(list){let c=0,t=0;for(const z of list){c+=z.units.can;t+=troops(z)}return t?Math.min(0.7,c/t*8):0}
function armyPower(a){
  const u=a.units;
  let s=0;for(const k in UPOW)s+=u[k]*UPOW[k];
  s+=u.bow*(a.arrows>0?1.2:0.3);
  s+=u.can*(a.arrows>0?2.6:0.2);
  if(a.food<=0)s*=0.6;
  return s;
}
function applyLoss(a,f){for(const k of UK)a.units[k]=Math.floor(a.units[k]*(1-f))}
function resolveBattle(x,y){
  const site=armyPos(x),sa=x.side,sb=y.side;
  const near=side=>sideArmies(side).filter(z=>dist(armyPos(z),site)<COLLIDE_DIST*1.3);
  const PA=near(sa),PB=near(sb);
  if(!PA.length||!PB.length)return;
  const ra=0.85+G.rnd()*0.3,rb=0.85+G.rnd()*0.3;
  let pa=0,pb=0;
  const sgA=siegeShare(PA),sgB=siegeShare(PB);
  const tb=(z,sg)=>{const b=terrBonus(z);return b>1?1+(b-1)*(1-sg):b};
  for(const z of PA)pa+=armyPower(z)*tb(z,sgB);
  for(const z of PB)pb+=armyPower(z)*tb(z,sgA);
  pa*=ra;pb*=rb;
  const aWins=pa>=pb;
  const winners=aWins?PA:PB,losers=aWins?PB:PA;
  const wp=Math.max(pa,pb),lp=Math.max(1,Math.min(pa,pb));
  const bA=PA.reduce((s,z)=>s+troops(z),0),bB=PB.reduce((s,z)=>s+troops(z),0);
  for(const z of PA.concat(PB))if(z.units.bow>0||z.units.can>0)z.arrows=Math.max(0,z.arrows-20);
  const lossW=Math.min(0.35,0.08+0.3*lp/wp);
  for(const z of losers)applyLoss(z,0.45);
  for(const z of winners)applyLoss(z,lossW);
  const lA=bA-PA.reduce((s,z)=>s+troops(z),0),lB=bB-PB.reduce((s,z)=>s+troops(z),0);
  const n=nearestNode(site.x,site.y);
  const where=dist(site,NODES[n])<70?NODES[n].name:'offenem Gelände';
  if(sa===PL||sb===PL){
    const me=sa===PL?lA:lB,he=sa===PL?lB:lA,foe=sa===PL?sb:sa;
    const won=(sa===PL)===aWins;
    logMsg('Schlacht bei '+where+' gegen '+KINGS[foe].name+': '+(won?'Du siegst':'Du wirst geschlagen')+'. Verluste: du '+me+', Gegner ca. '+Math.round(he/10)*10+'.','battle');
    if(G.speed>1)G.speed=1;
  }else if(visibleAt(PL,site.x,site.y))logMsg('Schlacht bei '+where+': '+KINGS[sa].name+' gegen '+KINGS[sb].name+'.','dim');
  G.fx.push({type:'clash',x:site.x,y:site.y,t:0,dur:3.2});
  for(const p of PA)for(const q of PB)G.cool[ck(p,q)]=G.time+7;
  for(const z of winners)z.haltUntil=G.time+5;
  for(const z of losers){
    z.path=[];z.dest=null;
    const home=KINGS[z.side].capital;
    if(z.side!==PL)z.retreating=true;
    /* Rückzug zum nächstgelegenen eigenen Ort */
    if(z.at!==null&&G.own[z.at]===z.side){z.path=[];z.dest=null}
    else{
      const src=z.at!==null?z.at:z.from,rr=dijkstra(src,'move');
      let bt=null,bd=Infinity;
      for(const id in NODES){if(G.own[id]!==z.side||enemyAt(z.side,id))continue;const d=rr.dist[id];if(d<bd){bd=d;bt=id}}
      if(!bt||!planArmy(z,bt))planArmy(z,home);
    }
    z.bold=false;
  }
  for(const z of winners)z.bold=false;
  for(const z of PA.concat(PB))checkDestroyed(z);
  for(const z of losers){
    if(!z.alive)continue;
    for(let i=0;i<20;i++){
      const p=armyPos(z);
      let m=Infinity;for(const w of winners)if(w.alive)m=Math.min(m,dist(p,armyPos(w)));
      if(m>=95)break;
      stepArmy(z,0.1);
    }
  }
}
function collisions(){
  const L=G.armies.filter(a=>a.alive);
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const a=L[i],b=L[j];
    if(a.side===b.side)continue;
    if((G.cool[ck(a,b)]||0)>G.time)continue;
    if(dist(armyPos(a),armyPos(b))<COLLIDE_DIST){resolveBattle(a,b);return}
  }
}

/* ---------- Gegner-KI ---------- */
function adviseWeights(k){
  const K=G.K[k],w=defaultWeights();
  for(let i=0;i<14;i++){
    const p=econPlan(k,w);
    if(p.d.food<0)w.farm+=6;
    else if(p.d.wood<0)w.wood+=4;
    else if(p.d.iron<0||p.d.coal<0&&p.unused>0)w.smelt+=2;
    else if(K.stock.arms<80&&p.d.arms<20)w.smith+=3;
    else break;
  }
  return w;
}
function focusWeights(k,focus){
  const w=adviseWeights(k);
  if(focus==='arms'||focus==='cannons'){w.smith+=12;w.smelt+=6;w.ore+=4;w.coal+=3}
  else if(focus==='bows'){w.fletch+=14;w.wood+=4}
  G.K[k].prod=focus==='cannons'?'cannons':'arms';
  for(let i=0;i<14;i++){const p=econPlan(k,w);if(p.d.food<0)w.farm+=6;else break}
  return w;
}
function aiEconomy(k){
  const K=G.K[k];
  const w=adviseWeights(k);
  if(K.stock.food>1600)w.farm*=0.6;
  if(K.stock.iron>250)w.smelt*=0.5;
  if(K.stock.arms>200)w.smith*=0.6;
  K.w=w;K.tax=1;
  K.prod=(dateInfo(G.time).m%3===2)?'cannons':'arms';
}
function aiRecruit(k){
  const order=['inf','bow','inf','cav','can','inf','bow','scout'];
  for(let i=0;i<7;i++){
    const t=order[Math.floor(G.rnd()*order.length)];
    if(t==='scout')continue;
    if(G.K[k].orders.rq.filter(x=>x.t===t).length<3)orderRecruit(k,t);
  }
  for(const t of ['inf','bow','inf','bow'])if(G.K[k].orders.rq.filter(x=>x.t===t).length<3)orderRecruit(k,t);
}
function aiCouncil(k){
  aiEconomy(k);aiRecruit(k);
  const K=G.K[k];
  if(K.orders.build.length===0&&G.wall[k]<2&&G.rnd()<0.3)orderBuild(k,'mauer',KINGS[k].capital);
}
function nearestFreeEco(b,limit){
  const from=b.at!==null?b.at:b.to;
  const r=dijkstra(from,'move');
  let best=null,bd=Infinity;
  for(const id in NODES){
    const n=NODES[id];
    if(!(isEco(n)||n.type==='tower')||G.own[id]===b.side||enemyAt(b.side,id))continue;
    if(r.dist[id]<bd){bd=r.dist[id];best=id}
  }
  return bd<=limit?best:null;
}
function aiProfile(k){
  const m=G.mode||'normal';
  if(m==='easy')return{expand:false,chase:false,conq:null,cap:null};
  if(m==='normal')return{expand:true,chase:true,conq:{m:4,t:350,ok:()=>true},cap:null};
  if(m==='hard')return{expand:true,chase:true,conq:{m:2,t:250,ok:()=>true},cap:{m:3,t:300,pref:()=>G.K[PL].alive?KINGS[PL].capital:null,ok:()=>true}};
  /* geschichtlich: Persönlichkeit + Entwicklung */
  const p=(G.persona&&G.persona[k])||'eroberer',gr=G.grudge&&G.grudge[k]||{};
  const mine=soldiersOf(k),cnt=owned(k).length,base=G.start0[k]||cnt;
  const others=aliveKings().filter(o=>o!==k);
  const strongest=others.slice().sort((a,c)=>soldiersOf(c)+owned(c).length*20-soldiersOf(a)-owned(a).length*20)[0];
  const turtle=cnt<base*0.55||mine<250;   /* zu schwach: verteidigt nur */
  const g=o=>gr[o]||0;
  const prof={expand:true,chase:true,conq:null,cap:null};
  const grudgeOk=o=>g(o)>0;
  if(p==='eroberer'){prof.conq={m:3,t:300,ok:o=>soldiersOf(o)<=mine*1.15||g(o)>0};if(owned(k).length>=base*1.4&&strongest)prof.cap={m:8,t:500,pref:()=>KINGS[strongest].capital,ok:()=>true}}
  else if(p==='bewahrer'){prof.conq={m:3,t:350,ok:grudgeOk}}
  else if(p==='raecher'){prof.conq={m:3,t:300,ok:grudgeOk};const w=others.sort((a,c)=>g(c)-g(a))[0];if(w&&g(w)>=2)prof.cap={m:5,t:400,pref:()=>KINGS[w].capital,ok:o=>o===w}}
  else if(p==='opportunist'){prof.conq={m:4,t:300,ok:o=>soldiersOf(o)<mine*0.7||owned(o).length<(G.start0[o]||99)*0.7||g(o)>0};const weak=others.find(o=>soldiersOf(o)<mine*0.5);if(weak)prof.cap={m:5,t:350,pref:()=>KINGS[weak].capital,ok:o=>o===weak}}
  else if(p==='reichsgruender'){if(strongest){prof.conq={m:4,t:350,ok:o=>o===strongest||g(o)>0};prof.cap={m:7,t:450,pref:()=>KINGS[strongest].capital,ok:o=>o===strongest}}}
  else if(p==='haendler'){prof.conq={m:5,t:350,ok:o=>g(o)>=2}}
  if(turtle){prof.conq=null;prof.cap=null;prof.expand=cnt<base}
  return prof;
}
function aiDecide(b){
  const k=b.side,home=KINGS[k].capital;
  if(G.own[home]!==k)return;
  const bp=armyPos(b);
  const seen=[];
  for(const e of foesOf(k)){
    const p=armyPos(e);
    if(visibleAt(k,p.x,p.y))seen.push({e,p,d:dist(bp,p)});
  }
  seen.sort((p,q)=>p.d-q.d);
  const near=seen[0];
  const sup=supplyInfo(b),fc=foodCap(b),base=b.startTroops||troops(b);
  if(!b.retreating&&(b.food<fc*0.3||(sup.rate<=2&&b.food<fc*0.55)||(troops(b)<0.45*base&&!b.bold)))b.retreating=true;
  if(b.retreating&&b.at===home&&b.food>=fc*0.8){
    b.restT+=AI_DT;
    if(troops(b)>=0.5*base||b.restT>=50){b.retreating=false;b.restT=0;b.bold=true}
  }
  if(b.retreating){
    if(b.at===home){b.path=[];b.dest=null}else if(b.dest!==home)planArmy(b,home);
    return;
  }
  if(b.units.scout>0&&b.units.scout>=troops(b)*0.5){b.path=[];return}
  if(b.at===home&&troops(b)<140&&b.name!=='Hauptheer'&&sideArmies(k).length>1){b.path=[];b.dest=null;return}
  if(b.at===null)return;                       /* unterwegs wird nicht umgeplant */
  const month=dateInfo(G.time).m;
  if(b.goal){
    const gn=b.goal;
    if(G.own[gn]!==k&&b.dest===gn)return;      /* Ziel beibehalten */
    b.goal=null;
  }
  const setGoal=t=>{if(t!==b.at&&planArmy(b,t)){b.goal=t;return true}return false};
  const P=aiProfile(k);
  /* Verfolgung nur bei klarer Überlegenheit und nach der Anfangszeit */
  if(P.chase&&month>=2&&near&&near.d<300&&troops(b)>=1.3*troops(near.e)&&(G.mode!=='history'||P.conq)){const t=nearestNode(near.p.x,near.p.y);if(setGoal(t))return}
  const r=dijkstra(b.at,'move');
  const pick=(pred,limit)=>{
    let best=null,bd=Infinity;
    for(const id in NODES){
      const n=NODES[id];
      if(id===b.at||!pred(n,id)||enemyAt(k,id))continue;
      if(r.dist[id]<bd){bd=r.dist[id];best=id}
    }
    return bd<=limit?best:null;
  };
  /* 1. freie Orte besetzen */
  if(P.expand){
    const free=pick((n,id)=>(isEco(n)||n.type==='tower')&&!G.own[id],14);
    if(free&&b.food>=fc*0.5&&setGoal(free))return;
  }
  /* 2. Orte anderer Reiche erobern (nicht die Hauptburg) */
  if(P.conq&&month>=P.conq.m&&troops(b)>=P.conq.t&&b.food>=fc*0.6){
    const foe=pick((n,id)=>(isEco(n)||n.type==='tower')&&G.own[id]&&G.own[id]!==k&&P.conq.ok(G.own[id]),G.mode==='hard'?16:10);
    if(foe&&setGoal(foe))return;
  }
  /* 3. Hauptburg angreifen */
  if(P.cap&&month>=P.cap.m&&troops(b)>=P.cap.t&&b.food>=fc*0.6){
    let best=P.cap.pref?P.cap.pref():null;
    if(best&&(G.own[best]===k||!G.K[G.own[best]]||!G.K[G.own[best]].alive))best=null;
    if(!best){let bd=Infinity;for(const o of aliveKings()){if(o===k||!P.cap.ok(o))continue;const cap=KINGS[o].capital;if(r.dist[cap]<bd){bd=r.dist[cap];best=cap}}}
    if(best&&setGoal(best))return;
  }
  /* sonst: bleiben, wo man ist (eigenes Gebiet) oder heimkehren */
  if(G.own[b.at]!==k&&b.at!==home){if(b.dest!==home)planArmy(b,home)}
  else{b.path=[];b.dest=null}
}

function aiTick(){
  for(const k of aliveKings()){
    if(k===PL)continue;
    const home=KINGS[k].capital;
    const athome=sideArmies(k).filter(x=>x.at===home);
    for(let i=1;i<athome.length;i++)mergeArmies(athome[0],athome[i]);
    for(const b of sideArmies(k))aiDecide(b);
  }
}

/* ---------- Simulation ---------- */
function landShare(k){return owned(k).length/Object.keys(NODES).length}
function capitalWarn(){
  if(G.over||G.K[PL].alive===false)return;
  const cap=KINGS[PL].capital;
  if(!G.hops){G.hops={};const q=[cap];G.hops[cap]=0;while(q.length){const u=q.shift();for(const {to} of ADJ[u])if(G.hops[to]===undefined){G.hops[to]=G.hops[u]+1;q.push(to)}}}
  if(!G.warned)G.warned={};
  for(const b of G.armies){
    if(!b.alive||b.side===PL)continue;
    const p=armyPos(b);
    if(!visibleAt(PL,p.x,p.y)){continue}
    const h=b.at!==null?G.hops[b.at]:Math.min(G.hops[b.from],G.hops[b.to]);
    if(h===undefined)continue;
    if(h>3){delete G.warned[b.id];continue}
    if(h<=2&&!G.warned[b.id]){
      G.warned[b.id]=1;
      logMsg('⚠ WARNUNG: '+b.name+' ('+KINGS[b.side].name+', ca. '+Math.round(troops(b)/10)*10+' Mann) nähert sich deiner Hauptburg – nur noch '+h+(h===1?' Dorf':' Dörfer')+' entfernt!','bad');
      if(G.speed>1)G.speed=1;
      if(typeof document!=='undefined'){ /* nicht blockierende Warnung, das Spiel läuft weiter */
        let w=document.getElementById('warnb');
        if(!w){w=document.createElement('div');w.id='warnb';document.body.appendChild(w)}
        w.textContent='⚠ '+b.name+' ('+KINGS[b.side].name+') nur noch '+h+(h===1?' Dorf':' Dörfer')+' vor deiner Hauptburg!';
        w.classList.remove('show');void w.offsetWidth;w.classList.add('show');
      }
    }
  }
}
function capitalThreat(){
  let best=null;
  for(const b of foesOf(PL)){
    if(!b.alive)continue;
    const p=armyPos(b);if(!visibleAt(PL,p.x,p.y))continue;
    const h=b.at!==null?G.hops[b.at]:Math.min(G.hops[b.from],G.hops[b.to]);
    if(h===undefined||h>2)continue;
    if(!best||h<best.h)best={b,h};
  }
  return best;
}
function secondTick(){

  if(G.time>=G.nextMonth)monthEnd();
  for(const k of aliveKings())completeOrders(k);
  for(const a of G.armies.slice())upkeep(a);
  fortCheck();routeChecks();capitalWarn();
  G.armies=G.armies.filter(a=>a.alive);
  for(const k of aliveKings())if(G.K[k].gar&&UK.some(u=>G.K[k].gar[u]>0))absorbGarrison(k);
}
function step(dt){
  if(G.over)return;
  G.time+=dt;
  for(const a of G.armies){
    if(!a.alive||G.time<a.haltUntil)continue;
    stepArmy(a,speedOf(a)/TURN_S*dt);
    if(G.over)return;
  }
  stepCarts(dt);
  collisions();
  updateParts(dt);updateFx(dt);
  G.accS+=dt;while(G.accS>=1&&!G.over){G.accS-=1;secondTick();
    /* stehende Heere übernehmen Orte, die ihnen (noch) nicht gehören */
    for(const a of G.armies.slice()){
      if(G.over)break;
      if(!a.alive||a.at===null||troops(a)<=0||a.units.scout>=troops(a))continue;
      const n=NODES[a.at];
      if(G.own[n.id]===a.side||enemyAt(a.side,n.id))continue;
      if(n.type==='castle'||isEco(n)||n.type==='tower')onArrive(a);
    }
  }
  G.accV+=dt;if(G.accV>=0.5){G.accV=0;refreshNew()}
  G.accAI+=dt;if(G.accAI>=AI_DT){G.accAI=0;aiTick()}
}
function simulate(total){
  let rem=total;
  while(rem>1e-9&&!G.over){const dt=Math.min(rem,0.25);rem-=dt;step(dt)}
}

function wallBand(c,lvl,a0,a1,rx,ry,cy,h){
  const N=26;
  for(let i=0;i<N;i++){
    const t0=a0+(a1-a0)*i/N,t1=a0+(a1-a0)*(i+1)/N;
    const x0=Math.cos(t0)*rx,y0=cy+Math.sin(t0)*ry,x1=Math.cos(t1)*rx,y1=cy+Math.sin(t1)*ry;
    const sh=0.5+0.5*Math.cos((t0+t1)/2-Math.PI*0.75);
    const v=Math.round(120+sh*70);
    c.fillStyle='rgb('+v+','+(v-8)+','+(v-22)+')';
    c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.lineTo(x1,y1-h);c.lineTo(x0,y0-h);c.closePath();c.fill();
    c.strokeStyle='rgba(40,30,20,.55)';c.lineWidth=.7;c.stroke();
    if(i%2===0){ /* Zinne */
      c.fillStyle='rgb('+(v+10)+','+(v+2)+','+(v-12)+')';
      c.beginPath();c.moveTo(x0,y0-h);c.lineTo(x1,y1-h);c.lineTo(x1,y1-h-3.6);c.lineTo(x0,y0-h-3.6);c.closePath();c.fill();c.stroke();

}

function lin(c,x0,y0,x1,y1,a,b){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function stoneBlock(c,x,y,w,h,base,dark,light){

}
function crenels(c,x,y,w,fill){
  c.fillStyle=fill;c.strokeStyle='#3D2E22';c.lineWidth=.9;

function tuft(c,x,y,s){c.strokeStyle='#4F7A33';c.lineWidth=1;c.beginPath();for(let i=-1;i<=1;i++){c.moveTo(x+i*s*0.5,y);c.lineTo(x+i*s*0.9,y-s*1.6)}c.stroke()}

const THATCH=['#C7A459','#8F7234'],DAUB=['#DCCFB0','#B09E78'],TIMB='#4A3220',EARTH=['#8A7048','#5E4A2E'];
function thatchRoof(c,x,y,w,h,over){
  const o=over===undefined?3:over;

  c.beginPath();c.moveTo(x-o,y+1);c.lineTo(x+w*0.5,y-h);c.lineTo(x+w+o,y+1);
  const n=Math.max(4,Math.round(w/3));for(let i=n;i>=0;i--){const px=x-o+(w+2*o)*i/n;c.lineTo(px,y+1+(i%2?1.8:0))}
  c.closePath();c.fill();c.stroke();
  c.strokeStyle='rgba(90,70,30,.45)';c.lineWidth=.5;
  for(let i=1;i<6;i++){const t=i/6;c.beginPath();c.moveTo(x+w*0.5+(-w*0.5-o)*t*0.9,y-h+(h+1)*t);c.lineTo(x+w*0.5+(w*0.5+o)*t*0.9,y-h+(h+1)*t);c.stroke()}

function hut(c,x,y,w,h,smoke){

  c.fillStyle='#2E2014';const dw=Math.max(2.6,w*0.2);c.beginPath();c.moveTo(x+w*0.4,y+h);c.lineTo(x+w*0.4,y+h-dw*1.3);c.arc(x+w*0.4+dw/2,y+h-dw*1.3,dw/2,Math.PI,0);c.lineTo(x+w*0.4+dw,y+h);c.closePath();c.fill();

let fogLast={x:0,y:0,s:0,t:-9,w:0,h:0,e:-1};

function updateFog(now){
  const fw=Math.ceil(cv.width/2),fh=Math.ceil(cv.height/2);
  if(fg.width!==fw||fg.height!==fh){fg.width=fw;fg.height=fh;fu.width=fw;fu.height=fh;fogLast.w=0}
  if(fogLast.w===fw&&fogLast.x===view.x&&fogLast.y===view.y&&fogLast.s===view.s&&now-fogLast.t<=140)return;
  const k=dpr*0.5;
  /* sichtbar / dunkel */
  fctx.setTransform(1,0,0,1,0,0);fctx.globalCompositeOperation='source-over';
  fctx.clearRect(0,0,fw,fh);
  fctx.fillStyle='rgba(40,29,16,.42)';fctx.fillRect(0,0,fw,fh);
  fctx.globalCompositeOperation='destination-out';
  for(const s of visSources(PL)){
    const sx=(s.x*view.s+view.x)*k,sy=(s.y*view.s+view.y)*k,rr=s.r*view.s*k;
    if(sx<-rr||sy<-rr||sx>fw+rr||sy>fh+rr)continue;
    const gr=fctx.createRadialGradient(sx,sy,rr*0.55,sx,sy,rr);
    gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');

  }

  uctx.clearRect(0,0,fw,fh);
  uctx.fillStyle='#2a2015';uctx.fillRect(0,0,fw,fh);
  /* feines Pergament-Muster auf dem Unbekannten */
  uctx.fillStyle='rgba(120,95,55,.10)';
  const step=46*view.s*k;
  if(step>8){for(let y=-((-view.y*k)%step);y<fh;y+=step)for(let x=-((-view.x*k)%step);x<fw;x+=step){uctx.fillRect(x,y,step*0.5,1.2)}}

  uctx.imageSmoothingEnabled=true;
  uctx.drawImage(explCv,0,0,GW,GW,view.x*k,view.y*k,W*view.s*k,H*view.s*k);
  fctx.globalCompositeOperation='source-over';
  fctx.drawImage(fu,0,0);
  fogLast={x:view.x,y:view.y,s:view.s,t:now,w:fw,h:fh};
}

const PB=(f)=>'<div class="pb"><i style="width:'+Math.round(f*100)+'%"></i></div>';
const UNAME={inf:'Fußvolk',bow:'Bogenschützen',cav:'Reiter',can:'Katapulte',scout:'Späher'};
function dirHints(){
  const cap=NODES[KINGS[PL].capital],out=[];
  const names=['Osten','Südosten','Süden','Südwesten','Westen','Nordwesten','Norden','Nordosten'];
  const cnt=new Array(8).fill(0),tot=new Array(8).fill(0);
  for(let gy=0;gy<GW;gy+=2)for(let gx=0;gx<GW;gx+=2){
    const x=(gx+.5)*EXP,y=(gy+.5)*EXP,dx=x-cap.x,dy=y-cap.y,d=Math.hypot(dx,dy);
    if(d<250||d>1500)continue;
    const o=Math.round(((Math.atan2(dy,dx)+6.283)%6.283)/(6.283/8))%8;
    tot[o]++;if(G.expl[gy*GW+gx])cnt[o]++;
  }
  for(let i=0;i<8;i++)if(tot[i]>20)out.push({n:names[i],f:cnt[i]/tot[i]});
  out.sort((a,b)=>a.f-b.f);
  return out.slice(0,2);
}
